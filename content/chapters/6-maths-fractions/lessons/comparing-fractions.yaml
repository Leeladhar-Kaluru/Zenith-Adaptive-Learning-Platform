slug: comparing-fractions
title: Comparing fractions
minutes: 14
objectives:
- Compare fractions with the same denominator
- Compare fractions with the same numerator
- Explain why a bigger denominator can mean smaller pieces
concepts:
- fractions-compare
origin: ai_assisted
blocks:
- kind: text
  heading: Same size pieces
  html: <p>When two fractions have the <strong>same denominator</strong>, the pieces are the same size. So the fraction with
    more pieces is greater. 5/8 is greater than 3/8 because 5 pieces is more than 3 pieces.</p>
- kind: widget
  widget: fraction
  config:
    num: 2
    den: 6
- kind: text
  heading: Same number of pieces
  html: <p>When two fractions have the <strong>same numerator</strong>, you take the same number of pieces. The fraction with
    the bigger denominator has smaller pieces. So 1/8 is smaller than 1/4.</p>
- kind: example
  heading: Worked example
  prompt: Which is greater, 3/5 or 3/8?
  steps:
  - Both fractions have the same numerator, 3.
  - The denominators are 5 and 8. A bigger denominator means smaller pieces.
  - 8 is bigger than 5, so 3/8 is made of smaller pieces.
  - So 3/5 is greater than 3/8.
- kind: callout
  tone: watch
  html: A bigger denominator does not make a bigger fraction. 1/10 is much smaller than 1/2.
- kind: callout
  tone: real
  html: If two friends share the same chocolate, 1/2 of it is a bigger share than 1/4 of it.
- kind: figure
  svg: <svg viewBox="0 0 320 120" role="img"><rect x="20" y="15" width="150" height="30" fill="#ffd43b"/><rect x="20" y="15"
