slug: sangya-ke-bhed
title: संज्ञा और उसके भेद
minutes: 20
language: hi
objectives:
- संज्ञा की पहचान करना
- व्यक्तिवाचक, जातिवाचक और भाववाचक संज्ञा में अंतर बताना
- विशेषण या दूसरी संज्ञा से भाववाचक संज्ञा बनाना
concepts:
- hindi-sangya
origin: ai_assisted
blocks:
- kind: text
  heading: नाम के बिना बात कैसे होगी?
  html: '<p>सोचिए, आपको अपनी कक्षा की किसी चीज़ के बारे में बताना है, पर आपके पास किसी का नाम नहीं है। न बच्चे का, न किताब का, न स्कूल का। बात करना बहुत कठिन हो जाएगा। इन्हीं नामों को हम <strong>संज्ञा</strong> कहते हैं।</p><p>किसी व्यक्ति, वस्तु, स्थान या भाव के नाम को <strong>संज्ञा</strong> कहते हैं। जैसे: <em>सीमा, किताब, स्कूल, खुशी</em>। वाक्य “सीमा रोज़ स्कूल जाती है” में “सीमा” और “स्कूल” संज्ञाएँ हैं।</p>'
- kind: text
  heading: संज्ञा के तीन भेद
  html: '<p><strong>व्यक्तिवाचक संज्ञा</strong> किसी एक विशेष व्यक्ति, वस्तु या स्थान का नाम बताती है। जैसे: मोहन, गंगा, दिल्ली, ताजमहल।</p><p><strong>जातिवाचक संज्ञा</strong> एक ही प्रकार की सभी चीज़ों का नाम बताती है। जैसे: लड़का, नदी, शहर, पर्वत। यहाँ किसी एक का विशेष नाम नहीं है।</p><p><strong>भाववाचक संज्ञा</strong> किसी गुण, दशा या भाव का नाम बताती है। जैसे: मिठास, बचपन, ईमानदारी, खुशी। इन्हें हम देख या छू नहीं सकते, केवल अनुभव कर सकते हैं।</p>'
- kind: figure
  svg: '<svg viewBox="0 0 360 170" role="img"><g fill="none" stroke="#14193a" stroke-width="2"><rect x="8" y="30" width="108" height="100" rx="8"/><rect x="126" y="30" width="108" height="100" rx="8"/><rect x="244" y="30" width="108" height="100" rx="8"/></g><g font-size="13" font-weight="700" fill="currentColor" text-anchor="middle"><text x="62" y="22">व्यक्तिवाचक</text><text x="180" y="22">जातिवाचक</text><text x="298" y="22">भाववाचक</text></g><g font-size="13" fill="currentColor" text-anchor="middle"><text x="62" y="62">मोहन</text><text x="62" y="86">गंगा</text><text x="62" y="110">दिल्ली</text><text x="180" y="62">लड़का</text><text x="180" y="86">नदी</text><text x="180" y="110">शहर</text><text x="298" y="62">मिठास</text><text x="298" y="86">बचपन</text><text x="298" y="110">खुशी</text></g><text x="62" y="152" font-size="11" text-anchor="middle" fill="currentColor">एक विशेष नाम</text><text x="180" y="152" font-size="11" text-anchor="middle" fill="currentColor">पूरी जाति का नाम</text><text x="298" y="152" font-size="11" text-anchor="middle" fill="currentColor">गुण, दशा या भाव</text></svg>'
  alt: तीन डिब्बों वाला चित्र जिसमें व्यक्तिवाचक, जातिवाचक और भाववाचक संज्ञा के तीन-तीन उदाहरण लिखे हैं।
  caption: संज्ञा के तीन भेद और हर भेद के उदाहरण।
- kind: text
  heading: भाववाचक संज्ञा कैसे बनती है?
  html: '<p>बहुत-सी भाववाचक संज्ञाएँ दूसरे शब्दों से बनती हैं। विशेषण (गुण बताने वाले शब्द) से: मीठा से <em>मिठास</em>, सुंदर से <em>सुंदरता</em>, बूढ़ा से <em>बुढ़ापा</em>। जातिवाचक संज्ञा से: बच्चा से <em>बचपन</em>, चोर से <em>चोरी</em>, मित्र से <em>मित्रता</em>।</p><p>शब्द के अंत में जुड़ने वाले ये टुकड़े (ता, पन, आस, आपा, ई) पहचान में मदद करते हैं।</p>'
- kind: example
  heading: हल किया हुआ उदाहरण
  prompt: 'वाक्य में संज्ञाएँ छाँटिए और उनका भेद बताइए: “मोहन ने मीठा आम खाया और उसकी मिठास की प्रशंसा की।”'
  steps:
  - 'पहले वाक्य को ध्यान से पढ़ें और नाम बताने वाले शब्द ढूँढें: मोहन, आम, मिठास।'
  - '“मोहन” किसी एक विशेष व्यक्ति का नाम है, इसलिए यह व्यक्तिवाचक संज्ञा है।'
  - '“आम” एक पूरी जाति का नाम है, किसी एक आम का विशेष नाम नहीं, इसलिए यह जातिवाचक संज्ञा है।'
  - '“मिठास” स्वाद का गुण है, जिसे छू नहीं सकते, इसलिए यह भाववाचक संज्ञा है। जाँच: “मीठा” गुण बताता है, इसलिए वह संज्ञा नहीं है।'
- kind: example
  heading: हल किया हुआ उदाहरण
  prompt: '“सुंदर” शब्द से भाववाचक संज्ञा बनाइए और उसे वाक्य में प्रयोग कीजिए।'
  steps:
  - '“सुंदर” गुण बताने वाला शब्द है। इसे संज्ञा बनाने के लिए अंत में “ता” जोड़ना है।'
  - 'सुंदर + ता = सुंदरता।'
  - 'वाक्य: “इस बाग़ की सुंदरता सबको भाती है।”'
  - 'जाँच: “सुंदरता” गुण का नाम है और इसे देख या छू नहीं सकते, इसलिए यह भाववाचक संज्ञा है।'
- kind: callout
  tone: watch
  html: 'गुण बताने वाला हर शब्द भाववाचक संज्ञा नहीं होता। “सुंदर” गुण बताता है, इसलिए वह विशेषण है। गुण का नाम “सुंदरता” भाववाचक संज्ञा है।'
- kind: callout
  tone: real
  html: 'पत्र या पते में अपना नाम, गाँव और शहर लिखना व्यक्तिवाचक संज्ञाओं का प्रयोग है। ये नाम केवल एक विशेष व्यक्ति या स्थान के होते हैं, इसलिए पते में इन्हें ठीक-ठीक लिखना ज़रूरी है।'
- kind: check
  item: q-sg-1
- kind: check
  item: q-sg-2
