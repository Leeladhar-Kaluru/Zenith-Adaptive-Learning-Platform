slug: solving-quadratics
title: Solving quadratic equations
minutes: 35
objectives:
- Write a quadratic equation in standard form and name a, b and c
- Solve a quadratic equation by factorising and by the quadratic formula
- Use the discriminant to say how many real roots an equation has
- Turn a word problem into a quadratic equation, solve it and reject answers that do not fit
concepts:
- quadratic-equations
origin: ai_assisted
blocks:
- kind: text
  heading: When the unknown is squared
  html: '<p>A farmer has a rectangular field. Its length is 3 m more than its width, and its area is 70 m<sup>2</sup>. If the width is x, the length is x + 3, and the area gives x(x + 3) = 70. When this is multiplied out, x<sup>2</sup> appears. An equation like that is not a straight-line (linear) equation.</p><p>A <strong>quadratic equation</strong> is an equation that can be written in the <strong>standard form</strong> ax<sup>2</sup> + bx + c = 0, where a, b and c are numbers and a is <em>not zero</em>. The numbers a, b and c are the coefficients. A value of x that makes the equation true is called a <strong>root</strong> of it. Solving the equation means finding all its roots.</p>'
- kind: text
  heading: Solving by factorising
  html: '<p>Factorising uses one fact: if two numbers multiply to give 0, then at least one of them is 0. So if (x − 2)(x − 3) = 0, then x − 2 = 0 or x − 3 = 0.</p><p>The steps are: (1) move every term to one side so that the other side is 0; (2) split the quadratic into two brackets; (3) set each bracket equal to 0 and solve. To split x<sup>2</sup> + bx + c, look for two numbers whose <strong>product is c</strong> and whose <strong>sum is b</strong>.</p>'
- kind: example
  heading: Worked example
  prompt: Solve x^2 − 5x + 6 = 0 by factorising.
  steps:
  - 'The right side is already 0. Here b = −5 and c = 6. We need two numbers with product 6 and sum −5.'
  - 'The numbers −2 and −3 work, since (−2) × (−3) = 6 and (−2) + (−3) = −5. So x^2 − 5x + 6 = (x − 2)(x − 3) = 0.'
  - 'Set each bracket to 0. x − 2 = 0 gives x = 2, and x − 3 = 0 gives x = 3.'
  - 'Check x = 2: 4 − 10 + 6 = 0. Check x = 3: 9 − 15 + 6 = 0. Both roots work.'
- kind: figure
  svg: '<svg viewBox="0 0 300 240" role="img"><line x1="10" y1="160" x2="285" y2="160" stroke="#14193a" stroke-width="2.5"/><line x1="50" y1="0" x2="50" y2="235" stroke="#14193a" stroke-width="2.5"/><path d="M50 40 Q130 360 210 40" fill="none" stroke="#ffb800" stroke-width="4"/><circle cx="90" cy="160" r="5" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><circle cx="170" cy="160" r="5" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><circle cx="130" cy="200" r="4" fill="#14193a"/><text x="90" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">x = 1</text><text x="170" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">x = 3</text><text x="138" y="222" font-size="12" fill="currentColor">lowest point (2, −1)</text><text x="295" y="18" font-size="12" font-weight="700" text-anchor="end" fill="currentColor">y = x² − 4x + 3</text><text x="288" y="156" font-size="12" font-weight="700" fill="currentColor">x</text><text x="56" y="12" font-size="12" font-weight="700" fill="currentColor">y</text></svg>'
  alt: A U-shaped curve opening upward that crosses the horizontal x-axis at x equals 1 and x equals 3, with its lowest point at 2, minus 1.
  caption: The graph of y = x² − 4x + 3 crosses the x-axis at x = 1 and x = 3. These two crossing points are the two roots of x² − 4x + 3 = 0.
- kind: text
  heading: The quadratic formula
  html: '<p>Many quadratics do not factorise easily. A formula always works. For ax<sup>2</sup> + bx + c = 0, the roots are <strong>x = (−b ± √(b<sup>2</sup> − 4ac)) ÷ (2a)</strong>. The sign ± means "do it once with plus and once with minus", which gives the two roots.</p><p>The part under the square root, <strong>D = b<sup>2</sup> − 4ac</strong>, is called the <strong>discriminant</strong>. It tells you about the roots before you finish. If D is positive, there are <strong>two different real roots</strong>. If D = 0, there is <strong>one repeated root</strong>, x = −b ÷ (2a). If D is negative, there is <strong>no real root</strong>, because a negative number has no real square root. On a graph, these three cases are a curve that crosses the x-axis twice, touches it once, or misses it.</p>'
- kind: example
  heading: Worked example
  prompt: Solve 2x^2 + 3x − 5 = 0 using the formula.
  steps:
  - 'Read off the coefficients: a = 2, b = 3, c = −5.'
  - 'Find the discriminant: D = b^2 − 4ac = 9 − 4 × 2 × (−5) = 9 + 40 = 49. D is positive, so there are two real roots. The square root of 49 is 7.'
  - 'Put the numbers in: x = (−3 ± 7) ÷ 4. With plus: x = 4 ÷ 4 = 1. With minus: x = −10 ÷ 4 = −5/2.'
  - 'Check x = 1: 2 + 3 − 5 = 0. Check x = −5/2: 2 × 25/4 − 15/2 − 5 = 12.5 − 7.5 − 5 = 0. Both roots work.'
- kind: example
  heading: Worked example
  prompt: The length of a rectangle is 3 m more than its width, and its area is 70 m^2. Find the width and the length.
  steps:
  - 'Let the width be x metres. The length is x + 3 metres. The area is x(x + 3) = 70.'
  - 'Multiply out and move 70 to the left: x^2 + 3x − 70 = 0. We need two numbers with product −70 and sum 3. These are 10 and −7.'
  - 'So (x + 10)(x − 7) = 0, which gives x = −10 or x = 7.'
  - 'A width cannot be negative, so we reject −10. The width is 7 m and the length is 10 m. Check: 7 × 10 = 70 and 10 is 3 more than 7.'
- kind: callout
  tone: watch
  html: Move everything to one side so the other side is 0 <em>before</em> you factorise. For x(x − 3) = 4, you cannot say x = 4 or x − 3 = 4. First write x<sup>2</sup> − 3x − 4 = 0. Also, in a word problem always check that each root makes sense, for example a length cannot be negative.
- kind: callout
  tone: real
  html: Quadratic equations appear whenever an area is found from two sides that depend on each other, such as a garden, a room or a printed poster. They are also used to work out the path of a ball thrown into the air, and the best price or size to make something.
- kind: check
  item: q-qd-1
- kind: check
  item: q-qd-2
- kind: check
  item: q-qd-3
- kind: summary
  points:
  - 'A quadratic equation has the standard form ax^2 + bx + c = 0 with a not zero. Its solutions are called roots.'
  - 'To factorise, make the right side 0, find two numbers with product c and sum b, and set each bracket to 0.'
  - 'The quadratic formula is x = (−b ± √(b^2 − 4ac)) ÷ (2a). The discriminant is D = b^2 − 4ac.'
  - 'D > 0 gives two different real roots, D = 0 gives one repeated root, and D < 0 gives no real roots. In word problems, reject roots that do not fit the situation.'
items:
- key: q-qd-1
  kind: mcq
  stem: Which of these is a quadratic equation?
  difficulty: intro
  purpose: check
  concepts:
  - id: quadratic-equations
  explanation: A quadratic equation has x squared as its highest power. Only x^2 − 9 = 0 does. The others are linear or have x cubed.
  hints:
  - Look for the highest power of x.
  correct: B
  options:
  - key: A
    text: 3x + 7 = 0
    misconception: degree-confusion
  - key: B
    text: x^2 − 9 = 0
  - key: C
    text: x^3 − x = 0
    misconception: degree-confusion
  - key: D
    text: 2x − 5 = x + 1
    misconception: degree-confusion
- key: q-qd-2
  kind: numeric
  stem: What is the discriminant of 3x^2 − 2x − 1 = 0?
  difficulty: intro
  purpose: check
  concepts:
  - id: quadratic-equations
  explanation: a = 3, b = −2, c = −1. D = b^2 − 4ac = (−2)^2 − 4 × 3 × (−1) = 4 + 12 = 16.
  hints:
  - Take care with the minus signs when you square b and when you multiply 4ac.
  value: 16
  tolerance: 0.0
  verify: (-2)**2 - 4*3*(-1)
- key: q-qd-3
  kind: numeric
  stem: Solve x^2 − 7x + 12 = 0. What is the larger root?
  difficulty: intro
  purpose: check
  concepts:
  - id: quadratic-equations
  explanation: The numbers with product 12 and sum −7 are −3 and −4, so (x − 3)(x − 4) = 0. The roots are 3 and 4, and the larger one is 4.
  hints:
  - Find two numbers that multiply to 12 and add to −7.
  value: 4
  tolerance: 0.0
  verify: (7 + sqrt(49 - 48))/2
- key: q-qd-4
  kind: mcq
  stem: What is the nature of the roots of x^2 + 4x + 4 = 0?
  difficulty: standard
  purpose: practice
  concepts:
  - id: quadratic-equations
  explanation: D = 16 − 4 × 1 × 4 = 0. When D is 0 the two roots are equal. Here x^2 + 4x + 4 = (x + 2)^2, so the repeated root is −2.
  hints:
  - Work out b^2 − 4ac first.
  correct: C
  options:
  - key: A
    text: Two different real roots
    misconception: discriminant-sign
  - key: B
    text: No real roots
    misconception: discriminant-sign
  - key: C
    text: Two equal real roots
  - key: D
    text: One root, which is 0
- key: q-qd-5
  kind: numeric
  stem: The equation x^2 + x − 6 = 0 has one positive root. What is it?
  difficulty: standard
  purpose: practice
  concepts:
  - id: quadratic-equations
  explanation: (x + 3)(x − 2) = 0, so x = −3 or x = 2. The positive root is 2. By the formula, x = (−1 + √25) ÷ 2 = 2.
  hints:
  - Find two numbers with product −6 and sum 1.
  value: 2
  tolerance: 0.0
  verify: (-1 + sqrt(1 + 24))/2
- key: q-qd-6
  kind: mcq
  stem: You want to solve x(x − 3) = 4 by factorising. What should you do first?
  difficulty: standard
  purpose: practice
  concepts:
  - id: quadratic-equations
  explanation: The zero product rule only works when the product equals 0. So multiply out and move the 4 across to get x^2 − 3x − 4 = 0, and then factorise to (x − 4)(x + 1) = 0.
  hints:
  - What must the other side be before you can say one bracket is zero?
  correct: A
  options:
  - key: A
    text: Write it as x^2 − 3x − 4 = 0
  - key: B
    text: Say x = 4 or x − 3 = 4
    misconception: not-zero-rhs
  - key: C
    text: Divide both sides by x
    misconception: not-zero-rhs
  - key: D
    text: Say x = 0 or x − 3 = 4
    misconception: not-zero-rhs
- key: q-qd-7
  kind: mcq
  stem: What are the roots of 2x^2 − 7x + 3 = 0?
  difficulty: standard
  purpose: practice
  concepts:
  - id: quadratic-equations
  explanation: a = 2, b = −7, c = 3. D = 49 − 24 = 25. Then x = (7 ± 5) ÷ 4, which gives 3 and 1/2. The first part of the formula is −b = +7, not −7.
  hints:
  - What is −b when b is −7?
  correct: A
  options:
  - key: A
    text: 3 and 1/2
  - key: B
    text: −3 and −1/2
    misconception: formula-sign-of-b
  - key: C
    text: 6 and 1
  - key: D
    text: 3 and −1/2
- key: q-qd-8
  kind: numeric
  stem: For which value of k does x^2 − 6x + k = 0 have two equal real roots?
  difficulty: challenge
  purpose: test
  concepts:
  - id: quadratic-equations
  explanation: Equal roots need D = 0. Here D = 36 − 4k. Setting 36 − 4k = 0 gives k = 9. Then x^2 − 6x + 9 = (x − 3)^2.
  hints:
  - Write D in terms of k and make it equal to 0.
  value: 9
  tolerance: 0.0
  verify: 36/4
- key: q-qd-9
  kind: mcq
  stem: 'Assertion (A): The equation x^2 + 1 = 0 has no real roots. Reason (R): The discriminant of x^2 + 1 = 0 is negative.'
  difficulty: standard
  purpose: test
  concepts:
  - id: quadratic-equations
  explanation: Here a = 1, b = 0 and c = 1, so D = 0 − 4 = −4. A negative discriminant means no real roots. So both are true, and R explains A.
  hints:
  - Work out b^2 − 4ac with a = 1, b = 0 and c = 1.
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
- key: q-qd-10
  kind: mcq
  stem: 'Assertion (A): Every quadratic equation has two different real roots. Reason (R): The discriminant of ax^2 + bx + c = 0 is b^2 − 4ac.'
  difficulty: challenge
  purpose: test
  concepts:
  - id: quadratic-equations
  explanation: R is true, but A is false. A quadratic can have two equal roots (D = 0) or no real roots (D < 0). For example x^2 + 1 = 0 has none.
  hints:
  - Think of an equation with D = 0 or D below 0.
  correct: D
  options:
  - key: A
    text: Both A and R are true, and R explains A
    misconception: discriminant-sign
  - key: B
    text: Both A and R are true, but R does not explain A
    misconception: discriminant-sign
  - key: C
    text: A is true, but R is false
    misconception: discriminant-sign
  - key: D
    text: A is false, but R is true
- key: q-qd-11
  kind: mcq
  stem: 'Read this. A rectangular plot has an area of 150 square metres. Its length is 5 m more than its width. Let the width be x metres. Which equation gives x?'
  difficulty: standard
  purpose: test
  concepts:
  - id: quadratic-equations
  explanation: The length is x + 5, so the area is x(x + 5) = 150. Moving 150 across gives x^2 + 5x − 150 = 0.
  hints:
  - Write the length in terms of x, then area = length × width.
  correct: C
  options:
  - key: A
    text: x + (x + 5) = 150
    misconception: perimeter-for-area
  - key: B
    text: x^2 + 5 = 150
    misconception: degree-confusion
  - key: C
    text: x^2 + 5x − 150 = 0
  - key: D
    text: x^2 − 5x − 150 = 0
- key: q-qd-12
  kind: numeric
  stem: 'Use the same plot: the area is 150 square metres and the length is 5 m more than the width. What is the width, in metres?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: quadratic-equations
  explanation: x^2 + 5x − 150 = 0 factorises as (x + 15)(x − 10) = 0. The roots are −15 and 10. A width cannot be negative, so the width is 10 m. Check 10 × 15 = 150.
  hints:
  - Find two numbers with product −150 and sum 5. Then reject any negative width.
  value: 10
  tolerance: 0.0
  verify: (-5 + sqrt(25 + 600))/2
- key: q-qd-13
  kind: numeric
  stem: The product of two consecutive positive integers is 72. What is the smaller integer?
  difficulty: challenge
  purpose: test
  concepts:
  - id: quadratic-equations
  explanation: Let the smaller be x. Then x(x + 1) = 72, so x^2 + x − 72 = 0, which is (x + 9)(x − 8) = 0. The roots are −9 and 8. The integers are positive, so x = 8 (and 8 × 9 = 72).
  hints:
  - Call the integers x and x + 1. Then find two numbers with product −72 and sum 1.
  value: 8
  tolerance: 0.0
  verify: (-1 + sqrt(1 + 288))/2
- key: q-qd-14
  kind: mcq
  stem: The roots of a word problem equation are 7 and −10, and the unknown is the width of a rectangle in metres. What should you do with the root −10?
  difficulty: standard
  purpose: practice
  concepts:
  - id: quadratic-equations
  explanation: A width is a length, and a length cannot be negative. So −10 solves the equation but does not fit the situation. We reject it and keep 7.
  hints:
  - Does a negative width make sense?
  correct: B
  options:
  - key: A
    text: Keep both, so the width is 7 m and also −10 m
    misconception: keeps-impossible-root
  - key: B
    text: Reject it, because a width cannot be negative
  - key: C
    text: Use its size, 10, as a second answer
    misconception: keeps-impossible-root
  - key: D
    text: Add it to 7 to get −3
- key: q-qd-15
  kind: mcq
  stem: Is (x + 1)^2 = x^2 + 3 a quadratic equation?
  difficulty: challenge
  purpose: test
  concepts:
  - id: quadratic-equations
  explanation: Expand the left side to get x^2 + 2x + 1 = x^2 + 3. The x^2 terms cancel and leave 2x − 2 = 0. That is linear, so it is not quadratic.
  hints:
  - Expand (x + 1)^2 and see what happens to the x^2 terms.
  correct: D
  options:
  - key: A
    text: Yes, because it has a square in it
    misconception: degree-confusion
  - key: B
    text: Yes, because (x + 1)^2 is a square
    misconception: degree-confusion
  - key: C
    text: Yes, with a = 2
    misconception: degree-confusion
  - key: D
    text: No, because the x^2 terms cancel and it becomes linear
misconceptions:
- code: degree-confusion
  concept: quadratic-equations
  description: Judges an equation by whether a square appears, not by whether x^2 is left as the highest power after simplifying.
- code: not-zero-rhs
  concept: quadratic-equations
  description: Uses the zero product rule when the other side is not 0, for example splitting x(x - 3) = 4 into x = 4 or x - 3 = 4.
- code: formula-sign-of-b
  concept: quadratic-equations
  description: Uses b instead of -b at the start of the quadratic formula, so the signs of the roots come out wrong.
- code: discriminant-sign
  concept: quadratic-equations
  description: Mixes up what a positive, zero or negative discriminant says about the roots, or thinks every quadratic has two different real roots.
- code: keeps-impossible-root
  concept: quadratic-equations
  description: Keeps a root that does not fit the situation, such as a negative length, instead of rejecting it.
- code: perimeter-for-area
  concept: quadratic-equations
  description: Adds the sides instead of multiplying them when forming an equation from an area.
cards:
- key: solving-quadratics-card-1
  concept: quadratic-equations
  front: What is the standard form of a quadratic equation?
  back: ax^2 + bx + c = 0, where a is not zero.
- key: solving-quadratics-card-2
  concept: quadratic-equations
  front: State the quadratic formula.
  back: x = (−b ± √(b^2 − 4ac)) ÷ (2a).
- key: solving-quadratics-card-3
  concept: quadratic-equations
  front: What does the discriminant D = b^2 − 4ac tell you?
  back: D > 0 gives two different real roots, D = 0 gives two equal roots, and D < 0 gives no real roots.
- key: solving-quadratics-card-4
  concept: quadratic-equations
  front: What must you check at the end of a word problem?
  back: Check that each root makes sense. Reject roots that are impossible, such as a negative length.
