  task: Find the Ganga on the map. Then find the Yamuna and the Narmada. Which of the two lies closer to the Ganga?
- kind: text
  heading: Himalayan rivers
  html: '<p>The Ganga, the Yamuna, the Brahmaputra and the Indus are Himalayan rivers. They begin in or near the high mountains
    where snow and glaciers store water. The Ganga begins from the Gangotri glacier, where it is called the Bhagirathi. The Yamuna
    joins the Ganga at Prayagraj. The Ganga then flows east and reaches the <strong>Bay of Bengal</strong>. The Brahmaputra
    joins the Ganga near the end of its journey and they reach the Bay of Bengal together. The Indus flows west and reaches
    the <strong>Arabian Sea</strong>.</p><p>Himalayan rivers are <strong>perennial</strong>, which means they have water all year.
    In summer, snow and glaciers melt and fill them. In the rainy season, rain adds more water. In the long run, they
    cut deep valleys in the mountains and spread rich soil across the plains.</p>'
