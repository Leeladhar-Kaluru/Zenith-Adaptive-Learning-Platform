    y1="54" x2="230" y2="66" stroke="currentColor" stroke-width="2"/><text x="230" y="86">6</text><line x1="265" y1="54" x2="265"
    y2="66" stroke="currentColor" stroke-width="2"/><text x="265" y="86">7</text><line x1="300" y1="54" x2="300" y2="66" stroke="currentColor"
