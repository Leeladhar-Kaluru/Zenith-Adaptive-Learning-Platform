slug: cells-the-unit-of-life
title: The cell, the unit of life
minutes: 25
objectives:
- Say why the cell is called the unit of life
- Name the cell membrane, cytoplasm and nucleus and give the job of each
- Name the cell wall, chloroplasts and large vacuole of a plant cell and give the job of each
- Compare a plant cell with an animal cell
concepts:
- cell-unit-of-life
origin: ai_assisted
blocks:
- kind: text
  heading: Tiny rooms that make up living things
  html: '<p>A wall is built from many bricks. A living thing is built from many tiny parts called <strong>cells</strong>.
    A cell is the smallest part of an organism that can carry out the jobs of life by itself. This is why we call the cell
    the <strong>unit of life</strong>.</p><p>Most cells are too small to see with the eye alone. We need a microscope. Some
    living things, such as an amoeba, are just one cell. Others, such as a banana plant or a dog, are made of very many cells.
    Cells were first seen in 1665 by Robert Hooke, who looked at a thin slice of cork.</p>'
- kind: text
  heading: Parts found in plant and animal cells
  html: '<p>Plant cells and animal cells share three main parts.</p><p>The <strong>cell membrane</strong> is a thin, soft
    covering around the cell. It controls what goes into the cell and what comes out.</p><p>The <strong>cytoplasm</strong>
    is the jelly-like fluid inside the cell membrane. It is not empty. Many small parts of the cell float in it and many of
    the cell''s jobs happen there.</p><p>The <strong>nucleus</strong> is usually a round body inside the cytoplasm. It acts
    like the control room. It controls what the cell does and holds the material that carries the instructions for the living
    thing.</p>'
- kind: text
  heading: Extra parts in a plant cell
  html: '<p>A plant cell has three things that an animal cell does not have in the same way.</p><p>The <strong>cell wall</strong>
    is a stiff layer outside the cell membrane. It is made of a tough material called cellulose. It gives the plant cell a
    fixed shape and strength.</p><p><strong>Chloroplasts</strong> are small green bodies in the cytoplasm. They hold a green
    substance called chlorophyll. Chlorophyll traps light energy so the plant can make food by photosynthesis.</p><p>The
    <strong>vacuole</strong> is a space in the cell that holds water and other substances. A mature plant cell usually has
    one <strong>large vacuole</strong> in the middle. It helps keep the cell firm. Animal cells may have vacuoles too, but
    they are small and there are usually several.</p>'
