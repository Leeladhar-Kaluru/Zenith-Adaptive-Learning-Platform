  explanation: Both statements are true. Long wearing down by wind and water has lowered the old Aravalli, so R explains A.
  hints:
  - Old mountains have had more time to wear down.
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
    misconception: old-means-tall
  - key: C
    text: A is true, but R is false
    misconception: old-means-tall
  - key: D
    text: A is false, but R is true
    misconception: old-means-tall
- key: q-sg-10
  kind: mcq
  stem: 'A student looks at the map layers and writes: "The Himalayas area ends exactly at the border of the polygon, so the range is exactly that wide." What is wrong with this?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: india-relief
  explanation: The ranges and plateaus on the layer are approximate areas. They show roughly where a feature lies, so exact widths or edges cannot be read from them.
  hints:
  - Read again how the ranges layer is described in the lesson.
  correct: C
  options:
  - key: A
    text: Nothing is wrong, the borders on the map are exact
    misconception: map-areas-exact
  - key: B
    text: The Himalayas are not on the map
  - key: C
    text: The areas are approximate, so exact edges cannot be read from them
  - key: D
    text: The Himalayas are a desert
    misconception: desert-is-mountain
- key: q-sg-11
  pattern: case
  kind: mcq
  stem: 'Read this note. A class compares two hill ranges. Range P is close to the west coast, almost unbroken, and its tallest peak on the layer is Anamudi at 2,695 m. Range Q is near the east coast, lower and broken into pieces by rivers, and its tallest peak on the layer is Mahendragiri at 1,501 m. Which statement is correct?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: india-relief
  explanation: Range P is the Western Ghats and range Q is the Eastern Ghats. P is taller on the layer by 2,695 - 1,501 = 1,194 m.
  hints:
  - The coast and the broken shape tell you which range is which.
  correct: B
  options:
  - key: A
    text: P is the Eastern Ghats and Q is the Western Ghats
    misconception: ghats-same
  - key: B
    text: P is the Western Ghats and Q is the Eastern Ghats
  - key: C
    text: Both P and Q are the Western Ghats
    misconception: ghats-same
  - key: D
    text: Both P and Q are part of the Himalayas
    misconception: old-means-tall
- key: q-sg-12
  kind: numeric
  stem: Kangchenjunga is 8,586 m and Anamudi is 2,695 m. What is the difference in height, in metres?
  difficulty: challenge
  purpose: test
  concepts:
  - id: india-relief
  explanation: 8,586 - 2,695 = 5,891 m.
  hints:
  - Subtract the smaller height from the larger.
  value: 5891
  tolerance: 0.0
  verify: 8586-2695
misconceptions:
- code: old-means-tall
  concept: india-relief
  description: Thinks that an older mountain range must be taller. Very old ranges have been worn down and are lower than young ranges such as the Himalayas.
- code: ghats-same
  concept: india-relief
  description: Treats the Western and Eastern Ghats as the same kind of range, when the Western Ghats are higher and nearly continuous and the Eastern Ghats are lower and broken.
- code: desert-is-mountain
  concept: india-relief
  description: Mixes up the Thar Desert, a dry sandy region in the north-west, with mountain ranges or other regions.
- code: mountains-no-effect
  concept: india-relief
  description: Thinks mountains have no effect on weather, when they block winds and make moist winds drop rain and snow.
- code: map-areas-exact
  concept: india-relief
  description: Reads the approximate areas of ranges and plateaus on a map as exact borders.
cards:
- key: mountains-plateaus-thar-card-1
  concept: india-relief
  front: What kind of mountains are the Himalayas?
  back: Young fold mountains in the north, with snow and glaciers on the highest parts.
- key: mountains-plateaus-thar-card-2
  concept: india-relief
  front: How do the Western Ghats differ from the Eastern Ghats?
  back: The Western Ghats are higher, nearly continuous and close to the west coast. The Eastern Ghats are lower and broken by rivers.
- key: mountains-plateaus-thar-card-3
  concept: india-relief
  front: Where is the Thar Desert?
  back: In the north-west, mostly in western Rajasthan, to the west of the Aravalli Range.
- key: mountains-plateaus-thar-card-4
  concept: india-relief
  front: How exact are the range and plateau areas on the ZENITH map?
  back: They are approximate areas. They show where a feature lies, not its exact borders.
