concepts:
  - {id: english-main-idea, title: "Main idea and supporting details", grade: 9, subject: english, description: "The main idea is the one point a short passage is about as a whole. Details are the smaller facts, examples and events that support it. A detail is not the main idea.", keywords: [main idea, supporting detail, summary, title, passage]}
  - {id: english-inference, title: "Inference and tone", grade: 9, subject: english, description: "An inference is a reasonable conclusion built from clues in the text and what you already know. Tone is the writer's attitude, shown through word choice and details.", keywords: [inference, clue, evidence, tone, attitude]}
  - {id: english-context-clues, title: "Meaning of words from context", grade: 9, subject: english, description: "The words and sentences around an unknown word often give clues to its meaning. Reading them closely lets you work out the meaning and check that it fits.", keywords: [context clue, vocabulary, meaning, unknown word]}
