    text: Cell wall
- key: q-cl-5
  kind: truefalse
  stem: 'True or false: Every cell in a plant contains chloroplasts.'
  difficulty: standard
  purpose: practice
  concepts:
  - id: cell-unit-of-life
  explanation: False. Chloroplasts are found in cells that receive light, such as leaf cells. Root cells have none.
  hints:
  - Think of cells under the soil.
  correct: false
- key: q-cl-6
  kind: match
  stem: Match each cell part to its job.
  difficulty: standard
  purpose: practice
  concepts:
  - id: cell-unit-of-life
  explanation: The nucleus controls the cell, chloroplasts trap light for making food, the cell wall gives stiff support, and the large vacuole stores water and keeps the cell firm.
  hints:
  - Link each part to the word in its job.
  pairs:
    Nucleus: Controls the activities of the cell
    Chloroplast: Traps light to make food
    Cell wall: Gives the plant cell strength and fixed shape
    Large vacuole: Holds water and helps keep the cell firm
