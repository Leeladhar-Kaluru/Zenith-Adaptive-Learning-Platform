slug: longitudes-and-time
title: Longitudes, the prime meridian and time
minutes: 25
objectives:
- Explain that longitude tells how far a place is east or west of the prime meridian
- Name the prime meridian and the standard meridian of India
- Work out the time difference between two longitudes using 4 minutes for each degree
- Say why a country needs one standard time
concepts:
- longitudes-time
origin: ai_assisted
blocks:
- kind: text
  heading: Lines from pole to pole
  html: <p>Latitudes tell north or south. To pin down a place we also need an east-west address. For that we draw half-circles that run from the North Pole to the South Pole. Each one is a <strong>meridian of longitude</strong>. All meridians are the same length and they meet at the poles.</p><p><strong>Longitude</strong> is the angle that tells how far a place is east or west of a starting meridian. It is also measured in degrees.</p>
- kind: text
  heading: The prime meridian
  html: <p>The starting meridian is the <strong>prime meridian</strong>. It is marked <strong>0 degrees</strong> and it passes through Greenwich, near London. The prime meridian and the line on the opposite side of the Earth, at 180 degrees, split the globe into the <strong>Eastern Hemisphere</strong> and the <strong>Western Hemisphere</strong>.</p><p>Longitude goes up to 180 degrees east (180 E) and 180 degrees west (180 W). India lies in the Eastern Hemisphere. Its <strong>standard meridian</strong> is <strong>82.5 degrees east</strong>. It passes near Prayagraj in Uttar Pradesh.</p>
- kind: figure
  svg: <svg viewBox="0 0 240 240" role="img"><circle cx="120" cy="120" r="100" fill="none" stroke="currentColor" stroke-width="2"/><path d="M120 20 Q120 120 120 220" stroke="#ffb800" stroke-width="3" fill="none"/><path d="M120 20 Q70 120 120 220" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M120 20 Q20 120 120 220" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M120 20 Q170 120 120 220" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M120 20 Q220 120 120 220" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="96" y="14" font-size="10" fill="currentColor">Prime meridian 0</text><text x="30" y="236" font-size="9" fill="currentColor">West of 0</text><text x="150" y="236" font-size="9" fill="currentColor">East of 0</text></svg>
  alt: A circle for the globe with five curved meridians from the top to the bottom, and the middle one marked as the prime meridian.
  caption: Meridians run from pole to pole. The middle line is the prime meridian at 0 degrees. Places to its right are east and places to its left are west.
- kind: text
  heading: Longitude and time
  html: <p>The Earth turns once around in 24 hours. In one turn it passes through 360 degrees. So in one hour it turns 360 divided by 24, which is 15 degrees. In one hour there are 60 minutes, so 15 degrees take 60 minutes. That means every <strong>1 degree of longitude is 4 minutes of time</strong>.</p><p>The Sun rises in the east first. So a place that is east of another place sees the Sun earlier, and its clock is <strong>ahead</strong>. A place to the west has its clock <strong>behind</strong>.</p><p>Having a different clock in every town would be confusing, so a country picks one meridian and uses its time everywhere. This is its <strong>standard time</strong>. India uses the time of 82.5 degrees east, called Indian Standard Time.</p>
- kind: example
  heading: 'Worked example: a small difference'
  prompt: Two places are 10 degrees of longitude apart. What is the difference in their local time?
  steps:
  - 'Use the rule: 1 degree of longitude is 4 minutes of time.'
  - 'Multiply the degrees by 4: 10 x 4.'
  - 10 x 4 = 40 minutes.
  - 'Check: 15 degrees would be 60 minutes, so 10 degrees must be less than an hour. 40 minutes fits.'
- kind: example
  heading: 'Worked example: India and Greenwich'
  prompt: India's standard meridian is 82.5 E. How far ahead of Greenwich time is Indian Standard Time?
  steps:
  - Greenwich is at 0 degrees, so the longitude difference is 82.5 - 0 = 82.5 degrees.
  - 'Multiply by 4 minutes: 82.5 x 4 = 330 minutes.'
  - 'Change to hours: 330 / 60 = 5.5 hours, which is 5 hours 30 minutes.'
  - India is east of Greenwich, so its clock is ahead. When it is 12 noon at Greenwich, it is 5:30 in the evening in India.
- kind: callout
  tone: watch
  html: Time goes ahead as you go east, not behind. Also, meridians are not parallel to each other. They meet at the poles. The lines that are parallel are the parallels of latitude.
- kind: callout
  tone: real
  html: India is very wide from west to east. The Sun rises earlier in Arunachal Pradesh than in Gujarat. Yet one standard time keeps trains, schools and offices all over the country on the same clock.
- kind: check
  item: q-lt-1
- kind: check
  item: q-lt-2
- kind: check
  item: q-lt-3
- kind: summary
  points:
  - Longitude is the angle east or west of the prime meridian, which is 0 degrees and passes through Greenwich.
  - Meridians run from pole to pole and meet at the poles. Longitude goes up to 180 E and 180 W.
  - Every 1 degree of longitude is 4 minutes of time, and 15 degrees is 1 hour.
  - East is ahead in time and west is behind. India uses one standard time based on 82.5 E.
