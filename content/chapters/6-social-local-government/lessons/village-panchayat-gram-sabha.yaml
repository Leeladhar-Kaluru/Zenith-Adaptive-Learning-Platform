  stem: The gram sabha and the gram panchayat are the same group of people.
  difficulty: standard
  purpose: practice
  concepts:
  - id: civics-gram-panchayat
  explanation: False. The gram sabha is all adult voters. The gram panchayat is the smaller group of elected members.
  hints:
  - Which group is bigger?
  correct: false
- key: q-vp-7
  kind: mcq
  stem: 'Assertion (A): The gram sabha is called a village meeting of all adult voters. Reason (R): Every adult voter of the village has the right to belong to it and to speak there.'
  difficulty: standard
  purpose: test
  concepts:
  - id: civics-gram-panchayat
  explanation: Both statements are true. The gram sabha is open to every adult voter, so R explains why it is a meeting of all of them.
  hints:
  - Does R say why the meeting is for everyone?
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
    misconception: sabha-is-panchayat
  - key: C
    text: A is true, but R is false
    misconception: sabha-is-panchayat
  - key: D
    text: A is false, but R is true
    misconception: sabha-is-panchayat
- key: q-vp-8
  kind: mcq
  stem: 'Assertion (A): The sarpanch is the head of the gram panchayat. Reason (R): The sarpanch is the head of all the adult voters in the gram sabha.'
  difficulty: challenge
  purpose: test
  concepts:
  - id: civics-gram-panchayat
  explanation: A is true. R is false, because the sarpanch is the head of the elected gram panchayat, while the gram sabha is made up of all the adult voters and they are not led by one person.
  hints:
  - Which group does the sarpanch head?
  correct: C
  options:
  - key: A
    text: Both A and R are true, and R explains A
    misconception: sabha-is-panchayat
  - key: B
    text: Both A and R are true, but R does not explain A
    misconception: sabha-is-panchayat
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
    misconception: sabha-is-panchayat
- key: q-vp-9
  pattern: case
  kind: mcq
  stem: 'Read this note. The people of a village are worried because the lane to the school floods in the rains. They come to a meeting where every adult voter can speak. After the talk, the elected members of the village group agree to repair the lane, and their head leads the next meeting. What is the elected group called, and who is its head?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: civics-gram-panchayat
  - id: civics-local-need
  explanation: The meeting of all adult voters is the gram sabha. The elected group that does the work is the gram panchayat, and its head is the sarpanch.
  hints:
  - The meeting of everyone is one thing. The elected members are another.
  correct: B
  options:
  - key: A
    text: Gram sabha, headed by the sarpanch
    misconception: sabha-is-panchayat
  - key: B
    text: Gram panchayat, headed by the sarpanch
  - key: C
    text: Gram panchayat, headed by the Prime Minister
    misconception: far-govt-fixes-all
  - key: D
    text: Gram sabha, headed by the Prime Minister
    misconception: far-govt-fixes-all
misconceptions:
- code: sabha-is-panchayat
  concept: civics-gram-panchayat
  description: Mixes up the gram sabha (all adult voters) with the gram panchayat (the elected members), or thinks the sarpanch heads the whole gram sabha.
- code: far-govt-fixes-all
  concept: civics-local-need
  description: Thinks faraway leaders handle every small local problem, when villages, towns and cities have their own elected local government.
