slug: one-step
title: One-step equations
minutes: 14
objectives:
- Solve an equation by doing the same thing to both sides
- Choose the correct operation to undo
concepts:
- simple-equation-one-step
origin: ai_assisted
blocks:
- kind: text
  heading: A balanced scale
  html: <p>An equation is like a balanced scale. Both sides are equal. If you take something off one side, you must take the
    same off the other side to keep it balanced.</p>
- kind: widget
  widget: balance
  config:
    a: 3
    b: 7
- kind: example
  heading: Worked example
  prompt: Solve x + 5 = 9.
  steps:
  - To get x alone, undo the adding of 5 by subtracting 5 from both sides.
  - x + 5 - 5 = 9 - 5, so x = 4.
  - 'Check: 4 + 5 = 9. It works.'
- kind: text
  heading: Opposite moves
  html: '<p>Each operation has an opposite that undoes it. Adding 5 is undone by subtracting 5. Multiplying by 3 is undone by dividing by 3. To get x alone, use the opposite of whatever is joined to x, and do it to <strong>both sides</strong>.</p>'
- kind: example
  heading: Worked example 2
  prompt: Solve x / 4 = 6.
  steps:
  - x is divided by 4. The opposite of dividing by 4 is multiplying by 4.
  - Multiply both sides by 4. x / 4 times 4 is x, and 6 times 4 is 24. So x = 24.
  - 'Check: 24 divided by 4 is 6. It works.'
- kind: callout
  tone: watch
  html: The answer to an equation can be below zero. For x + 6 = 2, subtract 6 from both sides to get x = -4. Do not turn it into 4.
- kind: callout
  tone: remember
  html: Whatever you do to one side, <strong>do to the other side too</strong>.
- kind: check
  item: q-eq1-1
- kind: callout
  tone: real
  html: A bus has some passengers. After 8 get down, 22 are left. The equation x - 8 = 22 tells us there were 30 passengers at the start.
- kind: check
  item: q-eq1-7
- kind: check
  item: q-eq1-8
- kind: summary
  points:
  - Undo addition with subtraction, and subtraction with addition.
  - Undo multiplication with division, and division with multiplication.
  - Always check by putting your answer back.
