services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: setu_test
      POSTGRES_DB: setu_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu -d setu_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
