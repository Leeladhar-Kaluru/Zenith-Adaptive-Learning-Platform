slug: continuous-and-perfect
title: Continuous and perfect tenses
minutes: 22
objectives:
- Use is, am, are or was, were with an ing verb for an action in progress
- Use have or has with a past participle for the present perfect
- Use had with a past participle to show which of two past actions came first
- Avoid the present perfect with finished times such as yesterday
concepts:
- english-continuous-tenses
- english-perfect-tenses
origin: ai_assisted
blocks:
- kind: text
  heading: In progress, or finished before
  html: '<p>It is evening and your mother is cooking dinner. Right now the cooking is going on. At eight last night she was cooking when the lights went out. By the time you came home, she had finished. Each sentence shows the action in a different way. Besides past, present and future, a verb can also show an action that is <em>in progress</em> or <em>completed</em> before another time.</p>'
- kind: figure
  svg: <svg viewBox="0 0 320 190" role="img"><g fill="none" stroke="#14193a" stroke-width="2"><path d="M20 60 H300 M292 52 L300 60 L292 68"/><path d="M90 48 V72 M160 48 V72 M230 48 V72"/></g><g font-size="12" fill="currentColor" text-anchor="middle"><text x="90" y="38" font-weight="700">Earlier</text><text x="160" y="38" font-weight="700">Past time</text><text x="230" y="38" font-weight="700">Now</text><text x="90" y="96">had finished</text><text x="90" y="112" font-size="11">(done first)</text><text x="160" y="96">was cooking</text><text x="160" y="112" font-size="11">(in progress)</text><text x="230" y="96">is cooking</text><text x="230" y="112" font-size="11">(in progress now)</text><text x="230" y="140">has cooked</text><text x="230" y="156" font-size="11">(done, and it matters now)</text></g></svg>
  alt: A timeline shows had finished before a past time, was cooking at a past time, and is cooking and has cooked at now.
  caption: Continuous forms show an action in progress. Perfect forms show an action completed before a point in time.
- kind: text
  heading: Continuous tenses
  html: '<p>A <strong>continuous</strong> tense shows an action in progress. It uses a form of <em>be</em> and a verb ending in <em>ing</em>. For now, use <em>is, am</em> or <em>are</em>: The children are playing in the park. For a time in the past, use <em>was</em> or <em>were</em>: At eight last night we were having dinner.</p>'
- kind: text
  heading: Perfect tenses
  html: '<p>The <strong>present perfect</strong> uses <em>have</em> or <em>has</em> with the <strong>past participle</strong> of the verb. It tells about a past action that matters now: She has written the letter. The past participle of write is written, not wrote. Of go it is gone, and of eat it is eaten.</p><p>Do not use the present perfect with a finished time such as yesterday or last week. We say I saw that film yesterday.</p><p>The <strong>past perfect</strong> uses <em>had</em> with the past participle. It shows the earlier of two past actions: When I reached the station, the train had left. The train left first.</p>'
- kind: example
  heading: Worked example
  prompt: 'Complete the sentence: At six o''clock the children ___ cricket. (play)'
  steps:
  - 'At six o''clock names a time in the past, and the playing was going on at that time.'
  - 'An action in progress at a past time uses was or were with an ing verb.'
  - 'The children is plural, so we use were.'
  - 'Check: At six o''clock the children were playing cricket.'
- kind: example
  heading: Worked example
  prompt: 'Which action happened first? When Asha reached home, her brother had eaten the sweets.'
  steps:
  - 'Find the two past actions: Asha reached home, and her brother ate the sweets.'
  - 'Had eaten is the past perfect. It shows the earlier action.'
  - 'Reached is in the simple past, so it is the later action.'
  - 'Check: the brother ate the sweets first, and then Asha reached home.'
- kind: callout
  tone: watch
  html: Do not write I have seen that film yesterday. The present perfect does not go with a finished time. Write I saw that film yesterday, or I have seen that film, with no time word.
- kind: callout
  tone: real
  html: In a job form or a school diary you may write I have learnt typing, meaning the skill is yours now. In a story you may write She had locked the door before the storm began, to show what happened first.
- kind: check
  item: q-cpf-1
- kind: check
  item: q-cpf-2
- kind: check
  item: q-cpf-3
- kind: summary
  points:
  - 'A continuous tense uses be and an ing verb: is cooking now, was cooking at a time in the past.'
  - 'The present perfect uses have or has with a past participle, such as has written, for a past action that matters now.'
  - 'Do not use the present perfect with a finished time such as yesterday or last week.'
  - 'The past perfect uses had with a past participle and shows the action that happened first.'
items:
- key: q-cpf-1
  kind: mcq
  stem: Which sentence tells what is happening right now?
  difficulty: intro
  purpose: check
  concepts:
  - id: english-continuous-tenses
  explanation: She is cooking dinner uses is with an ing verb, so the action is in progress now. The other sentences are past, future or finished.
  hints:
  - Look for is, am or are with an ing verb.
  correct: A
  options:
  - key: A
    text: She is cooking dinner.
  - key: B
    text: She cooked dinner.
  - key: C
    text: She will cook dinner.
  - key: D
    text: She had cooked dinner.
- key: q-cpf-2
  kind: mcq
  stem: Which sentence is in the present perfect?
  difficulty: intro
  purpose: check
  concepts:
  - id: english-perfect-tenses
  explanation: I have finished uses have with the past participle finished, so it is the present perfect. The others are simple past, present continuous and simple future.
  hints:
  - Look for have or has with a past participle.
  correct: B
  options:
  - key: A
    text: I finished my homework.
  - key: B
    text: I have finished my homework.
  - key: C
    text: I am finishing my homework.
  - key: D
    text: I will finish my homework.
- key: q-cpf-3
  kind: mcq
  stem: 'Choose the best words. At eight o''clock last night, we ___ dinner.'
  difficulty: intro
  purpose: check
  concepts:
  - id: english-continuous-tenses
  explanation: The dinner was in progress at a time in the past, so we use were with an ing verb. Were having is correct.
  hints:
  - Was the dinner going on at that time? Which form shows an action in progress in the past?
  correct: B
  options:
  - key: A
    text: are having
  - key: B
    text: were having
  - key: C
    text: have had
  - key: D
    text: will have
- key: q-cpf-4
  kind: mcq
  stem: 'Which verb form completes the sentence? She has ___ the letter.'
  difficulty: standard
  purpose: practice
  concepts:
  - id: english-perfect-tenses
  explanation: Has needs the past participle. The past participle of write is written, so she has written the letter. Wrote is the simple past.
  hints:
  - After has or have, use the past participle.
  correct: B
  options:
  - key: A
    text: wrote
    misconception: participle-wrong
  - key: B
    text: written
  - key: C
    text: write
  - key: D
    text: writing
- key: q-cpf-5
  kind: mcq
  stem: Which sentence is correct?
  difficulty: standard
  purpose: practice
  concepts:
  - id: english-continuous-tenses
  explanation: A continuous tense needs a form of be before the ing verb. The children are playing is correct. The first choice has no be verb, and the others do not agree with children.
  hints:
  - Check that a form of be comes before the ing verb.
  correct: B
  options:
  - key: A
    text: The children playing in the park.
    misconception: continuous-no-aux
  - key: B
    text: The children are playing in the park.
  - key: C
    text: The children is playing in the park.
  - key: D
    text: The children am playing in the park.
- key: q-cpf-6
  kind: mcq
  stem: Which sentence is correct?
  difficulty: standard
  purpose: practice
  concepts:
  - id: english-perfect-tenses
  explanation: Yesterday is a finished time, so we use the simple past. I saw that film yesterday is correct. Have seen does not go with yesterday, and seen alone needs have.
  hints:
  - Yesterday is a finished time. Which tense goes with it?
  correct: B
  options:
  - key: A
    text: I have seen that film yesterday.
    misconception: perfect-with-yesterday
  - key: B
    text: I saw that film yesterday.
  - key: C
    text: I have saw that film.
    misconception: participle-wrong
  - key: D
    text: I seen that film yesterday.
    misconception: participle-wrong
- key: q-cpf-7
  kind: mcq
  stem: Which sentence shows clearly that the train left before I reached the station?
  difficulty: standard
  purpose: practice
  concepts:
  - id: english-perfect-tenses
  explanation: The past perfect had left shows the earlier action. The train had left when I reached the station means the train left first. Was leaving shows the train was in the middle of leaving.
  hints:
  - Which verb form shows the earlier of two past actions?
  correct: B
  options:
  - key: A
    text: The train leaving when I reached the station.
    misconception: continuous-no-aux
  - key: B
    text: The train had left when I reached the station.
  - key: C
    text: The train was leaving when I reached the station.
  - key: D
    text: The train will leave when I reached the station.
- key: q-cpf-8
  kind: numeric
  stem: 'How many verbs in the continuous form are in this passage? The boys were playing while the girls were reading. Suddenly it started to rain.'
  difficulty: standard
  purpose: practice
  concepts:
  - id: english-continuous-tenses
  explanation: The continuous verbs are were playing and were reading. Started is simple past. So there are 2.
  hints:
  - Look for were with an ing verb.
  value: 2
  tolerance: 0.0
  verify: '1+1'
- key: q-cpf-9
  kind: mcq
  stem: 'Assertion (A): They have lived in Surat since 2015 is in the present perfect. Reason (R): The present perfect links a past action to the present.'
  difficulty: challenge
  purpose: test
  concepts:
  - id: english-perfect-tenses
  explanation: Both are true. Have lived is the present perfect, and the family still lives in Surat now, so the past is linked to the present. R explains A.
  hints:
  - Do they still live in Surat now?
  correct: A
  options:
  - key: A
    text: Both A and R are true and R explains A
  - key: B
    text: Both A and R are true but R does not explain A
  - key: C
    text: A is true but R is false
  - key: D
    text: A is false but R is true
- key: q-cpf-10
  kind: mcq
  stem: 'Assertion (A): I have met her last week is correct. Reason (R): The present perfect is not used with a finished time such as last week.'
  difficulty: challenge
  purpose: test
  concepts:
  - id: english-perfect-tenses
  explanation: R is true. But A is false, because last week is a finished time. We should write I met her last week.
  hints:
  - Is last week a finished time or a time that is still going on?
  correct: D
  options:
  - key: A
    text: Both A and R are true and R explains A
    misconception: perfect-with-yesterday
  - key: B
    text: Both A and R are true but R does not explain A
    misconception: perfect-with-yesterday
  - key: C
    text: A is true but R is false
    misconception: perfect-with-yesterday
  - key: D
    text: A is false but R is true
- key: q-cpf-11
  pattern: case
  kind: mcq
  stem: 'Read the passage. Meena is making tea in the kitchen. Her brother came home at six. When he arrived, she had already bought biscuits. Which happened first?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: english-perfect-tenses
  explanation: Had bought is the past perfect, so Meena bought the biscuits before her brother arrived. His coming home was later. Making tea is happening now.
  hints:
  - Find the verb with had. It shows the earlier action.
  correct: C
  options:
  - key: A
    text: Meena made tea.
  - key: B
    text: Her brother came home.
  - key: C
    text: Meena bought biscuits.
  - key: D
    text: We cannot tell.
misconceptions:
- code: continuous-no-aux
  concept: english-continuous-tenses
  description: Leaves out is, are, was or were before an ing verb.
- code: participle-wrong
  concept: english-perfect-tenses
  description: Uses the simple past or the base verb instead of the past participle after have, has or had.
- code: perfect-with-yesterday
  concept: english-perfect-tenses
  description: Uses the present perfect with a finished time such as yesterday or last week.
cards:
- key: cpf-card-1
  concept: english-continuous-tenses
  front: How do we form the continuous tenses?
  back: A form of be (is, am, are, was, were) with an ing verb, such as is cooking and was cooking.
- key: cpf-card-2
  concept: english-perfect-tenses
  front: How do we form the present perfect?
  back: Have or has with the past participle, such as has written.
- key: cpf-card-3
  concept: english-perfect-tenses
  front: What does the past perfect show?
  back: The earlier of two past actions. Had left in The train had left when I reached the station shows the train left first.
- key: cpf-card-4
  concept: english-perfect-tenses
  front: Can we say I have seen that film yesterday?
  back: No. Yesterday is a finished time. Say I saw that film yesterday.
