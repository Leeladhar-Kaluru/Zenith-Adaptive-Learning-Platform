concepts:
  - {id: english-sentence-kinds, title: "Kinds of sentence", grade: 6, subject: english, description: "A statement tells something, a question asks something, a command tells someone to do something and an exclamation shows strong feeling.", keywords: [statement, question, command, exclamation, sentence]}
  - {id: english-end-marks, title: "Capital letters, full stops and question marks", grade: 6, subject: english, description: "A sentence begins with a capital letter and ends with a full stop, a question mark or an exclamation mark. Names, days, months and the word I also take capital letters.", keywords: [capital letter, full stop, question mark, exclamation mark, punctuation]}
  - {id: english-commas, title: "Commas", grade: 6, subject: english, description: "A comma separates the items in a list and marks a short pause, for example after words like yes and no at the start of a sentence.", keywords: [comma, list, pause, punctuation]}
  - {id: english-apostrophes, title: "Apostrophes", grade: 6, subject: english, description: "An apostrophe shows that letters are left out in a short form such as don't, or that something belongs to someone, as in Ravi's bag. It is not used to make plurals.", keywords: [apostrophe, short form, possession, plural, punctuation]}
