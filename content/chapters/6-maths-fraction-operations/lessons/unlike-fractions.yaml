slug: unlike-fractions
title: Adding and subtracting unlike fractions
minutes: 25
objectives:
- Write equivalent fractions by multiplying the top and bottom by the same number
- Explain why pieces must be the same size before we add or subtract
- Find a common denominator using the LCM of the denominators
- Add and subtract unlike fractions and write the answer in simplest form
concepts:
- fractions-equivalent
- fractions-add-subtract-unlike
origin: ai_assisted
blocks:
- kind: text
  heading: Pieces of different sizes
  html: '<p>You eat half of a roti in the morning. In the evening you eat one third of another roti of the same size. How much
    roti did you eat in all?</p><p>It is hard to say, because a half and a third are pieces of different sizes. You cannot
    add pieces unless they are the same size. It is like adding 2 apples and 3 oranges. You first need a common name, such
    as "fruit".</p><p>Fractions with the same denominator are called <strong>like fractions</strong>. Fractions with different
    denominators are <strong>unlike fractions</strong>. To add unlike fractions we first turn them into like fractions.</p>'
- kind: text
  heading: Equivalent fractions
  html: '<p>Two fractions are <strong>equivalent</strong> if they show the same amount. Cut each half into 3 smaller pieces.
    Now the whole has 6 pieces and the half is 3 of them. So 1/2 = 3/6.</p><p>We did this by multiplying the top (numerator)
    and the bottom (denominator) by the same number, 3. The pieces got smaller and there are more of them, but the amount did
    not change. So 1/2 = 3/6 = 4/8 = 5/10.</p>'
- kind: figure
  svg: <svg viewBox="0 0 300 130" role="img"><text x="30" y="16" font-size="13" font-weight="700" fill="currentColor">1/2</text><rect
    x="30" y="22" width="120" height="30" fill="#ffb800" stroke="#14193a" stroke-width="2"/><rect x="150" y="22" width="120"
    height="30" fill="none" stroke="#14193a" stroke-width="2"/><text x="30" y="82" font-size="13" font-weight="700" fill="currentColor">3/6</text><rect
    x="30" y="88" width="40" height="30" fill="#ffb800" stroke="#14193a" stroke-width="2"/><rect x="70" y="88" width="40" height="30"
    fill="#ffb800" stroke="#14193a" stroke-width="2"/><rect x="110" y="88" width="40" height="30" fill="#ffb800" stroke="#14193a"
    stroke-width="2"/><rect x="150" y="88" width="40" height="30" fill="none" stroke="#14193a" stroke-width="2"/><rect x="190"
    y="88" width="40" height="30" fill="none" stroke="#14193a" stroke-width="2"/><rect x="230" y="88" width="40" height="30"
    fill="none" stroke="#14193a" stroke-width="2"/></svg>
  alt: Two bars of the same length. The first is cut into two parts with one shaded. The second is cut into six parts with three shaded, covering the same length.
  caption: The shaded part is the same length in both bars, so 1/2 and 3/6 are equivalent fractions.
- kind: text
  heading: Adding and subtracting unlike fractions
  html: '<p>Follow these steps.</p><ul><li>Find a common denominator. The smallest choice is the LCM of the two denominators.</li><li>Write
    each fraction as an equivalent fraction with that denominator.</li><li>Add or subtract the numerators. Keep the denominator
    the same.</li><li>Write the answer in simplest form.</li></ul><p>For 1/2 + 1/3, the LCM of 2 and 3 is 6. Then 1/2 = 3/6 and
    1/3 = 2/6. So 1/2 + 1/3 = 3/6 + 2/6 = 5/6.</p><p>Why keep the denominator? The denominator only names the size of the piece.
    3 sixths plus 2 sixths is 5 sixths, just as 3 apples plus 2 apples is 5 apples.</p>'
- kind: figure
  svg: <svg viewBox="0 0 300 200" role="img"><text x="30" y="16" font-size="13" font-weight="700" fill="currentColor">1/2 = 3/6</text><rect
    x="30" y="22" width="40" height="28" fill="#ffb800" stroke="#14193a" stroke-width="2"/><rect x="70" y="22" width="40" height="28"
