  item: q-sg-3
- kind: summary
  points:
  - 'किसी व्यक्ति, वस्तु, स्थान या भाव के नाम को संज्ञा कहते हैं।'
  - 'संज्ञा के तीन भेद हैं: व्यक्तिवाचक (विशेष नाम), जातिवाचक (पूरी जाति का नाम) और भाववाचक (गुण, दशा या भाव का नाम)।'
