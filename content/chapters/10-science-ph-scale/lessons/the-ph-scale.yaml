slug: the-ph-scale
title: The pH scale
minutes: 25
objectives:
- Explain that pH is a number that tells how acidic or basic a solution is
- Read the 0 to 14 scale and say whether a pH value is acidic, neutral or basic
- Use litmus, phenolphthalein, methyl orange and universal indicator to test a solution
- Explain the role of pH in the stomach, in tooth decay, in soil and in neutralisation
concepts:
- ph-scale
origin: ai_assisted
blocks:
- kind: text
  heading: A number for how acidic
  html: '<p>Lemon juice is sour and soap feels slippery. Lemon juice is an acid and soap is a base. But two acids can differ
    a lot. Some acids are mild enough to eat, and some can burn skin. We need a number to say how strong the acid or base
    is.</p><p>That number is the <strong>pH</strong>. It tells us how much hydrogen ion is present in a solution. Hydrogen
    ions are the particles that make a solution acidic. The more hydrogen ions, the <strong>lower</strong> the pH.</p>'
- kind: text
  heading: Reading the scale from 0 to 14
  html: '<p>The common pH scale runs from 0 to 14. Pure water at room temperature has a pH of <strong>7</strong>. This is
    called <strong>neutral</strong>.</p><ul><li>A pH <strong>below 7</strong> is <strong>acidic</strong>. The lower the number,
    the more acidic the solution.</li><li>A pH of <strong>exactly 7</strong> is neutral.</li><li>A pH <strong>above 7</strong>
    is <strong>basic</strong>. The higher the number, the more basic the solution.</li></ul><p>Each step on the scale is a
    tenfold change. A solution with pH 3 has 10 times as many hydrogen ions as one with pH 4. It has 100 times as many as one
    with pH 5.</p>'
- kind: figure
  svg: <svg viewBox="0 0 320 120" role="img"><rect x="10" y="40" width="20" height="36" fill="#e53935"/><text x="20" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">0</text><rect x="30" y="40" width="20" height="36" fill="#e53935"/><text x="40" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">1</text><rect x="50" y="40" width="20" height="36" fill="#ef5b2b"/><text x="60" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">2</text><rect x="70" y="40" width="20" height="36" fill="#f4801f"/><text x="80" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">3</text><rect x="90" y="40" width="20" height="36" fill="#f9a825"/><text x="100" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">4</text><rect x="110" y="40" width="20" height="36" fill="#fbc02d"/><text x="120" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">5</text><rect x="130" y="40" width="20" height="36" fill="#cddc39"/><text x="140" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">6</text><rect x="150" y="40" width="20" height="36" fill="#4caf50"/><text x="160" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">7</text><rect x="170" y="40" width="20" height="36" fill="#26a69a"/><text x="180" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">8</text><rect x="190" y="40" width="20" height="36" fill="#29b6f6"/><text x="200" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">9</text><rect x="210" y="40" width="20" height="36" fill="#3f7fd9"/><text x="220" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">10</text><rect x="230" y="40" width="20" height="36" fill="#3f51b5"/><text x="240" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">11</text><rect x="250" y="40" width="20" height="36" fill="#5e3fb5"/><text x="260" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">12</text><rect x="270" y="40" width="20" height="36" fill="#6a2fa5"/><text x="280" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">13</text><rect x="290" y="40" width="20" height="36" fill="#4a148c"/><text x="300" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">14</text><text x="10" y="28" font-size="12" font-weight="700" fill="currentColor">acidic</text><text x="130" y="28" font-size="12" font-weight="700" fill="currentColor">neutral</text><text x="262" y="28" font-size="12" font-weight="700" fill="currentColor">basic</text><text x="10" y="112" font-size="10" fill="currentColor">more hydrogen ions</text><text x="215" y="112" font-size="10" fill="currentColor">fewer hydrogen ions</text></svg>
  alt: A strip of coloured boxes numbered 0 to 14 with acidic on the left, neutral in the middle at 7 and basic on the right.
  caption: The pH scale. Colours shown are typical of universal indicator. Values below 7 are acidic, 7 is neutral and values above 7 are basic.
- kind: text
  heading: Indicators show whether a solution is acidic or basic
  html: '<p>An <strong>indicator</strong> is a substance that shows one colour in an acid and another in a base. Blue litmus
    turns red in an acid. Red litmus turns blue in a base. Phenolphthalein is colourless in an acid and pink in a base. Methyl
    orange is red in an acid and yellow in a base.</p><p>These tell us only acid or base. <strong>Universal indicator</strong>
    is a mixture of several indicators. It shows a whole range of colours. We match the colour to a chart, and the chart gives
    an approximate pH. Typically strong acids give red, neutral gives green and strong bases give blue to violet. A pH meter
    or pH paper can also be used.</p>'
- kind: example
  heading: Worked example
  prompt: Solution P has pH 2 and solution Q has pH 5. Which is more acidic, and how many times more hydrogen ions does it have?
  steps:
  - 'Both pH values are below 7, so both are acidic. The lower pH is more acidic, so P is more acidic.'
  - 'Find the gap on the scale. 5 − 2 = 3 steps.'
  - 'Each step is a tenfold change, so three steps is 10 × 10 × 10 = 1000.'
  - 'Check the direction. A lower pH means more hydrogen ions, so P has 1000 times as many hydrogen ions as Q.'
- kind: callout
  tone: watch
  html: A lower pH means MORE acidic, not less. A pH of 2 is much more acidic than a pH of 6. Also, adding water to an acid makes the pH rise toward 7, but it never turns the acid into a base.
- kind: text
  heading: pH in everyday life
  html: '<p><strong>In the stomach.</strong> Your stomach makes hydrochloric acid, which helps digestion. It is strongly acidic.
    Too much acid causes a burning feeling. An antacid is a mild base. It reacts with the extra acid and eases the burning.</p><p><strong>In
    the mouth.</strong> Bacteria in the mouth break down leftover sugar and make acids. When the pH in the mouth falls below
    5.5, the hard outer layer of the teeth, called enamel, starts to wear away. This is tooth decay. Toothpaste is usually
    basic, so it helps to neutralise the acid. Cleaning the teeth after eating helps.</p><p><strong>In soil.</strong> Each
    crop grows best in soil within a certain pH range. Farmers test the soil. If it is too acidic, they may add slaked lime,
    which is basic. If it is too basic, they may add compost or other organic matter.</p>'
- kind: text
  heading: Neutralisation
  html: '<p>When an acid and a base react, each reduces the effect of the other. This is <strong>neutralisation</strong>.
    An acid and a base react to form a salt and water. The pH of the mixture moves toward 7. If exactly the right amounts
    are used, the final solution can be neutral.</p>'
- kind: example
  heading: Worked example
  prompt: A person has a burning feeling after a heavy meal. An antacid tablet contains a base. Explain how it helps.
  steps:
  - 'The stomach has hydrochloric acid, so the pH inside is very low. Too much acid causes the burning.'
  - 'The antacid is a mild base. When it meets the acid it reacts with it. This is neutralisation.'
  - 'Neutralisation makes a salt and water and uses up some of the hydrogen ions. The pH of the stomach contents rises a little toward 7.'
  - 'Check. A mild base is used, not a strong one, so the stomach contents do not become strongly basic.'
- kind: callout
  tone: real
  html: When a bee stings, the sting leaves an acid under the skin. A mild base such as baking soda paste can ease the pain by neutralising it. Never rub a strong base on the skin.
- kind: check
  item: q-ph-1
- kind: check
  item: q-ph-2
- kind: check
  item: q-ph-3
- kind: summary
  points:
  - 'pH tells how acidic or basic a solution is. Lower pH means more hydrogen ions.'
  - 'Below 7 is acidic, 7 is neutral and above 7 is basic. Each step is a tenfold change.'
  - 'Litmus, phenolphthalein and methyl orange show acid or base. Universal indicator gives an approximate pH.'
  - 'pH matters in the stomach, in tooth decay below pH 5.5, and in soil. Neutralisation moves pH toward 7.'
