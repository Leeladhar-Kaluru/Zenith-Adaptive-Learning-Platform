slug: sarvanam-ke-bhed
title: सर्वनाम और उसके भेद
minutes: 20
language: hi
objectives:
- सर्वनाम की पहचान करना और उसे संज्ञा की जगह प्रयोग करना
- उत्तम, मध्यम और अन्य पुरुष के सर्वनाम पहचानना
- प्रश्नवाचक और अनिश्चयवाचक सर्वनाम पहचानना
concepts:
- hindi-sarvanam
origin: ai_assisted
blocks:
- kind: text
  heading: बार-बार एक ही नाम क्यों?
  html: '<p>इन वाक्यों को पढ़िए: “सीमा स्कूल गई। सीमा ने बस्ता खोला। सीमा ने किताब निकाली।” एक ही नाम बार-बार आने से सुनने में अच्छा नहीं लगता।</p><p>अब इन्हें ऐसे पढ़िए: “सीमा स्कूल गई। उसने बस्ता खोला। फिर उसने किताब निकाली।” यहाँ “उसने” शब्द “सीमा” की जगह आया है। संज्ञा के स्थान पर आने वाले शब्द को <strong>सर्वनाम</strong> कहते हैं। जैसे: मैं, तुम, वह, कौन, कोई।</p>'
- kind: text
  heading: पुरुषवाचक सर्वनाम
  html: '<p>जो सर्वनाम किसी व्यक्ति के लिए आते हैं, वे <strong>पुरुषवाचक सर्वनाम</strong> कहलाते हैं। इनके तीन भेद हैं।</p><p><strong>उत्तम पुरुष:</strong> बोलने वाला अपने लिए जिन शब्दों का प्रयोग करता है। जैसे: मैं, हम, मेरा।</p><p><strong>मध्यम पुरुष:</strong> सुनने वाले के लिए प्रयोग होने वाले शब्द। जैसे: तुम, आप, तुम्हारा।</p><p><strong>अन्य पुरुष:</strong> जिसके बारे में बात की जा रही हो, उसके लिए प्रयोग होने वाले शब्द। जैसे: वह, वे, उसका।</p>'
- kind: figure
  svg: '<svg viewBox="0 0 360 160" role="img"><g fill="none" stroke="#14193a" stroke-width="2"><rect x="8" y="30" width="108" height="100" rx="8"/><rect x="126" y="30" width="108" height="100" rx="8"/><rect x="244" y="30" width="108" height="100" rx="8"/></g><g font-size="13" font-weight="700" fill="currentColor" text-anchor="middle"><text x="62" y="22">उत्तम पुरुष</text><text x="180" y="22">मध्यम पुरुष</text><text x="298" y="22">अन्य पुरुष</text></g><g font-size="13" fill="currentColor" text-anchor="middle"><text x="62" y="62">मैं</text><text x="62" y="86">हम</text><text x="180" y="62">तुम</text><text x="180" y="86">आप</text><text x="298" y="62">वह</text><text x="298" y="86">वे</text></g><g font-size="11" fill="currentColor" text-anchor="middle"><text x="62" y="116">बोलने वाला</text><text x="180" y="116">सुनने वाला</text><text x="298" y="116">जिसके बारे में बात हो</text></g></svg>'
  alt: तीन डिब्बों वाला चित्र जिसमें उत्तम, मध्यम और अन्य पुरुष के सर्वनाम और उनका अर्थ लिखा है।
  caption: पुरुषवाचक सर्वनाम के तीन भेद। बोलने वाला, सुनने वाला और जिसके बारे में बात हो।
- kind: text
  heading: प्रश्नवाचक और अनिश्चयवाचक सर्वनाम
  html: '<p>जो सर्वनाम प्रश्न पूछने के लिए आते हैं, वे <strong>प्रश्नवाचक सर्वनाम</strong> हैं। जैसे: कौन, क्या। उदाहरण: “दरवाज़े पर कौन है?”</p><p>जो सर्वनाम किसी निश्चित व्यक्ति या वस्तु के बारे में नहीं बताते, वे <strong>अनिश्चयवाचक सर्वनाम</strong> हैं। जैसे: कोई, कुछ। उदाहरण: “दरवाज़े पर कोई है।” यहाँ हमें नहीं पता कि वह कौन है।</p>'
- kind: example
  heading: हल किया हुआ उदाहरण
  prompt: 'दूसरे वाक्य में संज्ञाओं की जगह सर्वनाम लगाइए: “राम और श्याम बाज़ार गए। राम और श्याम ने फल खरीदे।”'
  steps:
  - 'दूसरे वाक्य में “राम और श्याम” दोबारा आया है। इसकी जगह सर्वनाम आ सकता है।'
  - 'राम और श्याम दो लोग हैं, और उनके बारे में बात की जा रही है। इसलिए अन्य पुरुष, बहुवचन का सर्वनाम “उन्होंने” आएगा।'
  - 'नया वाक्य: “राम और श्याम बाज़ार गए। उन्होंने फल खरीदे।”'
  - 'जाँच: “उन्होंने” और “खरीदे” दोनों बहुवचन में हैं, इसलिए वाक्य ठीक है।'
- kind: example
  heading: हल किया हुआ उदाहरण
  prompt: 'इन दोनों वाक्यों में सर्वनाम का भेद बताइए: (क) “कौन आया है?” (ख) “कोई दरवाज़े पर खड़ा है।”'
  steps:
  - 'वाक्य (क) में “कौन” शब्द प्रश्न पूछ रहा है।'
  - 'इसलिए “कौन” प्रश्नवाचक सर्वनाम है।'
  - 'वाक्य (ख) में बोलने वाले को नहीं पता कि खड़ा हुआ व्यक्ति कौन है। “कोई” किसी निश्चित व्यक्ति को नहीं बताता।'
  - 'इसलिए “कोई” अनिश्चयवाचक सर्वनाम है। जाँच: (क) में प्रश्न चिह्न है और (ख) में नहीं, यह भी दोनों का अंतर दिखाता है।'
- kind: callout
  tone: watch
  html: 'बड़ों के लिए आदर में हम “आप” कहते हैं। पर “आप” का प्रयोग सुनने वाले के लिए होता है, इसलिए इसे मध्यम पुरुष में गिना जाता है। “आप” को अन्य पुरुष मत समझिए।'
- kind: callout
  tone: real
  html: 'बातचीत में हर कोई सर्वनाम का प्रयोग करता है। शिक्षक से बात करते समय हम “आप” कहते हैं और दोस्त से “तुम”। सही सर्वनाम चुनने से बात में सम्मान और अपनापन दोनों आते हैं।'
