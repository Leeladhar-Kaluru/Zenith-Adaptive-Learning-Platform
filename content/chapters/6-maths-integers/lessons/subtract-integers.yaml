    stroke="currentColor" stroke-width="2.5"/><text x="195" y="14" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">move
    4 right</text></svg>
  alt: A number line from 0 to 8. An arc labelled move 4 right goes from a dot at 3 to a dot at 7.
  caption: 3 - (-4) = 7. Subtracting -4 moves you 4 steps to the right.
- kind: example
  heading: 'Worked example: subtract a positive'
  prompt: Work out -2 - 5.
  steps:
  - Subtracting 5 is the same as adding the opposite of 5, which is -5.
  - So -2 - 5 = -2 + (-5).
  - Start at -2 and move 5 steps left. The steps are -3, -4, -5, -6, -7.
  - You land on -7. So -2 - 5 = -7.
- kind: example
  heading: 'Worked example: subtract a negative'
  prompt: Work out -5 - (-3).
  steps:
  - Subtracting -3 is the same as adding the opposite of -3, which is 3.
  - So -5 - (-3) = -5 + 3.
  - Start at -5 and move 3 steps right. The steps are -4, -3, -2.
  - You land on -2. So -5 - (-3) = -2.
  - 'Check: the answer -2 is bigger than -5, as it should be when we subtract a negative number.'
- kind: callout
  tone: real
  html: The temperature rose from -2 degrees to 6 degrees. The rise is 6 - (-2) = 8 degrees. Subtracting the lower reading
    gives the size of the change.
- kind: callout
  tone: remember
  html: 'Change every subtraction into an addition: a - b becomes a + (-b). Then use the number line.'
- kind: check
  item: q-int-sub-1
- kind: check
  item: q-int-sub-5
- kind: check
  item: q-int-sub-10
- kind: summary
  points:
  - a - b means a + (-b).
  - Subtracting a negative number makes the result bigger.
  - Check your answer on the number line.
