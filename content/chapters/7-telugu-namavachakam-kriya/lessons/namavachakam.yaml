  - key: C
    text: చెట్టు
  - key: D
    text: చెట్టుగా
- key: q-nv-6
  kind: mcq
  stem: ఏ వరుసలో అన్నీ నామవాచకాలే ఉన్నాయి?
  difficulty: standard
  purpose: practice
  concepts:
  - id: telugu-namavachakam
  explanation: ఆవు, తోట, గురువు అన్నీ పేర్లు. మిగిలిన వరుసల్లో వెళ్ళింది, చదివాడు, రాసింది, పాడాడు, ఆడింది వంటి పని చెప్పే మాటలు ఉన్నాయి.
  hints:
  - ప్రతి వరుసలో పని చెప్పే మాట ఉందేమో చూడండి.
  correct: C
  options:
  - key: A
