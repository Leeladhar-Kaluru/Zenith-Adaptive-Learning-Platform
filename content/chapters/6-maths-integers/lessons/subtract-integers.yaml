  difficulty: standard
  purpose: test
  concepts:
  - id: integers-subtract
    weight: 1.0
  explanation: Subtracting -2 is the same as adding its opposite, 2. So 5 - (-2) = 5 + 2 = 7. A is true and R explains it.
  hints:
  - Change the subtraction into adding the opposite.
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
