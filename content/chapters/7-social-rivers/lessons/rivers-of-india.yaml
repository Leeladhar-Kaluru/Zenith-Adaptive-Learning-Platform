- kind: text
  heading: Peninsular rivers
  html: '<p>Peninsular rivers begin on the Peninsular Plateau or in the hills around it. Most of their water comes from rain
    and not from glaciers. So they swell in the monsoon and shrink in the dry months.</p><p>Most big peninsular rivers flow
    <strong>east</strong> and reach the Bay of Bengal. These are the <strong>Godavari</strong>, the <strong>Krishna</strong>,
    the <strong>Kaveri</strong> and the <strong>Mahanadi</strong>. The Godavari, Krishna and Kaveri all begin in the Western
    Ghats. Near the sea these rivers spread out and build <strong>deltas</strong>, which are fans of fertile land.</p><p>Two
    large peninsular rivers flow <strong>west</strong>. The <strong>Narmada</strong> begins at Amarkantak and flows west through
    the valley between the Vindhya and Satpura ranges. The <strong>Tapi</strong> begins in the Satpura Range and flows west
    too. Both reach the Arabian Sea.</p>'
