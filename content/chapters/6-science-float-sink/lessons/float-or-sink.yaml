slug: float-or-sink
title: Float or sink?
minutes: 15
objectives:
- Explain density as how much mass is packed into a volume
- Work out density from mass and volume
- Predict whether an object floats or sinks in water
concepts:
- float-sink
origin: ai_assisted
blocks:
- kind: text
  heading: Heavy for its size
  html: <p>Some things float and some sink. It is not only about how heavy they are. A huge ship floats and a tiny pebble
    sinks. What matters is how much <strong>mass is packed into the space</strong> the object takes up. We call this <strong>density</strong>.</p><p>Density
    = mass divided by volume. If mass is in grams and volume in cubic centimetres, density is in grams per cubic centimetre
    (g/cm³).</p>
- kind: widget
  widget: sim_density
  config:
    mass0: 120
    vol0: 50
    goal: float
  task: Make the block float in water by changing only the mass and the volume.
- kind: text
  heading: What the lab showed
  html: <p>Water has a density of about 1 g/cm³. An object with a density <strong>less than</strong> the liquid floats. An
    object with a density <strong>more than</strong> the liquid sinks. A ship floats because its steel is shaped to enclose
    a lot of air, so the whole ship is less dense than water.</p>
- kind: example
  heading: Worked example
  prompt: A block has a mass of 90 g and a volume of 30 cm³. Will it float in water?
  steps:
  - Density = mass divided by volume = 90 divided by 30 = 3 g/cm³.
  - Water has a density of 1 g/cm³.
  - 3 is more than 1, so the block is denser than water.
  - The block sinks.
- kind: callout
  tone: watch
  html: Heavy does not always mean sinks. A big log is heavy but floats. Compare density, not just mass.
- kind: callout
  tone: real
  html: People float more easily in the sea than in a swimming pool because salty water is denser than fresh water.
- kind: figure
  svg: '<svg viewBox="0 0 320 135" role="img"><rect x="20" y="50" width="120" height="60" fill="#74c0fc" opacity="0.5"/><rect
    x="180" y="50" width="120" height="60" fill="#74c0fc" opacity="0.5"/><path d="M20 20 V110 H140 V20" fill="none" stroke="currentColor"
    stroke-width="3"/><path d="M180 20 V110 H300 V20" fill="none" stroke="currentColor" stroke-width="3"/><rect x="60" y="38"
    width="40" height="24" fill="#ffd43b" stroke="#14193a" stroke-width="2"/><rect x="220" y="86" width="40" height="24" fill="#adb5bd"
    stroke="#14193a" stroke-width="2"/><g font-size="13" font-weight="700" text-anchor="middle" fill="currentColor"><text
    x="80" y="128">less dense: floats</text><text x="240" y="128">more dense: sinks</text></g></svg>'
  alt: Two beakers of water. In the left beaker a block floats with its top above the water. In the right beaker a block rests
    on the bottom.
  caption: A block less dense than water floats. A block more dense than water sinks.
- kind: text
  heading: Other liquids
  html: <p>The rule works for any liquid. Compare the density of the object with the density of the <strong>liquid</strong>.
    If the object is less dense than the liquid, it floats. If it is more dense, it sinks.</p><p>This means the same object
    can float in one liquid and sink in another. A block with a density of 1.1 g/cm³ sinks in water, which has a density of
    about 1 g/cm³. It would float in a liquid with a density of 1.2 g/cm³.</p>
- kind: example
  heading: 'Worked example: a light block'
  prompt: A block has a mass of 50 g and a volume of 100 cm³. Will it float in water?
  steps:
  - Density = mass divided by volume = 50 divided by 100.
  - 50 divided by 100 = 0.5 g/cm³.
  - Water has a density of about 1 g/cm³. 0.5 is less than 1.
  - The block is less dense than water, so it floats.
  - 'Check: half a gram in each cubic centimetre is lighter than water, which has 1 g in each cubic centimetre.'
- kind: example
  heading: 'Worked example: two liquids'
  prompt: A block has a mass of 66 g and a volume of 60 cm³. Does it float in water? Does it float in a liquid of density
    1.2 g/cm³?
  steps:
  - Density = 66 divided by 60 = 1.1 g/cm³.
  - In water, 1.1 is more than 1, so the block sinks.
  - In the other liquid, 1.1 is less than 1.2, so the block floats.
  - The same block sinks in water but floats in the denser liquid.
- kind: callout
  tone: remember
  html: Always write the unit with density. Here it is g/cm³. Compare numbers only when both use the same unit.
- kind: check
  item: q-fs-1
- kind: check
  item: q-fs-2
- kind: check
  item: q-fs-5
- kind: check
  item: q-fs-14
- kind: summary
  points:
  - Density = mass divided by volume.
  - 'Less dense than the liquid: it floats.'
  - 'More dense than the liquid: it sinks.'
  - Water has a density of about 1 g/cm³.
