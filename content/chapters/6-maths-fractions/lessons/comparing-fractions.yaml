misconceptions:
- code: bigger-bottom-bigger-fraction
  concept: fractions-compare
  description: Thinks a bigger denominator makes a bigger fraction.
- code: bigger-top-bigger-fraction
  concept: fractions-compare
  description: Compares only the numerators and picks the fraction with the bigger top number, even when the denominators
    are different.
