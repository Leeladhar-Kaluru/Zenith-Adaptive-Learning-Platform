  - key: D
    text: '-13'
- key: q-eq1-11
  kind: mcq
  stem: 'Assertion (A): The solution of x - 6 = 10 is x = 16. Reason (R): To undo subtracting 6, we add 6 to both sides.'
  difficulty: standard
  purpose: test
  concepts:
  - id: simple-equation-one-step
    weight: 1.0
  explanation: Both are true. Adding 6 to both sides undoes the - 6 and gives x = 10 + 6 = 16, so R explains A.
  hints:
  - What is the opposite of subtracting 6?
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
- key: q-eq1-12
  kind: mcq
  stem: A tank holds some litres of water. After 12 litres are taken out, 30 litres are left. How many litres were in the tank at first?
  difficulty: standard
  purpose: test
  concepts:
  - id: simple-equation-one-step
    weight: 1.0
  explanation: Let w be the starting litres. Then w - 12 = 30. Add 12 to both sides. w = 42.
  hints:
  - Write w - 12 = 30.
  correct: B
  options:
  - key: A
    text: 18 litres
    misconception: wrong-inverse
  - key: B
    text: 42 litres
  - key: C
    text: 360 litres
  - key: D
    text: 30 litres
misconceptions:
- code: wrong-inverse
  concept: simple-equation-one-step
  description: Adds 8 to both sides of x + 8 = 3 instead of subtracting it.
- code: multiplies-instead-of-divides
  concept: simple-equation-one-step
  description: Multiplies both sides of 4x = 20 by 4 instead of dividing, so x gets bigger instead of alone.
- code: loses-the-negative-sign
  concept: simple-equation-one-step
  description: Subtracts the smaller number from the larger and drops the minus sign when the answer is below zero.
cards:
- key: one-step-card-1
  concept: simple-equation-one-step
  front: How do you undo + 5?
  back: Subtract 5 from both sides.
- key: one-step-card-2
  concept: simple-equation-one-step
  front: What must you do to keep an equation balanced?
  back: Do the same thing to both sides.
- key: one-step-card-3
  concept: simple-equation-one-step
  front: How do you undo multiplying by 4?
  back: Divide both sides by 4.
- key: one-step-card-4
  concept: simple-equation-one-step
  front: Solve x + 9 = 4.
  back: Subtract 9 from both sides. x = -5.
