  concept: civics-bill-to-law
  front: What is a bill?
  back: A proposal for a new law or a change to a law. It is not yet a law.
- key: how-a-bill-becomes-law-card-2
  concept: civics-bill-to-law
  front: What does a bill need before it becomes an Act?
  back: Passing in both houses of Parliament and the President's assent.
- key: how-a-bill-becomes-law-card-3
  concept: civics-bill-to-law
  front: How many votes does a bill need to pass in a house?
  back: More than half of the votes cast.
- key: how-a-bill-becomes-law-card-4
  concept: civics-bill-to-law
  front: What is assent?
  back: The President's formal agreement to a bill, after which it becomes an Act.
