slug: separating-mixtures
title: Separating mixtures
minutes: 20
objectives:
- Name the main ways of separating a mixture and say how each one works
- Choose a method by looking at how the parts of a mixture differ
- Tell sedimentation, decantation and filtration apart
- Explain why evaporation is used to get back a dissolved solid
concepts:
- separating-mixtures
origin: ai_assisted
blocks:
- kind: text
  heading: Mixtures are everywhere
  html: '<p>Think of the rice you cook at home. Before cooking, someone looks through it and takes out small stones. Rice
    and stones together make a <strong>mixture</strong>. A mixture is two or more things that are present together but are
    not joined into a new substance. Each part keeps its own nature.</p><p>We often want only one part of a mixture. Pulling
    the parts apart is called <strong>separation</strong>. There is no single best method. The right method depends on how
    the parts differ: in size, in weight, or in whether they dissolve in water.</p>'
- kind: text
  heading: Separating one solid from another
  html: '<p><strong>Handpicking</strong> means picking out the unwanted pieces with your fingers. It works when the pieces are
    large enough to see and there are not too many of them. Stones in rice are a good example.</p><p><strong>Winnowing</strong>
    separates a lighter solid from a heavier one with moving air. A farmer pours the harvested grain from a height. The wind
    blows the light husk away and the heavy grain falls in a heap.</p><p><strong>Sieving</strong> uses a sieve, which is a
    net or a plate with small holes. Small pieces fall through the holes. Large pieces stay on top. We sieve flour to remove
    big lumps and bits of husk.</p>'
- kind: text
  heading: Separating a solid that is in water
  html: '<p>Sometimes a solid is mixed with water. First we check one thing: does the solid dissolve? Sand in water does
    not dissolve. Salt in water does dissolve.</p><p><strong>Sedimentation</strong> is when the heavier solid settles at the
    bottom of the liquid if we leave it still. <strong>Decantation</strong> is then pouring off the clear liquid on top, slowly,
    without disturbing what has settled.</p><p><strong>Filtration</strong> passes the mixture through a filter such as filter
    paper or a clean cloth. The liquid passes through and is called the <strong>filtrate</strong>. The solid caught on the
    filter is called the <strong>residue</strong>. Filtration also catches very small bits that decantation leaves behind.</p>'
- kind: figure
  svg: <svg viewBox="0 0 300 240" role="img"><polygon points="70,40 230,40 160,120 140,120" fill="#e8f0ff" stroke="#14193a" stroke-width="3"/><polygon
    points="90,48 210,48 150,108" fill="#cfd8ef" stroke="#14193a" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="146" y="120"
