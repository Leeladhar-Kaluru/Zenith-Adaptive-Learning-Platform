  - key: D
    text: వాక్యం చివర ఉండే మాట
- key: q-nv-4
  kind: numeric
  stem: ‘కుక్క ఎముక కొరికింది’ అనే వాక్యంలో నామవాచకాలు ఎన్ని?
  difficulty: standard
  purpose: practice
  concepts:
  - id: telugu-namavachakam
  explanation: కుక్క ఒక జంతువు పేరు, ఎముక ఒక వస్తువు పేరు. ఈ రెండూ నామవాచకాలు. ‘కొరికింది’ ఒక పని, కాబట్టి అది నామవాచకం కాదు. మొత్తం 2.
  hints:
  - ప్రతి మాటను అడగండి. అది పేరా, పనా?
  value: 2
  tolerance: 0.0
  verify: '2'
- key: q-nv-5
