slug: both-sides
title: Variables on both sides
minutes: 15
objectives:
- Solve linear equations with the variable on both sides
- Explain why a term changes sign when it moves across the equal sign
concepts:
- linear-eq-both-sides
origin: ai_assisted
blocks:
- kind: text
  heading: Collect like terms
  html: <p>Collect the variable on one side and the plain numbers on the other. Moving a term to the other side of the equal
    sign <strong>changes its sign</strong>, because you are adding or subtracting the same thing on both sides.</p>
- kind: example
  heading: Worked example
  prompt: Solve 5x - 3 = 2x + 9.
  steps:
  - 'Subtract 2x from both sides: 3x - 3 = 9.'
  - 'Add 3 to both sides: 3x = 12.'
  - 'Divide by 3: x = 4. Check: 5(4) - 3 = 17 and 2(4) + 9 = 17.'
- kind: figure
  svg: '<svg viewBox="0 0 340 190" role="img"><g font-size="15" font-weight="700" text-anchor="middle" fill="currentColor"><text x="160" y="24">5x - 3 = 2x + 9</text><text x="160" y="76">3x - 3 = 9</text><text x="160" y="128">3x = 12</text><text x="160" y="180">x = 4</text></g><g font-size="12" fill="currentColor"><text x="175" y="46">subtract 2x from both sides</text><text x="175" y="98">add 3 to both sides</text><text x="175" y="150">divide both sides by 3</text></g><g stroke="currentColor" stroke-width="2" fill="none"><path d="M160 32 V52 M154 46 L160 54 L166 46"/><path d="M160 84 V104 M154 98 L160 106 L166 98"/><path d="M160 136 V156 M154 150 L160 158 L166 150"/></g></svg>'
  alt: A ladder of steps for 5x - 3 = 2x + 9. Subtract 2x, then add 3, then divide by 3, to reach x = 4.
  caption: Each step does the same thing to both sides, so every line is still balanced.
- kind: widget
  widget: sim_equation
  config: {a: 3, b: -3, c: 9}
  task: This is 5x - 3 = 2x + 9 after 2x has been subtracted from both sides. Finish the job and get x alone, using as few moves as you can. Then say what x is.
- kind: text
  heading: Why the sign changes
  html: <p>Think of the equation as a balanced scale. To get rid of <strong>+2x</strong> on the right, you <em>subtract</em> 2x from both sides. On the right, +2x and -2x cancel. On the left, a new <strong>-2x</strong> appears. So the term seems to have jumped across the equal sign and changed its sign. Nothing really jumped. You did the same operation to both sides.</p><p>An equation can have a negative answer. That is fine. A number is allowed to be less than zero.</p>
- kind: example
  heading: Another worked example
  prompt: Solve 4x + 6 = 2x - 8.
  steps:
  - 'Subtract 2x from both sides: 2x + 6 = -8.'
  - 'Subtract 6 from both sides: 2x = -14.'
  - 'Divide by 2: x = -7.'
  - 'Check: 4(-7) + 6 = -22 and 2(-7) - 8 = -22. Both sides match.'
- kind: example
  heading: With a bracket
  prompt: Solve 2(x + 4) = 3x + 1.
  steps:
  - 'Open the bracket. Multiply BOTH terms inside by 2: 2x + 8 = 3x + 1.'
  - 'Subtract 2x from both sides: 8 = x + 1.'
  - 'Subtract 1 from both sides: 7 = x.'
  - 'Check: 2(7 + 4) = 22 and 3(7) + 1 = 22.'
- kind: callout
  tone: watch
  html: Moving <strong>+3x</strong> across the equal sign gives <strong>-3x</strong>. If the sign does not change, the equation
    is no longer balanced.
- kind: check
  item: q-lin-1
- kind: callout
  tone: real
  html: Two taxi firms charge differently. Firm P charges Rs 30 plus Rs 10 for each km. Firm Q charges Rs 20 for each km and nothing extra. To find the distance where both cost the same, write 30 + 10x = 20x and solve it. Here x = 3 km.
- kind: check
  item: q-lin-4
- kind: check
  item: q-lin-7
- kind: summary
  points:
  - Put x terms on one side and numbers on the other.
  - A term changes sign when it crosses the equal sign.
  - Check in the original equation.
  - Open a bracket by multiplying every term inside it.
  - An answer can be negative.
