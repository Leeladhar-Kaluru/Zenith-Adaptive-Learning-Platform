slug: add-integers
title: Adding integers
minutes: 14
objectives:
- Add a positive and a negative integer using the number line
- Explain why adding a negative number moves you left
concepts:
- integers-add
origin: ai_assisted
blocks:
- kind: text
  heading: Move along the line
  html: <p>To add, start at the first number. Adding a <strong>positive</strong> number moves you to the right. Adding a <strong>negative</strong>
    number moves you to the left.</p>
- kind: widget
  widget: numberline
  config:
    start: 2
    min: -6
    max: 6
- kind: example
  heading: Worked example
  prompt: Work out -3 + 5.
  steps:
  - Start at -3 on the number line.
  - Adding 5 means move 5 steps right.
  - You pass 0 after 3 steps and 2 more steps land you on 2. So -3 + 5 = 2.
- kind: callout
  tone: remember
  html: Adding a negative number moves you <strong>left</strong>, just like subtracting.
- kind: text
  heading: Same signs and different signs
  html: <p>When both numbers have the <strong>same sign</strong>, add the digits and keep that sign. So -4 + (-3) = -7.</p><p>When
    the signs are <strong>different</strong>, subtract the smaller digit from the bigger digit. The answer takes the sign
    of the number with the bigger digit. So -8 + 3 = -5, because 8 is bigger than 3 and 8 has the minus sign.</p>
- kind: figure
  svg: <svg viewBox="0 0 320 120" role="img"><line x1="8" y1="60" x2="312" y2="60" stroke="currentColor" stroke-width="4"
    stroke-linecap="round"/><g font-size="13" font-weight="700" text-anchor="middle" fill="currentColor"><line x1="20" y1="54"
