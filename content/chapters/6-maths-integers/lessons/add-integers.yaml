  alt: A number line from minus 6 to 2. An arc with plus 3 leads from a dot at minus 5 to a dot at minus 2.
  caption: -5 + 3 = -2. Move 3 steps to the right.
- kind: example
  heading: 'Worked example: different signs'
  prompt: Work out -8 + 3.
  steps:
  - Start at -8 on the number line.
  - Adding 3 means move 3 steps right.
  - The steps are -7, -6 and -5. You land on -5.
  - 'Check with the rule: the signs differ, 8 - 3 = 5, and 8 is the bigger digit with a minus sign. So the answer is -5.'
- kind: example
  heading: 'Worked example: same signs'
  prompt: Work out -2 + (-5).
  steps:
  - Start at -2 on the number line.
  - Adding a negative number means move left. Move 5 steps left.
  - The steps are -3, -4, -5, -6 and -7. You land on -7.
  - 'Check with the rule: the signs are the same, 2 + 5 = 7, and the sign is minus. So the answer is -7.'
- kind: callout
  tone: watch
  html: -8 + 3 is not 5. The 8 is bigger and it is negative, so the answer stays on the negative side. It is -5.
- kind: callout
  tone: real
  html: If you owe Rs 8 and give back Rs 3, you still owe Rs 5. That is -8 + 3 = -5.
- kind: check
  item: q-int-add-1
- kind: check
  item: q-int-add-4
- kind: check
  item: q-int-add-2
- kind: summary
  points:
  - 'Add a positive: move right. Add a negative: move left.'
  - 'Opposites add to zero: (-5) + 5 = 0.'
  - A quick sketch of the number line helps when you are unsure.
items:
- key: q-int-add-1
  kind: mcq
  stem: What is -3 + 5?
  difficulty: standard
  purpose: check
  concepts:
  - id: integers-add
    weight: 1.0
  explanation: Start at -3 and move 5 steps right to land on 2.
  hints:
  - Move 5 steps right from -3.
  correct: B
  options:
  - key: A
    text: '-8'
    misconception: adds-digits-ignores-sign
  - key: B
    text: '2'
  - key: C
    text: '8'
  - key: D
    text: '-2'
  verify: -3+5
- key: q-int-add-2
  kind: numeric
  stem: What is 4 + (-6)?
  difficulty: standard
  purpose: test
  concepts:
  - id: integers-add
  explanation: Start at 4 and move 6 steps left to reach -2.
  hints:
  - Adding a negative moves left.
  value: -2
  tolerance: 0.0
  verify: 4+(-6)
- key: q-int-add-3
  kind: numeric
  stem: What is -7 + (-2)?
  difficulty: standard
  purpose: practice
  concepts:
  - id: integers-add
  explanation: Start at -7 and move 2 more steps left to reach -9.
  hints:
  - Both are negative, so keep moving left.
  value: -9
  tolerance: 0.0
  verify: -7+(-2)
- key: q-int-add-4
  kind: truefalse
  stem: (-5) + 5 = 0
  difficulty: intro
  purpose: practice
  concepts:
  - id: integers-add
  explanation: A number and its opposite add up to zero.
  hints:
  - Move 5 right from -5.
  correct: true
- key: q-int-add-5
  kind: fill
  stem: (-4) + 0 = ____
  difficulty: intro
  purpose: practice
  concepts:
  - id: integers-add
  explanation: Adding zero changes nothing.
  hints:
  - What does adding 0 do?
  accepted:
  - '-4'
- key: q-int-add-6
  kind: mcq
  stem: Rahul owes his friend Rs 40 and then earns Rs 25. Treat the debt as -40. What is his money now?
  difficulty: challenge
  purpose: practice
  concepts:
  - id: integers-add
    weight: 1.0
  explanation: -40 + 25 = -15, so he still owes Rs 15.
  hints:
  - Write the sum -40 + 25 and move on the line.
  correct: B
  options:
  - key: A
    text: Rs 15
  - key: B
    text: -Rs 15
  - key: C
    text: Rs 65
  - key: D
    text: -Rs 65
- key: q-int-add-7
  kind: mcq
  stem: 'Assertion (A): -8 + 3 = -5. Reason (R): When the signs are different, subtract the smaller digit from the bigger
    digit and use the sign of the number with the bigger digit.'
  difficulty: standard
  purpose: test
  concepts:
  - id: integers-add
    weight: 1.0
  explanation: 8 - 3 = 5 and the bigger digit, 8, has a minus sign, so the answer is -5. A is true. R is the rule that gives
    it, so R explains A.
  hints:
  - Which digit is bigger, 8 or 3? What sign does it have?
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
    misconception: smaller-from-bigger
- key: q-int-add-8
  kind: mcq
  stem: 'Assertion (A): -2 + (-5) is greater than -2. Reason (R): Adding a negative number moves you to the left on the number
    line.'
  difficulty: standard
  purpose: test
  concepts:
  - id: integers-add
    weight: 1.0
  explanation: -2 + (-5) = -7, and -7 is to the left of -2, so it is smaller than -2. A is false. R is true.
  hints:
  - Work out -2 + (-5) first.
  - Is the result left or right of -2?
  correct: D
  options:
  - key: A
    text: Both A and R are true, and R explains A
    misconception: negative-moves-right
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
    misconception: negative-moves-right
  - key: D
    text: A is false, but R is true
- key: q-int-add-9
  kind: mcq
  stem: A shopkeeper owes a supplier Rs 120, so her balance is -120. She receives Rs 80 from a customer. Then she pays a bill
    of Rs 50, which is -50. What is her balance now?
  difficulty: challenge
  purpose: test
  concepts:
  - id: integers-add
    weight: 1.0
  explanation: 'After the first step: -120 + 80 = -40. After the bill: -40 + (-50) = -90. Her balance is -Rs 90. She owes
    Rs 90.'
  hints:
  - Do it in two steps. First work out -120 + 80.
  - Then add -50 to your answer.
  correct: B
  options:
  - key: A
    text: -Rs 250
    misconception: adds-digits-ignores-sign
  - key: B
    text: -Rs 90
  - key: C
    text: Rs 90
    misconception: smaller-from-bigger
  - key: D
    text: -Rs 40
- key: q-int-add-10
  kind: numeric
  stem: What number must you add to -5 to get 3?
  difficulty: challenge
  purpose: test
  concepts:
  - id: integers-add
  explanation: From -5 to 0 is 5 steps right. From 0 to 3 is 3 more steps right. In all, 5 + 3 = 8 steps. So -5 + 8 = 3.
  hints:
  - How many steps right do you move from -5 to reach 3?
  value: 8
  tolerance: 0.0
  verify: 5+3
misconceptions:
- code: adds-digits-ignores-sign
  concept: integers-add
  description: Adds -3 and 5 as 3 + 5 or gets -8 by ignoring the direction of each number.
- code: negative-moves-right
  concept: integers-add
  description: Moves right when adding a negative number, so thinks -2 + (-5) is bigger than -2.
- code: smaller-from-bigger
  concept: integers-add
  description: Subtracts the smaller digit from the bigger and always gives a positive answer, for example -8 + 3 = 5.
cards:
- key: add-integers-card-1
  concept: integers-add
  front: What happens when you add a negative number?
  back: You move to the left on the number line.
- key: add-integers-card-2
  concept: integers-add
  front: What is a number plus its opposite?
  back: Zero.
