# Render blueprint for the ZENITH worker on the FREE tier (a web service that wakes on real triggers; see backend/app/worker_web.py).
# For a paid always-on worker later, change to `type: worker`, drop `plan: free`, and use `startCommand: python -m app.worker`.
services:
  - type: web
    name: zenith-worker
    runtime: python
    plan: free
    region: singapore
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements-worker.txt
    startCommand: uvicorn app.worker_web:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DB_SCHEMA
        value: zenith
      - key: LLM_PROVIDER
        value: groq
      - key: DATABASE_URL
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: ENABLE_REMOTE_AI
        sync: false
      - key: GROQ_API_KEY
        sync: false
