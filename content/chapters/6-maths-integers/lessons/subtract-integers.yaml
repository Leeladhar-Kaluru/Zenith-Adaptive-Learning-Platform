slug: subtract-integers
title: Subtracting integers
minutes: 14
objectives:
- Subtract integers by moving left or by adding the opposite
- Handle subtracting a negative number correctly
concepts:
- integers-subtract
origin: ai_assisted
blocks:
- kind: text
  heading: Subtract is add the opposite
  html: <p>Subtracting a number is the same as adding its <strong>opposite</strong>. So 5 - 8 is the same as 5 + (-8), which
    is -3.</p>
- kind: widget
  widget: numberline
  config:
    start: 0
    min: -6
    max: 6
- kind: example
  heading: Worked example
  prompt: Work out 3 - (-4).
  steps:
  - Subtracting -4 is the same as adding the opposite of -4, which is +4.
  - So 3 - (-4) = 3 + 4 = 7.
- kind: callout
  tone: watch
  html: <strong>Two minus signs together:</strong> 3 - (-4) is 7, not -1.
- kind: text
  heading: A pattern that shows why
  html: <p>Look at this pattern. Each time we subtract a number that is one smaller, the answer goes up by 1.</p><ul><li>3
    - 2 = 1</li><li>3 - 1 = 2</li><li>3 - 0 = 3</li><li>3 - (-1) = 4</li><li>3 - (-2) = 5</li></ul><p>The pattern keeps going.
    So subtracting a negative number gives a bigger answer. It is the same as adding the opposite.</p>
- kind: figure
  svg: <svg viewBox="0 0 320 120" role="img"><line x1="8" y1="60" x2="312" y2="60" stroke="currentColor" stroke-width="4"
    stroke-linecap="round"/><g font-size="13" font-weight="700" text-anchor="middle" fill="currentColor"><line x1="20" y1="54"
