blocks:
- kind: text
  heading: Rivers carry water and life
  html: '<p>Rivers give water for drinking, farming and factories. Towns have grown along them for thousands of years. A river
    and all the streams that join it form a <strong>river system</strong>. A smaller stream that joins a bigger river
    is called a <strong>tributary</strong>.</p><p>India''s rivers fall into two main groups. The <strong>Himalayan rivers</strong>
    begin in the northern mountains. The <strong>peninsular rivers</strong> begin on the plateau and hills of the south and
    centre.</p>'
