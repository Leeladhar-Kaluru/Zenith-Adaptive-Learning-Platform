slug: acids-and-bases
title: Acids, bases and indicators
minutes: 15
objectives:
- Describe acids and bases with everyday examples
- Use litmus paper to tell them apart
- Explain why we never taste unknown substances
concepts:
- acids-bases
origin: ai_assisted
blocks:
- kind: text
  heading: Sour and slippery
  html: <p><strong>Acids</strong> taste sour. Lemon juice, vinegar and tamarind contain acids. <strong>Bases</strong> feel
    soapy or slippery and taste bitter. Soap and baking soda solution are bases. Never taste or touch an unknown chemical
    to find out. Scientists use <strong>indicators</strong> instead.</p>
- kind: text
  heading: Litmus paper
  html: <p>An indicator is a substance that changes colour. <strong>Litmus</strong> comes in two colours. <strong>Acids turn
    blue litmus red.</strong> <strong>Bases turn red litmus blue.</strong> A <strong>neutral</strong> substance, such as pure
    water, changes neither colour.</p>
- kind: example
  heading: Worked example
  prompt: A solution turns red litmus paper blue. What is it?
  steps:
  - Bases turn red litmus blue.
  - The solution did what a base does.
  - So the solution is a base.
- kind: callout
  tone: watch
  html: 'Do not mix up the colours. A good memory trick is: acid makes blue go red, base makes red go blue.'
- kind: callout
  tone: real
  html: An ant bite stings because of an acid. A paste of baking soda, a mild base, can help calm it.
- kind: figure
  svg: '<svg viewBox="0 0 320 90" role="img"><rect x="20" y="20" width="60" height="40" fill="#4f7cff" stroke="#14193a" stroke-width="3"/><rect
    x="130" y="20" width="60" height="40" fill="#ff5a5a" stroke="#14193a" stroke-width="3"/><g font-size="13" font-weight="700"
    text-anchor="middle" fill="currentColor"><text x="50" y="80">blue litmus</text><text x="160" y="80">in acid: red</text><text
    x="270" y="40">Base: red turns blue</text></g></svg>'
  alt: Blue litmus paper turns red in an acid. A note says that in a base, red litmus turns blue.
  caption: Litmus is an indicator.
- kind: check
  item: q-ab-1
- kind: check
  item: q-ab-2
- kind: summary
  points:
  - Acids taste sour. Bases feel soapy.
  - Acids turn blue litmus red. Bases turn red litmus blue.
  - Neutral substances change neither.
  - Never taste or touch unknown chemicals.
