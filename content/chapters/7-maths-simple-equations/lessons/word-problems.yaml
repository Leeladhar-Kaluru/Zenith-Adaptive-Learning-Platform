slug: word-problems
title: Equations from words
minutes: 15
objectives:
- Turn a word problem into an equation
- Solve it and check the answer makes sense
concepts:
- equation-word-problems
origin: ai_assisted
blocks:
- kind: text
  heading: Four steps
  html: <p>1. Choose a letter for the unknown number. 2. Write an equation from the story. 3. Solve it. 4. Check the answer
    in the story.</p>
- kind: example
  heading: Worked example
  prompt: Meena had some marbles. After buying 7 more she has 19. How many did she start with?
  steps:
  - Let m be the number she started with. Then m + 7 = 19.
  - 'Subtract 7 from both sides: m = 12.'
  - 'Check: 12 + 7 = 19. She started with 12 marbles.'
- kind: text
  heading: Words and signs
  html: '<p>Some words always point to a sign. <strong>More than</strong>, <strong>increased by</strong> and <strong>sum</strong> mean add. <strong>Less than</strong>, <strong>decreased by</strong> and <strong>difference</strong> mean subtract. <strong>Twice</strong> means times 2. <strong>Is</strong> or <strong>gives</strong> means equals.</p>'
- kind: figure
  svg: '<svg viewBox="0 0 300 130" role="img"><path d="M10 38 L10 30 L285 30 L285 38" fill="none" stroke="currentColor" stroke-width="2"/><text x="148" y="22" font-size="15" font-weight="700" text-anchor="middle" fill="currentColor">31 pencils</text><rect x="10" y="48" width="55" height="40" fill="#ffb800" stroke="#14193a" stroke-width="2"/><rect x="70" y="48" width="55" height="40" fill="#ffb800" stroke="#14193a" stroke-width="2"/><rect x="130" y="48" width="55" height="40" fill="#ffb800" stroke="#14193a" stroke-width="2"/><rect x="190" y="48" width="55" height="40" fill="#ffb800" stroke="#14193a" stroke-width="2"/><rect x="250" y="48" width="35" height="40" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><text x="37" y="74" font-size="18" font-weight="700" text-anchor="middle" fill="#14193a">p</text><text x="97" y="74" font-size="18" font-weight="700" text-anchor="middle" fill="#14193a">p</text><text x="157" y="74" font-size="18" font-weight="700" text-anchor="middle" fill="#14193a">p</text><text x="217" y="74" font-size="18" font-weight="700" text-anchor="middle" fill="#14193a">p</text><text x="267" y="74" font-size="18" font-weight="700" text-anchor="middle" fill="#14193a">3</text><text x="148" y="115" font-size="14" text-anchor="middle" fill="currentColor">4p + 3 = 31</text></svg>'
  alt: A bar of 31 pencils made of four equal packets each marked p and one small group marked 3, which gives the equation 4p + 3 = 31.
  caption: Four equal packets and 3 loose pencils make 31 pencils. The picture is the equation.
- kind: example
  heading: Worked example 2
  prompt: Karan has 4 packets of pencils with the same number p in each packet, and 3 loose pencils. He has 31 pencils in all. How many pencils are in a packet?
  steps:
  - Let p be the number of pencils in one packet.
  - 4 packets hold 4p pencils. With the 3 loose ones the total is 4p + 3, and it equals 31. So 4p + 3 = 31.
  - Subtract 3 from both sides to get 4p = 28. Divide both sides by 4 to get p = 7.
  - 'Check in the story: 4 packets of 7 is 28, and 3 more is 31. A packet holds 7 pencils.'
- kind: widget
  widget: sim_equation
  config: {a: 4, b: 3, c: 31}
  task: Solve 4p + 3 = 31 on the balance. Does your answer match the pencil bar above?
- kind: callout
  tone: watch
  html: '<strong>Less than</strong> reverses the order. 5 less than n is n - 5, not 5 - n. Say it with a small number. 5 less than 9 is 4, which is 9 - 5.'
- kind: callout
  tone: real
  html: A shopkeeper in Hyderabad adds a Rs 5 packing charge to every bill. Equations like <strong>12n + 5 = 65</strong> help
    find how many items were bought.
- kind: check
  item: q-eqw-1
- kind: check
  item: q-eqw-7
- kind: check
  item: q-eqw-8
- kind: summary
  points:
  - Name the unknown with a letter.
  - The story tells you the equation.
  - Check the answer in the story, not only in the equation.
items:
- key: q-eqw-1
  kind: numeric
  stem: A number plus 9 equals 21. Find the number.
  difficulty: intro
  purpose: check
  concepts:
  - id: equation-word-problems
  explanation: Let the number be n. n + 9 = 21, so n = 12.
  hints:
  - Write n + 9 = 21.
  value: 12
  tolerance: 0.0
  verify: 21-9
- key: q-eqw-2
  kind: numeric
  stem: Three times a number, minus 4, is 14. Find the number.
  difficulty: standard
  purpose: practice
  concepts:
  - id: equation-word-problems
  explanation: 3n - 4 = 14, so 3n = 18 and n = 6.
  hints:
  - Write 3n - 4 = 14.
  value: 6
  tolerance: 0.0
  verify: (14+4)/3
- key: q-eqw-3
  kind: mcq
  stem: Ravi is 4 years older than twice his sister's age s. Ravi is 14. Which equation is right?
  difficulty: standard
  purpose: test
  concepts:
  - id: equation-word-problems
    weight: 1.0
  explanation: Twice the sister's age is 2s, and 4 more makes 2s + 4, which equals 14.
  hints:
  - 'Build it in order: twice s, then plus 4.'
  correct: A
  options:
  - key: A
    text: 2s + 4 = 14
  - key: B
    text: 2(s + 4) = 14
    misconception: brackets-misplaced
  - key: C
    text: s + 4 = 28
  - key: D
    text: 2s - 4 = 14
- key: q-eqw-4
  kind: numeric
  stem: Each notebook costs Rs 12. Asha buys n notebooks and a Rs 5 pen and pays Rs 65. How many notebooks did she buy?
  difficulty: standard
  purpose: practice
  concepts:
  - id: equation-word-problems
  explanation: 12n + 5 = 65, so 12n = 60 and n = 5.
  hints:
  - Write 12n + 5 = 65.
  value: 5
  tolerance: 0.0
  verify: (65-5)/12
- key: q-eqw-5
  kind: truefalse
  stem: After solving, we should put the answer back into the story to check it.
  difficulty: intro
  purpose: practice
  concepts:
  - id: equation-word-problems
  explanation: Checking in the story catches mistakes in forming the equation.
  hints:
  - Does the answer fit the story?
  correct: true
- key: q-eqw-6
  kind: numeric
  stem: The sum of three consecutive numbers is 42. What is the smallest of them?
  difficulty: challenge
  purpose: practice
  concepts:
  - id: equation-word-problems
  explanation: x + (x+1) + (x+2) = 42, so 3x + 3 = 42 and x = 13.
  hints:
  - Call the numbers x, x + 1, x + 2.
  value: 13
  tolerance: 0.0
  verify: (42-3)/3
- key: q-eqw-7
  kind: mcq
  stem: '7 less than a number n is 20. Which equation matches this?'
  difficulty: standard
  purpose: practice
  concepts:
  - id: equation-word-problems
    weight: 1.0
  explanation: 7 less than n means take 7 away from n, which is n - 7. So the equation is n - 7 = 20, and n = 27.
  hints:
  - Try the words with a small number. 7 less than 10 is 3.
  correct: B
  options:
  - key: A
    text: 7 - n = 20
    misconception: reverses-less-than
  - key: B
    text: n - 7 = 20
  - key: C
    text: n + 7 = 20
  - key: D
    text: 7n = 20
- key: q-eqw-8
  kind: numeric
  stem: Five more than three times a number is 26. Find the number.
  difficulty: standard
  purpose: practice
  concepts:
  - id: equation-word-problems
  explanation: 3n + 5 = 26, so 3n = 21 and n = 7.
  hints:
  - Write 3n + 5 = 26.
  value: 7
  tolerance: 0.0
  verify: (26-5)/3
- key: q-eqw-9
  kind: numeric
  stem: A rope of 50 metres is cut into 2 equal long pieces and one short piece of 4 metres. How long is each long piece in metres?
  difficulty: standard
  purpose: practice
  concepts:
  - id: equation-word-problems
  explanation: Let each long piece be p metres. 2p + 4 = 50, so 2p = 46 and p = 23.
  hints:
  - Write 2p + 4 = 50.
  value: 23
  tolerance: 0.0
  verify: (50-4)/2
- key: q-eqw-10
  kind: mcq
  stem: A school store has 5 boxes of chalk with the same number c of pieces in each box, and 6 loose pieces. There are 46 pieces in all. How many pieces are in 3 boxes?
  difficulty: challenge
  purpose: test
  concepts:
  - id: equation-word-problems
    weight: 1.0
  explanation: 5c + 6 = 46, so 5c = 40 and c = 8. Three boxes hold 3 times 8, which is 24 pieces.
  hints:
  - First find c. Then answer what the question asks.
  correct: B
  options:
  - key: A
    text: '8'
    misconception: answers-wrong-quantity
  - key: B
    text: '24'
  - key: C
    text: '40'
  - key: D
    text: '14'
- key: q-eqw-11
  kind: mcq
  stem: 'Assertion (A): The equation 3n + 2 = 20 can be read as "three times a number, increased by 2, is 20". Reason (R): In 3n + 2, the number 3n is found first and then 2 is added to it.'
  difficulty: standard
  purpose: test
  concepts:
  - id: equation-word-problems
    weight: 1.0
  explanation: Both are true. 3n is three times n, and the 2 is added to it. R describes how the expression is built, so it explains A.
  hints:
  - Which part of 3n + 2 is made first?
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
- key: q-eqw-12
  kind: numeric
  stem: A mother is 2 years more than 3 times her daughter's age. The mother is 38. How old is the daughter?
  difficulty: challenge
  purpose: test
  concepts:
  - id: equation-word-problems
  explanation: Let the daughter be d years old. 3d + 2 = 38, so 3d = 36 and d = 12.
  hints:
  - Write 3d + 2 = 38.
  value: 12
  tolerance: 0.0
  verify: (38-2)/3
misconceptions:
- code: brackets-misplaced
  concept: equation-word-problems
  description: Writes 2(s + 4) instead of 2s + 4, doubling the extra 4.
- code: reverses-less-than
  concept: equation-word-problems
  description: Writes '7 less than n' as 7 - n, following the order of the words instead of the order of the subtraction.
- code: answers-wrong-quantity
  concept: equation-word-problems
  description: Solves for the letter correctly but gives its value as the answer when the question asks for something else.
cards:
- key: word-problems-card-1
  concept: equation-word-problems
  front: What are the four steps for word problems?
  back: Choose a letter, write the equation, solve it, check in the story.
- key: word-problems-card-2
  concept: equation-word-problems
  front: What does 'twice a number plus 4' look like?
  back: 2n + 4.
- key: word-problems-card-3
  concept: equation-word-problems
  front: How do you write '7 less than n'?
  back: n - 7.
- key: word-problems-card-4
  concept: equation-word-problems
  front: After finding the letter, what must you check?
  back: That you answered what the question asked, and that the answer fits the story.
