- kind: summary
  points:
  - 'Himalayan rivers such as the Ganga, Brahmaputra and Indus begin in the northern mountains and flow all year, fed by snow, glaciers and rain.'
  - 'Peninsular rivers begin on the plateau or hills and depend mainly on rain, so they shrink in the dry months.'
  - 'The Ganga, Godavari, Krishna, Kaveri and Mahanadi reach the Bay of Bengal. The Narmada, Tapi and Indus reach the Arabian Sea.'
  - 'The Narmada flows west between the Vindhya and Satpura ranges. Himalayan rivers keep flowing in the dry months because snow and ice add water to them.'
