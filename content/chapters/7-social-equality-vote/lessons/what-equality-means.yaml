slug: what-equality-means
title: What equality means in a democracy
minutes: 20
objectives:
- Explain what equality means
- Say why a democracy treats every person as equal
- Tell the difference between equal and identical
concepts:
- civics-equality-democracy
origin: ai_assisted
blocks:
- kind: text
  heading: Choosing a class monitor
  html: '<p>Your class is choosing a monitor. Every student gets one chance to vote. The teacher does not say that the tallest child, or the child with the best bag, gets two votes. That would feel unfair. Every voice counts the same.</p><p>This is the idea of <strong>equality</strong>. Equality means that every person is treated as equally important and has the same basic rights. No one is a lesser person because of how rich they are, what they believe, where their family comes from, or whether they are a girl or a boy.</p>'
- kind: text
  heading: Why a democracy needs equality
  html: '<p>A <strong>democracy</strong> is a way of running a country in which the people choose their leaders. If some people had more say than others, the leaders would listen mostly to them. The rest would be ignored.</p><p>So a democracy treats all people as equal. Everyone is equal before the law. Everyone has the same basic rights. The Constitution of India, which came into force on 26 January 1950, accepts this idea.</p>'
- kind: figure
  svg: <svg viewBox="0 0 320 130" role="img"><rect x="10" y="20" width="140" height="90" rx="8" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><text x="80" y="42" font-size="11" text-anchor="middle" fill="#14193a">Equal say</text><circle cx="40" cy="70" r="10" fill="#ffb800" stroke="#14193a" stroke-width="2"/><circle cx="80" cy="70" r="10" fill="#ffb800" stroke="#14193a" stroke-width="2"/><circle cx="120" cy="70" r="10" fill="#ffb800" stroke="#14193a" stroke-width="2"/><text x="80" y="102" font-size="10" text-anchor="middle" fill="#14193a">1 vote each</text><rect x="170" y="20" width="140" height="90" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="240" y="42" font-size="11" text-anchor="middle" fill="currentColor">Unequal say</text><circle cx="200" cy="70" r="16" fill="#ffb800" stroke="#14193a" stroke-width="2"/><circle cx="250" cy="70" r="7" fill="#ffb800" stroke="#14193a" stroke-width="2"/><circle cx="285" cy="70" r="7" fill="#ffb800" stroke="#14193a" stroke-width="2"/><text x="240" y="102" font-size="10" text-anchor="middle" fill="currentColor">some count more</text></svg>
  alt: Two boxes side by side. In one, three equal circles show an equal say. In the other, one large circle and two small ones show an unequal say.
  caption: In a democracy every person is like the equal circles on the left. No one counts for more than another.
- kind: example
  heading: Worked example
  prompt: 'A class of 40 students votes for a monitor between two candidates, Asha and Ravi. Each student has one vote. 26 vote for Asha. How many vote for Ravi, and who wins?'
  steps:
  - 'Every student has one vote, so there are 40 votes in all.'
  - 'Votes for Ravi = 40 - 26 = 14.'
  - 'Compare: 26 is more than 14, so Asha wins.'
  - 'Check: 26 + 14 = 40, which is all the votes.'
- kind: example
  heading: Worked reasoning
  prompt: 'Some say, "Equality means everyone must get exactly the same things, even if their needs differ." Is that what equality in a democracy means?'
  steps:
  - 'Equality is about equal worth and equal rights, such as the right to be heard.'
  - 'A child who is ill may need medicine. A child who is well does not. Giving both the same medicine is not sensible.'
  - 'So people can be different and have different needs, and still be equal in worth and rights.'
  - 'Equal does not mean identical.'
- kind: callout
  tone: watch
  html: Equal does not mean the same. People are different in many ways. Equality means no one is treated as less important, and everyone has the same basic rights.
- kind: callout
  tone: real
  html: When a school election gives each student one vote, or when a queue serves people in turn, that is equality at work. Nobody can buy a better place in the line.
- kind: check
  item: q-eq-1
- kind: check
  item: q-eq-2
- kind: check
  item: q-eq-3
- kind: summary
  points:
  - 'Equality means every person is equally important and has the same basic rights.'
  - 'A democracy lets people choose their leaders, so it must treat all people as equal.'
  - 'Equal does not mean identical. People differ, but their worth and rights are equal.'
items:
- key: q-eq-1
  kind: mcq
  stem: What does equality mean in a democracy?
  difficulty: intro
  purpose: check
  concepts:
  - id: civics-equality-democracy
  explanation: Equality means every person is treated as equally important and has the same basic rights.
  hints:
  - Think of one vote for each student.
  correct: B
  options:
  - key: A
    text: Rich people have more say than poor people
    misconception: richer-more-say
  - key: B
    text: Every person is equally important and has the same basic rights
  - key: C
    text: Everyone must be exactly the same
    misconception: equal-means-same
  - key: D
    text: Only leaders have rights
    misconception: richer-more-say
- key: q-eq-2
  kind: truefalse
  stem: In a democracy, a rich person has more rights than a poor person.
  difficulty: intro
  purpose: check
  concepts:
  - id: civics-equality-democracy
  explanation: False. In a democracy every person has the same basic rights, whatever their wealth.
  hints:
  - Does money change how important a person is?
  correct: false
- key: q-eq-3
  kind: mcq
  stem: What is a democracy?
  difficulty: intro
  purpose: check
  concepts:
  - id: civics-equality-democracy
  explanation: In a democracy, the people choose their leaders.
  hints:
  - Who chooses the leaders?
  correct: C
  options:
  - key: A
    text: A country where one family rules for ever
    misconception: richer-more-say
  - key: B
    text: A country with no rules
    misconception: richer-more-say
  - key: C
    text: A way of running a country in which the people choose their leaders
  - key: D
    text: A country where only teachers decide
    misconception: richer-more-say
- key: q-eq-4
  kind: numeric
  stem: A class of 40 students has an election with two candidates. Each student has one vote. 26 vote for one candidate. How many vote for the other?
  difficulty: standard
  purpose: practice
  concepts:
  - id: civics-equality-democracy
  explanation: 40 votes in all, so the other candidate gets 40 - 26 = 14 votes.
  hints:
  - Every student votes once, so add up to 40.
  value: 14
  tolerance: 0.0
  verify: 40-26
- key: q-eq-5
  kind: mcq
  stem: Two students are different. One is tall and one is short. A teacher gives each of them one vote. What does this show?
  difficulty: standard
  purpose: practice
  concepts:
  - id: civics-equality-democracy
  explanation: People can differ in height and in many other ways, yet each has an equal say. Equal does not mean identical.
  hints:
  - Does height change the value of a vote?
  correct: A
  options:
  - key: A
    text: People can be different and still be equal in rights
  - key: B
    text: Tall people are more important
    misconception: richer-more-say
  - key: C
    text: Equality means people must look the same
    misconception: equal-means-same
  - key: D
    text: Short people should have two votes
    misconception: richer-more-say
- key: q-eq-6
  kind: mcq
  stem: Why must a democracy treat all people as equal?
  difficulty: standard
  purpose: practice
  concepts:
  - id: civics-equality-democracy
  explanation: Leaders are chosen by the people. If some people had more say, the leaders would listen mostly to them and ignore the rest.
  hints:
  - Think of who the leaders would listen to.
  correct: D
  options:
  - key: A
    text: So that everyone is made the same
    misconception: equal-means-same
  - key: B
    text: So that rich people can pay for more votes
    misconception: richer-more-say
  - key: C
    text: So that leaders never change
    misconception: richer-more-say
  - key: D
    text: So that no group is ignored when leaders are chosen
- key: q-eq-7
  kind: mcq
  stem: 'Assertion (A): Equality does not mean that everyone is the same. Reason (R): People differ in many ways but have equal worth and the same basic rights.'
  difficulty: standard
  purpose: test
  concepts:
  - id: civics-equality-democracy
  explanation: Both statements are true. Differences do not reduce a person's worth, so R explains A.
  hints:
  - Ask whether R gives the reason for A.
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
    misconception: equal-means-same
  - key: C
    text: A is true, but R is false
    misconception: equal-means-same
  - key: D
    text: A is false, but R is true
    misconception: equal-means-same
- key: q-eq-8
  pattern: case
  kind: mcq
  stem: 'Read this note. A school club has 30 members. The club gives each member one vote to choose its captain. The president of the club says, "My vote should count as three, because I am the president." The other members say that is not fair. What is the best view?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: civics-equality-democracy
  explanation: Equality means every member has an equal say. A position does not make one person's vote count for more, so each member should have one vote.
  hints:
  - Does a title change how important a person's voice is?
  correct: C
  options:
  - key: A
    text: The president is right, because leaders deserve more votes
    misconception: richer-more-say
  - key: B
    text: The members are wrong, because the club should be run by one person
    misconception: richer-more-say
  - key: C
    text: The members are right, because each member should have an equal say
  - key: D
    text: Nobody should vote, because people are different
    misconception: equal-means-same
misconceptions:
- code: equal-means-same
  concept: civics-equality-democracy
  description: Thinks equality means everyone must be the same, when people differ but have equal worth and rights.
- code: richer-more-say
  concept: civics-equality-democracy
  description: Thinks wealth, a title or a position gives a person more say, when a democracy gives everyone an equal say.
