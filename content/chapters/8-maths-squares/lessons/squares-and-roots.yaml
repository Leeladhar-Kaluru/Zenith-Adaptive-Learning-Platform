misconceptions:
- code: doubles-instead-of-squares
  concept: squares-roots
  description: Multiplies the number by 2 instead of by itself.
- code: tests-wrong-squares
  concept: squares-roots
  description: Picks the wrong perfect squares when estimating a square root.
- code: halves-instead-of-root
  concept: squares-roots
  description: Divides by 2 to find a square root instead of finding the number that multiplies by itself.
cards:
- key: squares-and-roots-card-1
  concept: squares-roots
  front: What is a perfect square?
  back: A whole number times itself, like 25 = 5 times 5.
- key: squares-and-roots-card-2
  concept: squares-roots
  front: What does a square root do?
  back: It undoes squaring.
- key: squares-and-roots-card-3
