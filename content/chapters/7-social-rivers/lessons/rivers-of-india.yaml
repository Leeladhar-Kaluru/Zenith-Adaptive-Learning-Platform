slug: rivers-of-india
title: Rivers of India
minutes: 25
objectives:
- Tell Himalayan rivers from peninsular rivers and give one reason for each difference
- Name the sea that each of the main rivers reaches
- Find the Ganga, Brahmaputra, Indus, Godavari, Krishna, Kaveri, Narmada, Tapi and Mahanadi on a map
- Explain why Himalayan rivers flow all year
