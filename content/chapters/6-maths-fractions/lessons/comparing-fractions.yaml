  caption: Three fifths is longer than three eighths. Fifths are bigger pieces.
- kind: text
  heading: Use one half as a marker
  html: <p>Sometimes both the numerator and the denominator are different. Then use <strong>1/2</strong> as a marker. A fraction
    is more than 1/2 when its numerator is more than half of its denominator. It is less than 1/2 when its numerator is less
    than half of its denominator.</p><p>For example, 4/8 is exactly 1/2. So 5/8 is more than 1/2 and 3/8 is less than 1/2.
    A fraction above the marker beats a fraction below it.</p>
- kind: example
  heading: 'Worked example: a different numerator and denominator'
  prompt: Which is greater, 2/5 or 5/8?
  steps:
  - The numerators and the denominators are both different, so use 1/2 as a marker.
  - Half of 5 is 2 and a half. The numerator 2 is less than that, so 2/5 is less than 1/2.
  - Half of 8 is 4. The numerator 5 is more than 4, so 5/8 is more than 1/2.
  - 5/8 is above the marker and 2/5 is below it. So 5/8 is greater than 2/5.
  - 'Check: 2/5 is a bit less than a half and 5/8 is a bit more than a half. The answer makes sense.'
- kind: callout
  tone: remember
  html: Two fractions can be compared by looking at the numerator, the denominator, or a marker like 1/2. Pick the quickest
    way for the numbers you have.
- kind: check
  item: q-fc-1
- kind: check
  item: q-fc-2
- kind: check
  item: q-fc-3
