  stem: ‘నది’ ఒక సామాన్య పేరు. ‘గోదావరి’ ఒక నదికి ఉన్న ప్రత్యేక పేరు. ఈ రెండింటిలో నామవాచకాలు ఏవి?
  difficulty: challenge
  purpose: test
  concepts:
  - id: telugu-namavachakam
  explanation: ఒక వ్యక్తి, వస్తువు లేదా ప్రదేశం పేరు ఏదైనా నామవాచకమే. సామాన్య పేరు, ప్రత్యేక పేరు రెండూ నామవాచకాలు.
