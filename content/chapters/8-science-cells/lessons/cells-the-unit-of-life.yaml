  stem: Which of these is found in plant cells but NOT in animal cells?
  difficulty: standard
  purpose: practice
  concepts:
  - id: cell-unit-of-life
  explanation: The cell wall is found outside the membrane in plant cells. Animal cells have a membrane but no cell wall. Plant and animal cells all have a membrane, cytoplasm and a nucleus.
  hints:
  - Three of the four are in both plant and animal cells.
  correct: D
  options:
  - key: A
    text: Nucleus
  - key: B
    text: Cytoplasm
  - key: C
