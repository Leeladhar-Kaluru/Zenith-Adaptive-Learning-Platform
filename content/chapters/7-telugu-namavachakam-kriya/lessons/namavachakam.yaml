  difficulty: standard
  purpose: practice
  concepts:
  - id: telugu-namavachakam
  explanation: ‘చెట్టు’ బహువచనంలో ‘చెట్లు’ అవుతుంది. ‘చెట్టులు’ అని రాయడం తప్పు.
  hints:
  - ఒక చెట్టు, రెండు ... ?
  correct: B
  options:
