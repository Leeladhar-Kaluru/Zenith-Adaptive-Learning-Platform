- key: q-ph-7
  kind: truefalse
  stem: 'True or false: If you keep adding water to a strong acid, its pH can rise above 7 and the acid becomes a base.'
  difficulty: standard
  purpose: practice
  concepts:
  - id: ph-scale
  explanation: False. Adding water lowers the hydrogen ion concentration, so the pH rises toward 7. It never becomes a base by dilution alone.
  hints:
  - Water is neutral. Can it make a base?
  correct: false
- key: q-ph-8
  kind: match
  stem: Match each situation to the idea behind it.
  difficulty: standard
  purpose: practice
  concepts:
  - id: ph-scale
  explanation: Antacids neutralise excess acid, enamel wears away below pH 5.5, lime raises the pH of acidic soil, and an acid with a base gives salt and water.
  hints:
  - Think about which side of pH 7 each situation is on.
  pairs:
    Excess acid in the stomach: An antacid neutralises it
    Tooth enamel wearing away: Mouth pH falls below 5.5
    Soil that is too acidic: Slaked lime is added to raise the pH
    Acid reacts with a base: A salt and water are formed
- key: q-ph-9
  kind: mcq
  stem: 'Assertion (A): A solution of pH 3 is more acidic than a solution of pH 5. Reason (R): A lower pH means a higher amount of hydrogen ions.'
  difficulty: standard
  purpose: test
  concepts:
  - id: ph-scale
  explanation: Both statements are true. The pH 3 solution has more hydrogen ions, and that is what makes it more acidic.
  hints:
  - Which has more hydrogen ions, pH 3 or pH 5?
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
    misconception: higher-ph-more-acidic
  - key: D
    text: A is false, but R is true
    misconception: higher-ph-more-acidic
- key: q-ph-10
  kind: mcq
  stem: 'Assertion (A): Adding a lot of water to a strong acid can turn it into a basic solution. Reason (R): Dilution lowers the amount of hydrogen ions in a given volume.'
  difficulty: challenge
  purpose: test
  concepts:
  - id: ph-scale
  explanation: A is false, since dilution moves the pH toward 7 but cannot take it past 7. R is true, since the same hydrogen ions are spread in more water.
  hints:
  - Can water alone ever give pH above 7?
  correct: D
  options:
  - key: A
    text: Both A and R are true, and R explains A
    misconception: dilution-makes-base
  - key: B
    text: Both A and R are true, but R does not explain A
    misconception: dilution-makes-base
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
- key: q-ph-11
  kind: mcq
  stem: 'Read this. After a heavy meal a person feels a burning in the chest. She chews an antacid tablet, which contains a mild base, and feels better in a few minutes. Which explanation is correct?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: ph-scale
  explanation: The base in the tablet reacts with the extra stomach acid. This is neutralisation. The acid is used up and the pH moves a little toward 7.
  hints:
  - Think about what a base does to an acid.
  correct: B
  options:
  - key: A
    text: The tablet adds more acid so the stomach can digest faster
    misconception: higher-ph-more-acidic
  - key: B
    text: The tablet neutralises some of the extra stomach acid
  - key: C
    text: The tablet turns the stomach acid into pure water only
  - key: D
    text: The tablet makes the stomach strongly basic
    misconception: dilution-makes-base
- key: q-ph-12
  kind: mcq
  stem: 'Read this. A farmer finds that the soil in one field is too acidic for her crop. A test shows its pH is well below 7. She spreads slaked lime, which is basic. What should happen to the soil pH?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: ph-scale
  explanation: A base neutralises some of the acid in the soil, so the pH rises toward 7.
  hints:
  - What does a base do to an acid?
  correct: C
  options:
  - key: A
    text: It should fall even lower
    misconception: higher-ph-more-acidic
  - key: B
    text: It should stay exactly the same
  - key: C
    text: It should rise toward 7
  - key: D
    text: It should become zero
    misconception: neutral-is-zero
- key: q-ph-13
  kind: mcq
  stem: Why is toothpaste usually basic?
  difficulty: standard
  purpose: practice
  concepts:
  - id: ph-scale
  explanation: Bacteria in the mouth make acid from sugar, and acid can wear enamel away. A basic toothpaste neutralises some of that acid.
  hints:
  - What does a base do to an acid?
  correct: A
  options:
  - key: A
    text: To neutralise the acids made in the mouth
  - key: B
    text: To make the teeth acidic
    misconception: higher-ph-more-acidic
  - key: C
    text: To change the pH of the mouth to zero
    misconception: neutral-is-zero
  - key: D
    text: To make bacteria produce more acid
misconceptions:
- code: higher-ph-more-acidic
  concept: ph-scale
  description: Thinks a higher pH means a more acidic solution, when a lower pH means more acidic.
- code: neutral-is-zero
  concept: ph-scale
  description: Thinks neutral is pH 0, or that pH 0 means no acid, when neutral is 7 and 0 is very strongly acidic.
- code: dilution-makes-base
  concept: ph-scale
  description: Thinks adding water can turn an acid into a base, when dilution only moves the pH toward 7.
- code: pink-means-acid
  concept: ph-scale
  description: Thinks the pink colour of phenolphthalein shows an acid, when it shows a base.
