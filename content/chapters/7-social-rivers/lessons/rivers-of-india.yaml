- kind: example
  heading: Worked reasoning
  prompt: A river begins in the Western Ghats, flows east across the plateau and reaches the Bay of Bengal. In summer its flow is much smaller. Is it Himalayan or peninsular?
  steps:
  - 'Look at where it begins. The Western Ghats are on the peninsula, not in the northern mountains.'
  - 'Look at the direction and the sea. Flowing east to the Bay of Bengal fits the Krishna, Godavari or Kaveri.'
  - 'Look at the flow in summer. A river that shrinks in the dry months depends mainly on rain, not on glaciers.'
  - 'All three clues say peninsular. A Himalayan river would begin in the mountains and keep water all year.'
- kind: example
  heading: Worked reasoning
  prompt: Why does the Ganga still have water in the dry months of April and May while many peninsular rivers have very little?
  steps:
  - 'Find where the Ganga starts. It begins from the Gangotri glacier in the Himalayas.'
  - 'In the hot months glaciers and snow melt. The melt water keeps flowing into the river.'
  - 'A peninsular river has no glacier. Its water comes mainly from rain, so it falls when rain stops.'
  - 'Conclusion. The snow and glacier store gives the Ganga water all year. Rain-fed rivers rise and fall with the seasons.'
- kind: callout
  tone: watch
  html: Do not think every river in India flows east. The Narmada and Tapi flow west to the Arabian Sea, and the Indus flows west too. Also, a peninsular river is not always small. The Godavari is a very large river. The difference is the source of water, not the size.
- kind: callout
  tone: real
  html: Cities and farms depend on rivers. In the dry months a peninsular river can nearly dry up, so people store monsoon water in dams and tanks. A Himalayan river like the Ganga keeps flowing, so canals from it can water fields all year.
