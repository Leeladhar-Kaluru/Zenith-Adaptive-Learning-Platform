concepts:
  - {id: friction-types, title: "Friction and its types", grade: 8, subject: science, description: "Friction as a force that opposes sliding, its causes, static, sliding and rolling friction, uses and harms, and ways to increase or reduce it.", keywords: [friction, static, sliding, rolling, lubricant, ball bearing, rough surface]}
  - {id: friction-critical-angle, title: "Friction on a ramp", grade: 8, subject: science, description: "A block on a ramp starts to slide at a critical angle that depends only on the surface, not on the mass; tan of the angle equals mu.", keywords: [ramp, incline, critical angle, static friction, sliding friction, surface], prerequisites: [{id: friction-types, why: "Students need to know what static and sliding friction are before using them on a ramp."}]}
