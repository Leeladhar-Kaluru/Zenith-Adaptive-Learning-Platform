slug: with-fractions
title: Equations with fractions
minutes: 15
objectives:
- Clear fractions by multiplying both sides by the common denominator
- Solve linear equations that contain fractions
concepts:
- linear-eq-fractions
origin: ai_assisted
blocks:
- kind: text
  heading: Clear the fractions first
  html: <p>To remove fractions, multiply <strong>both sides</strong> by the smallest number that every denominator divides
    into. This is the lowest common multiple (LCM).</p>
- kind: example
  heading: Worked example
  prompt: Solve x/2 + x/3 = 5.
  steps:
  - 'The LCM of 2 and 3 is 6. Multiply both sides by 6: 3x + 2x = 30.'
  - 'Combine: 5x = 30.'
  - 'Divide by 5: x = 6. Check: 6/2 + 6/3 = 3 + 2 = 5.'
- kind: widget
  widget: sim_equation
  config: {a: 5, b: 0, c: 30}
  task: Multiplying x/2 + x/3 = 5 by 6 gives 5x = 30. Get x alone using the moves. Then put your answer back into x/2 + x/3 and check that you get 5.
- kind: text
  heading: Why multiplying is allowed
  html: <p>Multiplying <strong>both sides</strong> by the same number keeps an equation balanced, just like adding the same number to both sides. When the number is the LCM, each denominator divides into it exactly. So every fraction turns into a whole-number term. For example, 6 times x/2 is 3x, and 6 times x/3 is 2x.</p>
- kind: example
  heading: Fractions with brackets
  prompt: Solve (x + 2)/3 = (x - 1)/2.
  steps:
  - 'The LCM of 3 and 2 is 6. Multiply both sides by 6.'
  - 'On the left, 6 times (x + 2)/3 is 2(x + 2). On the right, 6 times (x - 1)/2 is 3(x - 1). So 2(x + 2) = 3(x - 1).'
  - 'Open the brackets: 2x + 4 = 3x - 3.'
  - 'Subtract 2x and add 3 to both sides: 7 = x.'
  - 'Check: (7 + 2)/3 = 3 and (7 - 1)/2 = 3. Both sides match.'
- kind: example
  heading: A fraction and a number
  prompt: Solve x/3 + 2 = 5.
  steps:
  - 'Multiply EVERY term by 3. x/3 becomes x, 2 becomes 6 and 5 becomes 15. So x + 6 = 15.'
  - 'Subtract 6 from both sides: x = 9.'
  - 'Check: 9/3 + 2 = 3 + 2 = 5.'
- kind: callout
  tone: watch
  html: Multiply <strong>every</strong> term by the LCM, including the number on the other side.
- kind: check
  item: q-frac-1
- kind: callout
  tone: real
  html: A cook uses half of a bag of rice at lunch and a third of the bag at dinner. That is 500 g in all. If the bag weighs x g, then x/2 + x/3 = 500. Multiply by 6 to get 5x = 3000. So the bag weighs x = 600 g.
- kind: check
  item: q-frac-2
- kind: check
  item: q-frac-8
- kind: summary
  points:
  - Find the LCM of the denominators.
  - Multiply every term on both sides by it.
  - Then solve the equation without fractions.
  - Check your answer in the original equation.
