slug: number-line
title: Numbers on both sides of zero
minutes: 12
objectives:
- Place positive and negative integers on a number line
- Say how far a number is from zero and in which direction
concepts:
- integers-number-line
origin: ai_assisted
blocks:
- kind: text
  heading: Beyond zero
  html: <p>Think of a lift in a tall building. The ground floor is 0. Floors above are 1, 2, 3. A basement is <strong>below</strong>
    zero, so we call the first basement floor <strong>-1</strong>.</p><p>Whole numbers together with their negatives and zero
    are called <strong>integers</strong>.</p>
- kind: widget
  widget: numberline
  config:
    start: 0
    min: -6
    max: 6
- kind: figure
  svg: <svg viewBox="0 0 320 90" role="img"><line x1="10" y1="48" x2="310" y2="48" stroke="currentColor" stroke-width="4"
    stroke-linecap="round"/><g font-size="14" font-weight="700" text-anchor="middle" fill="currentColor"><text x="40" y="78">-3</text><text
    x="100" y="78">-2</text><text x="160" y="78">-1</text><text x="220" y="78">0</text><text x="280" y="78">1</text></g><circle
    cx="220" cy="48" r="8" fill="#ffd43b" stroke="#14193a" stroke-width="3"/></svg>
  alt: A number line with minus 3, minus 2, minus 1, 0 and 1. A yellow dot marks zero.
  caption: Negative numbers sit to the left of zero.
- kind: callout
  tone: real
  html: In Shimla on a winter night the temperature can drop to <strong>-3 degrees</strong>. That is three degrees below zero.
- kind: text
  heading: Distance and opposites
  html: <p>Every integer has a <strong>distance from zero</strong>. It tells you how many steps you take to get from 0 to
    that number. The distance is never negative.</p><p>The numbers 3 and -3 are both 3 steps from zero, but on opposite sides.
    We call them <strong>opposites</strong>. The opposite of 0 is 0.</p>
- kind: figure
  svg: <svg viewBox="0 0 320 120" role="img"><line x1="13" y1="60" x2="307" y2="60" stroke="currentColor" stroke-width="4"
    stroke-linecap="round"/><g font-size="13" font-weight="700" text-anchor="middle" fill="currentColor"><line x1="25" y1="54"
    x2="25" y2="66" stroke="currentColor" stroke-width="2"/><text x="25" y="86">-3</text><line x1="70" y1="54" x2="70" y2="66"
    stroke="currentColor" stroke-width="2"/><text x="70" y="86">-2</text><line x1="115" y1="54" x2="115" y2="66" stroke="currentColor"
    stroke-width="2"/><text x="115" y="86">-1</text><line x1="160" y1="54" x2="160" y2="66" stroke="currentColor" stroke-width="2"/><text
    x="160" y="86">0</text><line x1="205" y1="54" x2="205" y2="66" stroke="currentColor" stroke-width="2"/><text x="205" y="86">1</text><line
    x1="250" y1="54" x2="250" y2="66" stroke="currentColor" stroke-width="2"/><text x="250" y="86">2</text><line x1="295"
    y1="54" x2="295" y2="66" stroke="currentColor" stroke-width="2"/><text x="295" y="86">3</text></g><path d="M160 36 Q92.5
    -4 25 36" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M160 36 Q227.5 -4 295 36" fill="none" stroke="currentColor"
    stroke-width="2.5"/><text x="92" y="14" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">3 steps</text><text
    x="228" y="14" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">3 steps</text><circle cx="25"
    cy="60" r="8" fill="#ffd43b" stroke="#14193a" stroke-width="3"/><circle cx="295" cy="60" r="8" fill="#ffd43b" stroke="#14193a"
    stroke-width="3"/><circle cx="160" cy="60" r="8" fill="#ffffff" stroke="#14193a" stroke-width="3"/></svg>
  alt: A number line from minus 3 to 3. Arcs from zero to minus 3 and from zero to 3 are each labelled 3 steps.
  caption: 3 and -3 are opposites. Each is 3 steps from zero.
- kind: example
  heading: 'Worked example: place a number'
  prompt: Where is -4 on the number line? How far is it from zero?
  steps:
  - Start at 0.
  - The sign is minus, so move to the left.
  - Count 4 steps to the left. You land on -4.
  - You took 4 steps, so -4 is 4 steps from zero. Its opposite, 4, is 4 steps to the right.
- kind: example
  heading: 'Worked example: a lift'
  prompt: A lift is on floor 1 and goes down 4 floors. Which floor does it reach?
  steps:
  - Start at 1 on the number line.
  - Going down means moving left.
  - 'Move 4 steps left: 0, -1, -2, -3.'
  - The lift stops at -3, which is the third basement floor.
  - 'Check: from 1 to 0 is 1 step, and 3 more steps reach -3. That is 4 steps in all.'
- kind: callout
  tone: watch
  html: -2 is not the same as 2. The minus sign puts the number on the left side of zero. Always read the sign before you
    read the digit.
- kind: check
  item: q-int-line-1
- kind: check
  item: q-int-line-3
- kind: check
  item: q-int-line-10
- kind: summary
  points:
  - Integers are whole numbers, their negatives and zero.
  - Negative numbers are to the left of zero.
  - Zero is neither positive nor negative.
items:
- key: q-int-line-1
  kind: mcq
  stem: Which number is two steps to the left of 0?
  difficulty: intro
  purpose: check
  concepts:
  - id: integers-number-line
    weight: 1.0
  explanation: Left of zero means negative, so two steps left is -2.
  hints:
  - Left of zero is the negative side.
  correct: B
  options:
  - key: A
    text: '2'
    misconception: drops-the-sign
  - key: B
    text: '-2'
  - key: C
    text: '-1'
  - key: D
    text: '0'
- key: q-int-line-2
  kind: numeric
  stem: What number is 4 steps to the left of 0?
  difficulty: intro
  purpose: practice
  concepts:
  - id: integers-number-line
  explanation: Four steps left of zero is -4.
  hints:
  - Count 4 steps to the left starting at 0.
  value: -4
  tolerance: 0.0
  verify: 0-4
- key: q-int-line-3
  kind: truefalse
  stem: -5 is to the right of -2 on the number line.
  difficulty: standard
  purpose: practice
  concepts:
  - id: integers-number-line
  explanation: -5 is further left than -2, so it is to the left of -2.
  hints:
  - Which of them is closer to zero?
  correct: false
- key: q-int-line-4
  kind: mcq
  stem: A lift is on floor 2 and goes down 5 floors. Which floor does it reach?
  difficulty: standard
  purpose: test
  concepts:
  - id: integers-number-line
    weight: 1.0
  explanation: 'Going down is moving left: 2 minus 5 is -3.'
  hints:
  - Start at 2 and move 5 steps to the left.
  correct: A
  options:
  - key: A
    text: '-3'
  - key: B
    text: '3'
    misconception: reverses-subtraction
  - key: C
    text: '-7'
  - key: D
    text: '7'
  verify: 2-5
- key: q-int-line-5
  kind: fill
  stem: The number that is neither positive nor negative is ____.
  difficulty: intro
  purpose: practice
  concepts:
  - id: integers-number-line
  explanation: Zero is the number between the positives and the negatives.
  hints:
  - It is where the number line splits.
  accepted:
  - '0'
  - zero
- key: q-int-line-6
  kind: mcq
  stem: 'Assertion (A): -6 lies to the left of -2 on the number line. Reason (R): Among negative numbers, the one with the
    bigger digit lies further to the left.'
  difficulty: standard
  purpose: test
  concepts:
  - id: integers-number-line
    weight: 1.0
  explanation: -6 is 6 steps left of zero and -2 is only 2 steps left of zero. So -6 is to the left of -2. A is true. R is
    the rule behind it, so R explains A.
  hints:
  - Count the steps left of zero for each number.
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
    misconception: bigger-digit-lies-right
- key: q-int-line-7
  kind: mcq
  stem: 'Assertion (A): The integers 4 and -4 are the same distance from zero. Reason (R): 4 and -4 lie on opposite sides
    of zero.'
  difficulty: standard
  purpose: test
  concepts:
  - id: integers-number-line
    weight: 1.0
  explanation: Both are 4 steps from zero, so A is true. R is also true, but being on opposite sides does not tell us the
    distance. R does not explain A.
  hints:
  - Count the steps from zero to 4 and from zero to -4.
  correct: B
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
- key: q-int-line-8
  kind: mcq
  stem: 'Night temperatures of a town in degrees Celsius were: Monday -2, Tuesday 3, Wednesday -5, Thursday 0. On which day
    was the reading furthest to the left on the number line, the coldest?'
  difficulty: standard
  purpose: test
  concepts:
  - id: integers-number-line
    weight: 1.0
  explanation: Place -2, 3, -5 and 0 on the line. -5 is furthest left. So Wednesday was the coldest.
  hints:
  - Negative numbers are left of zero. Which one is furthest left?
  correct: C
  options:
  - key: A
    text: Monday
  - key: B
    text: Tuesday
  - key: C
    text: Wednesday
  - key: D
    text: Thursday
- key: q-int-line-9
  kind: numeric
  stem: How many steps do you take to go from -4 to 3 along the number line?
  difficulty: challenge
  purpose: test
  concepts:
  - id: integers-number-line
  explanation: From -4 to 0 is 4 steps. From 0 to 3 is 3 more steps. In all, 4 + 3 = 7 steps.
  hints:
  - Count the steps from -4 to 0 first.
  - Then count the steps from 0 to 3.
  value: 7
  tolerance: 0.0
  verify: 4+3
- key: q-int-line-10
  kind: mcq
  stem: Which integer is the opposite of -9?
  difficulty: intro
  purpose: check
  concepts:
  - id: integers-number-line
    weight: 1.0
  explanation: The opposite of a number is the same distance from zero on the other side. The opposite of -9 is 9.
  hints:
  - The opposite lies on the other side of zero.
  correct: B
  options:
  - key: A
    text: '-9'
    misconception: drops-the-sign
  - key: B
    text: '9'
  - key: C
    text: '0'
  - key: D
    text: '-1'
misconceptions:
- code: drops-the-sign
  concept: integers-number-line
  description: Ignores the minus sign and treats -2 as 2.
- code: reverses-subtraction
  concept: integers-number-line
  description: Subtracts the smaller number from the larger and ignores direction.
- code: bigger-digit-lies-right
  concept: integers-number-line
  description: Thinks -6 is to the right of -2 because 6 is a bigger digit than 2.
cards:
- key: number-line-card-1
  concept: integers-number-line
  front: What is an integer?
  back: A whole number that can be positive, negative or zero, like -3, 0 or 5.
- key: number-line-card-2
  concept: integers-number-line
  front: Where are negative numbers on the number line?
  back: To the left of zero.
