  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
    misconception: wall-is-membrane
  - key: D
    text: A is false, but R is true
- key: q-cl-10
  kind: mcq
  stem: 'Assertion (A): Chloroplasts are present in all the cells of a plant. Reason (R): Chloroplasts hold chlorophyll, which traps light for making food.'
  difficulty: challenge
  purpose: test
  concepts:
  - id: cell-unit-of-life
  explanation: A is false, because root cells and onion bulb cells have no chloroplasts. R is true, since chlorophyll traps light, but it does not make A true.
  hints:
  - Do cells under the soil get light?
  correct: D
  options:
  - key: A
    text: Both A and R are true, and R explains A
    misconception: all-plant-cells-green
  - key: B
    text: Both A and R are true, but R does not explain A
    misconception: all-plant-cells-green
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
- key: q-cl-11
  kind: mcq
  stem: 'Read this. A student studies two slides. Slide X shows box-shaped cells packed closely, each with a thick outline and one large clear space inside. Slide Y shows roundish cells with only a thin outline and several tiny spaces. Which statement is the best conclusion?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: cell-unit-of-life
  explanation: A thick outline is a cell wall and a large clear space is a large vacuole, so Slide X is a plant. A thin outline and only small vacuoles fit an animal cell, so Slide Y is an animal.
  hints:
  - Which slide shows a cell wall and a large vacuole?
  correct: C
  options:
  - key: A
    text: Both slides show animal cells
  - key: B
    text: Slide X shows an animal cell and Slide Y shows a plant cell
    misconception: wall-is-membrane
  - key: C
    text: Slide X shows a plant cell and Slide Y shows an animal cell
  - key: D
    text: Both slides show plant cells because they have vacuoles
- key: q-cl-12
  kind: mcq
  stem: Cells from an onion bulb show no green colour under the microscope, even though onion is a plant. What is the best reason?
  difficulty: challenge
  purpose: test
  concepts:
  - id: cell-unit-of-life
  explanation: The bulb grows under the ground in the dark, and its cells do not contain chloroplasts. Having no chloroplasts means no green colour, even though they are plant cells.
  hints:
  - Where does the bulb grow, and what do chloroplasts need?
  correct: B
  options:
  - key: A
    text: Onion cells are animal cells
  - key: B
    text: Bulb cells have no chloroplasts
  - key: C
    text: Plant cells have no nucleus
  - key: D
    text: The cell wall removes the green colour
    misconception: wall-is-membrane
misconceptions:
- code: wall-is-membrane
  concept: cell-unit-of-life
  description: Mixes up the cell wall with the cell membrane, or thinks that a plant cell has a wall instead of a membrane. A plant cell has both.
- code: all-plant-cells-green
  concept: cell-unit-of-life
  description: Thinks every cell in a plant contains chloroplasts, when only cells that receive light, such as leaf cells, do.
- code: cytoplasm-is-empty
  concept: cell-unit-of-life
  description: Thinks the cytoplasm is just empty space, when it is a fluid that holds the cell parts and where many jobs happen.
