  difficulty: standard
  purpose: test
  concepts:
  - id: float-sink
    weight: 1.0
  explanation: Water has a density of about 1 g/cm³. 0.8 is less than 1, so the object floats. A is true. R is the reason,
    so R explains A.
  hints:
  - Compare 0.8 with 1.
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
    misconception: heavier-number-sinks
- key: q-fs-11
