slug: kriya
title: క్రియ
minutes: 20
language: te
origin: ai_assisted
objectives:
- క్రియ అంటే ఏమిటో చెప్పగలగడం
- వాక్యంలో క్రియను గుర్తించడం
- భూత, వర్తమాన, భవిష్యత్ కాలాలను గుర్తించడం
- క్రియ రూపాన్ని మార్చి వేరే కాలంలో రాయడం
concepts:
- telugu-kriya
blocks:
- kind: text
  heading: ఉదయం నుండి రాత్రి వరకు పనులు
  html: '<p>ఉదయం లేస్తాం, పళ్ళు తోముతాం, అన్నం తింటాం, బడికి వెళ్తాం, చదువుతాం, ఆడతాం. ఇవన్నీ మనం చేసే పనులు.</p><p>పని చేయడాన్ని తెలిపే మాటను <strong>క్రియ</strong> అంటారు. వాక్యంలో ఎవరు ఏ పని చేశారో క్రియ చెబుతుంది. ఉదాహరణకు గోపి అన్నం తిన్నాడు అనే వాక్యంలో ‘తిన్నాడు’ క్రియ.</p>'
- kind: text
  heading: కదలని పనులు కూడా క్రియలే
  html: '<p>నడవడం, పరుగెత్తడం మాత్రమే క్రియలు కావు. ఆలోచించడం, నిద్రపోవడం, నవ్వడం కూడా పనులే. ఇవి చెప్పే మాటలూ క్రియలే. ఆలోచించాడు, నిద్రపోయింది, నవ్వాడు అనేవి క్రియలు.</p>'
- kind: text
  heading: 'పని జరిగే సమయం: కాలం'
  html: '<p>పని ఎప్పుడు జరిగింది అని చెప్పడానికి క్రియ రూపం మారుతుంది. దీన్ని <strong>కాలం</strong> అంటారు.</p><ul><li><strong>భూతకాలం</strong>: జరిగిపోయిన పని. సీత పాడింది.</li><li><strong>వర్తమానకాలం</strong>: ఇప్పుడు జరుగుతున్న పని. సీత పాడుతోంది.</li><li><strong>భవిష్యత్ కాలం</strong>: తరువాత జరిగే పని. సీత పాడుతుంది.</li></ul>'
- kind: figure
  svg: '<svg viewBox="0 0 320 130" role="img"><g fill="none" stroke="#14193a" stroke-width="2"><rect x="8" y="30" width="96" height="86" rx="8"/><rect x="112" y="30" width="96" height="86" rx="8"/><rect x="216" y="30" width="96" height="86" rx="8"/><path d="M104 73 H112 M208 73 H216"/></g><g font-size="13" font-weight="700" fill="currentColor" text-anchor="middle"><text x="56" y="22">భూతకాలం</text><text x="160" y="22">వర్తమానకాలం</text><text x="264" y="22">భవిష్యత్ కాలం</text></g><g font-size="14" fill="currentColor" text-anchor="middle"><text x="56" y="62">నిన్న</text><text x="56" y="92">పాడింది</text><text x="160" y="62">ఇప్పుడు</text><text x="160" y="92">పాడుతోంది</text><text x="264" y="62">రేపు</text><text x="264" y="92">పాడుతుంది</text></g></svg>'
  alt: మూడు పెట్టెలు ఎడమ నుండి కుడికి ఉన్నాయి. నిన్న పాడింది, ఇప్పుడు పాడుతోంది, రేపు పాడుతుంది అని మూడు కాలాల రూపాలు రాసి ఉన్నాయి.
  caption: ఒకే పని మూడు కాలాల్లో. నిన్న పాడింది, ఇప్పుడు పాడుతోంది, రేపు పాడుతుంది.
- kind: example
  heading: ఉదాహరణ 1
  prompt: ‘రాము పాఠం చదువుతాడు’ అనే వాక్యాన్ని భూతకాలంలో రాయండి.
  steps:
  - 'వాక్యంలో క్రియ ‘చదువుతాడు’. ఇది తరువాత జరిగే పనిని చెబుతుంది, అంటే భవిష్యత్ కాలం.'
  - 'పని జరిగిపోయిందని చెప్పాలి. కాబట్టి క్రియ రూపం మారాలి: చదువుతాడు నుండి చదివాడు.'
  - 'మిగిలిన మాటలు అలాగే ఉంటాయి: రాము, పాఠం.'
  - 'సరిచూద్దాం: ‘రాము పాఠం చదివాడు’. పని జరిగిపోయింది, కాబట్టి ఇది భూతకాలం.'
- kind: example
  heading: ఉదాహరణ 2
  prompt: ‘పక్షులు ఆకాశంలో ఎగురుతున్నాయి’ అనే వాక్యంలో క్రియను, కాలాన్ని కనుక్కోండి.
  steps:
  - 'వాక్యంలోని పేర్లు: పక్షులు, ఆకాశం. ఇవి నామవాచకాలు.'
  - 'మిగిలిన మాట ‘ఎగురుతున్నాయి’. ఇది పనిని చెబుతుంది, కాబట్టి అది క్రియ.'
  - 'పక్షులు ఇప్పుడు ఎగురుతున్నాయి, అంటే పని జరుగుతూ ఉంది. కాబట్టి ఇది వర్తమానకాలం.'
  - 'సరిచూద్దాం: క్రియ ఎగురుతున్నాయి, కాలం వర్తమానకాలం.'
- kind: callout
  tone: watch
  html: 'తరచుగా వచ్చే పొరపాటు: ‘పాడుతోంది’ వంటి క్రియను భూతకాలం అనుకోవడం. పని ఇంకా జరుగుతూ ఉంటే అది వర్తమానకాలం. జరిగిపోతే భూతకాలం.'
- kind: callout
  tone: real
  html: 'రోజువారీ జీవితంలో: నిన్న ఏం చేశావు, ఇప్పుడు ఏం చేస్తున్నావు, రేపు ఏం చేస్తావు అని అడిగితే మూడు కాలాల క్రియలనే వాడుతాం.'
- kind: check
  item: q-kr-1
- kind: check
  item: q-kr-2
- kind: check
  item: q-kr-3
- kind: summary
  points:
  - 'పని చేయడాన్ని తెలిపే మాటను క్రియ అంటారు.'
  - 'ఆలోచించడం, నిద్రపోవడం వంటి కదలని పనులు చెప్పే మాటలు కూడా క్రియలే.'
  - 'భూతకాలం జరిగిపోయిన పనిని, వర్తమానకాలం ఇప్పుడు జరుగుతున్న పనిని, భవిష్యత్ కాలం తరువాత జరిగే పనిని చెబుతాయి.'
  - 'కాలం మారితే క్రియ రూపం మారుతుంది, నామవాచకం మారదు.'
