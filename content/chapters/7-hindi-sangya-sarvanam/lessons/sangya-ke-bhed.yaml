misconceptions:
- code: sangya-sirf-vyakti
  concept: hindi-sangya
  description: सोचता है कि संज्ञा केवल किसी व्यक्ति के नाम को कहते हैं, वस्तु, स्थान और भाव के नाम को नहीं।
- code: jati-vyakti-mix
  concept: hindi-sangya
  description: जातिवाचक और व्यक्तिवाचक संज्ञा को मिला देता है। विशेष नाम को जाति का नाम या जाति के नाम को विशेष नाम समझ लेता है।
- code: visheshan-bhav
  concept: hindi-sangya
  description: गुण बताने वाले शब्द (विशेषण) को ही भाववाचक संज्ञा मान लेता है, जबकि भाववाचक संज्ञा गुण का नाम होती है।
cards:
- key: sangya-ke-bhed-card-1
  concept: hindi-sangya
  front: संज्ञा किसे कहते हैं?
  back: किसी व्यक्ति, वस्तु, स्थान या भाव के नाम को संज्ञा कहते हैं।
- key: sangya-ke-bhed-card-2
  concept: hindi-sangya
  front: व्यक्तिवाचक संज्ञा क्या होती है? एक उदाहरण दीजिए।
  back: किसी एक विशेष व्यक्ति, वस्तु या स्थान का नाम, जैसे दिल्ली।
- key: sangya-ke-bhed-card-3
  concept: hindi-sangya
  front: जातिवाचक संज्ञा क्या होती है? एक उदाहरण दीजिए।
  back: एक ही प्रकार की सभी चीज़ों का नाम, जैसे नदी।
- key: sangya-ke-bhed-card-4
  concept: hindi-sangya
  front: भाववाचक संज्ञा क्या होती है? एक उदाहरण दीजिए।
  back: गुण, दशा या भाव का नाम, जिसे छू नहीं सकते, जैसे बचपन।
