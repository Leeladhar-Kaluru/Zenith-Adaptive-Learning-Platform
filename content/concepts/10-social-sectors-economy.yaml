concepts:
  - {id: sectors-of-economy, title: "Primary, secondary and tertiary sectors", grade: 10, subject: social, description: "Economic activities are grouped by what they do: primary (from natural resources), secondary (making goods from other goods) and tertiary (services).", keywords: [primary sector, secondary sector, tertiary sector, services, economic activity]}
  - {id: value-added-gdp, title: "Value added and counting GDP", grade: 10, subject: social, description: "GDP is the value of final goods and services made in a year. It is counted by adding the value added at each stage, so that intermediate goods are not counted twice.", keywords: [GDP, value added, final goods, intermediate goods, double counting], prerequisites: [{id: sectors-of-economy, strength: 0.8, why: "Sectors are the base for classifying work and counting value"}]}
  - {id: organised-unorganised, title: "Organised and unorganised sectors", grade: 10, subject: social, description: "Work can be organised (registered, rule-bound, with fixed terms and benefits) or unorganised (small, scattered, irregular, with little security). This is a different split from the three sectors.", keywords: [organised sector, unorganised sector, employment, job security, workers], prerequisites: [{id: sectors-of-economy, strength: 0.8, why: "Sectors are the base for classifying work and counting value"}]}
