- key: q-lt-8
  kind: numeric
  stem: India is at 82.5 E and a place is at 52.5 E. How many minutes does its local time differ from the standard time of India?
  difficulty: challenge
  purpose: test
  concepts:
  - id: longitudes-time
  explanation: 'Both are east, so subtract: 82.5 - 52.5 = 30 degrees. 30 x 4 = 120 minutes. The place at 52.5 E is west of 82.5 E, so it is behind.'
  hints:
  - Subtract the longitudes first, then multiply by 4.
  value: 120
  tolerance: 0.0
  verify: (165/2-105/2)*4
- key: q-lt-9
  pattern: case
  kind: mcq
  stem: Read this note. A class studies two towns. Town M is at 70 E and town N is at 80 E. Both use their own local time. Which statement is correct?
  difficulty: challenge
  purpose: test
  concepts:
  - id: longitudes-time
  explanation: N is 10 degrees east of M. 10 x 4 = 40 minutes. N is further east, so its clock is 40 minutes ahead of M.
  hints:
  - Find the gap in degrees, then multiply by 4. Decide which is east.
  correct: A
  options:
  - key: A
    text: N is 40 minutes ahead of M
  - key: B
    text: N is 40 minutes behind M
    misconception: east-behind
  - key: C
    text: M and N show the same time
  - key: D
    text: N is 10 minutes ahead of M
- key: q-lt-10
  kind: mcq
  stem: 'Assertion (A): A place at 60 E has a clock that is ahead of Greenwich. Reason (R): Places in the east see the Sun earlier than places in the west.'
  difficulty: standard
  purpose: test
  concepts:
  - id: longitudes-time
  explanation: Both are true. Because the Sun reaches the east first, an eastern place has an earlier sunrise and its clock is ahead. R explains A.
  hints:
  - Which way does the Sun seem to travel?
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
- key: q-lt-11
  kind: mcq
  stem: 'Assertion (A): Meridians of longitude are parallel to each other. Reason (R): All meridians run from the North Pole to the South Pole.'
  difficulty: challenge
  purpose: test
  concepts:
  - id: longitudes-time
  explanation: A is false because meridians meet at the poles. R is true. They all go from pole to pole.
  hints:
  - Do lines that meet at a point stay parallel?
  correct: D
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
misconceptions:
- code: east-behind
  concept: longitudes-time
  description: Thinks places in the east have clocks behind those in the west. The Sun reaches the east first, so eastern clocks are ahead.
- code: meridian-parallel
  concept: longitudes-time
  description: Mixes up meridians of longitude with parallels of latitude, such as calling the equator the prime meridian or using latitude for east-west position.
cards:
- key: longitudes-and-time-card-1
  concept: longitudes-time
  front: What is the prime meridian?
  back: The 0 degree line of longitude. It passes through Greenwich.
- key: longitudes-and-time-card-2
  concept: longitudes-time
  front: What is the standard meridian of India?
  back: 82.5 degrees east. Indian Standard Time is based on it.
- key: longitudes-and-time-card-3
  concept: longitudes-time
  front: How much time is 1 degree of longitude?
  back: 4 minutes. So 15 degrees is 1 hour.
- key: longitudes-and-time-card-4
  concept: longitudes-time
  front: 'East or west: which clock is ahead?'
  back: The place that is further east has the clock that is ahead.
