name: Encrypted database backup to Backblaze B2

# Supabase's free plan has no automatic backups. This job dumps only the ZENITH schema, encrypts it on the runner
# with your public age key (only you hold the private key), and uploads it to your private B2 bucket.
# It stays inactive until the repository secrets below exist. Student data never leaves the runner unencrypted.
on:
  schedule:
    - cron: "30 20 * * 0"   # Sundays 20:30 UTC (02:00 Monday in India)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
      AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - name: Check secrets are set
        run: |
          for v in B2_KEY_ID B2_APP_KEY B2_BUCKET AGE_RECIPIENT BACKUP_DATABASE_URL; do
            if [ -z "${!v}" ]; then echo "Missing secret: $v"; exit 1; fi
          done
      - name: Dump the zenith schema
        run: |
          docker run --rm -e PGURL="$BACKUP_DATABASE_URL" postgres:17 sh -c 'pg_dump "$PGURL" --schema=zenith --format=custom --no-owner --no-privileges' > zenith.dump
          test -s zenith.dump
      - name: Encrypt (age)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          age -r "$AGE_RECIPIENT" -o zenith.dump.age zenith.dump
          rm -f zenith.dump
      - name: Upload to B2 (S3 API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_DEFAULT_REGION: eu-central-003
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          aws s3 cp zenith.dump.age "s3://$B2_BUCKET/backups/zenith-$STAMP.dump.age" --endpoint-url "$B2_ENDPOINT"
          aws s3 ls "s3://$B2_BUCKET/backups/" --endpoint-url "$B2_ENDPOINT" | tail -3
