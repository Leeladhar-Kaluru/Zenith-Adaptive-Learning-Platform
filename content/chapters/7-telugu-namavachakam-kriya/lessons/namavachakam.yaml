  - key: C
    text: నది మాత్రమే
  - key: D
    text: రెండూ కావు
    misconception: noun-only-things
- key: q-nv-8
  pattern: case
  kind: mcq
  stem: రాజు ఉదయం పాలు తాగాడు. ‘తాగాడు’ కూడా నామవాచకమే అని రాజు అనుకున్నాడు. రాజు అనుకున్నది సరైనదేనా?
  difficulty: challenge
  purpose: test
  concepts:
  - id: telugu-namavachakam
  explanation: ‘తాగాడు’ ఒక పనిని చెబుతుంది, పేరును కాదు. కాబట్టి అది నామవాచకం కాదు. ‘రాజు’, ‘పాలు’ నామవాచకాలు.
  hints:
  - తాగాడు అనే మాట ఏమి చెబుతుంది, పేరునా పనినా?
  correct: B
  options:
  - key: A
    text: సరైనదే, ఎందుకంటే అది వాక్యంలో ఉంది
    misconception: verb-as-noun
  - key: B
    text: సరైనది కాదు, ఎందుకంటే అది పనిని చెబుతుంది, పేరును కాదు
  - key: C
    text: సరైనది కాదు, ఎందుకంటే పాలు కూడా నామవాచకం కాదు
    misconception: noun-only-things
  - key: D
    text: సరైనదే, ఎందుకంటే పని కూడా ఒక వస్తువు
    misconception: verb-as-noun
misconceptions:
- code: verb-as-noun
  concept: telugu-namavachakam
  description: పని చెప్పే మాటలను (క్రియలను) నామవాచకాలు అనుకోవడం.
- code: noun-only-things
  concept: telugu-namavachakam
  description: నామవాచకం అంటే వస్తువుల పేర్లు మాత్రమే అనుకోవడం. వ్యక్తులు, ప్రదేశాలు, జంతువుల పేర్లను మరచిపోవడం.
- code: plural-direct-lu
  concept: telugu-namavachakam
  description: బహువచనం చేసేటప్పుడు మాట రూపం మారుతుందని గమనించకుండా నేరుగా ‘లు’ చేర్చడం.
cards:
- key: namavachakam-card-1
  concept: telugu-namavachakam
  front: నామవాచకం అంటే ఏమిటి?
  back: వ్యక్తి, వస్తువు, ప్రదేశం, జంతువు పేరును తెలిపే మాట.
- key: namavachakam-card-2
  concept: telugu-namavachakam
  front: మూడు నామవాచకాలు చెప్పండి.
  back: అమ్మ, పుస్తకం, బడి.
- key: namavachakam-card-3
  concept: telugu-namavachakam
  front: ఏకవచనం, బహువచనం అంటే ఏమిటి?
  back: ఒకదాన్ని తెలిపితే ఏకవచనం. ఎక్కువ వాటిని తెలిపితే బహువచనం.
- key: namavachakam-card-4
  concept: telugu-namavachakam
  front: ‘చెట్టు’ బహువచనం ఏమిటి?
  back: చెట్లు.
