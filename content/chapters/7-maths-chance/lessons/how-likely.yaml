slug: how-likely
title: How likely is it?
minutes: 14
objectives:
- Describe the chance of an event as a fraction of equally likely outcomes
- Explain why results of an experiment change from the maths prediction, and why more trials get closer
- Decide whether an outcome is certain, likely, unlikely or impossible
concepts:
- chance-basic
origin: ai_assisted
blocks:
- kind: text
  heading: Measuring chance
  html: <p>Chance tells us how likely something is. If all outcomes are <strong>equally likely</strong>, the chance of an event is
    the number of outcomes you want, divided by the total number of outcomes. A spinner with 6 equal parts and 2 winning parts has a chance of 2 out of 6, which is 1/3.</p>
- kind: widget
  widget: sim_spinner
  config: {parts: 6, hit: 2}
  task: Spin at least 200 times. How close does the experiment get to the maths?
- kind: text
  heading: Experiment and maths
  html: <p>With only a few spins the experiment can be far from the maths. With many spins the result usually settles close to the maths.
    This does not mean the spinner remembers what happened before. Each spin is fresh.</p>
- kind: example
  heading: Worked example
  prompt: A bag has 3 red, 5 blue and 2 green balls. What is the chance of picking a blue ball?
  steps:
  - 'Count all the balls: 3 + 5 + 2 = 10.'
  - 'Count the balls you want. There are 5 blue balls.'
  - 'Chance = 5 out of 10, which is 1/2.'
- kind: callout
  tone: watch
  html: A chance can never be less than 0 or more than 1. If your answer is 3/2, you have put the numbers the wrong way round.
- kind: callout
  tone: real
  html: A weather report says there is a 70 percent chance of rain. That means that on days like this, it rains about 7 times out of 10.
- kind: check
  item: q-ch-1
- kind: check
  item: q-ch-2
- kind: summary
  points:
  - Chance = outcomes you want divided by all equally likely outcomes.
  - A chance is between 0 (impossible) and 1 (certain).
  - More trials usually bring the experiment closer to the maths.
  - Each trial is independent. The spinner does not remember.
items:
- key: q-ch-1
  kind: numeric
  stem: A spinner has 4 equal parts and 1 is red. What is the chance of landing on red? Give a decimal.
  difficulty: intro
  purpose: check
  concepts:
  - id: chance-basic
  explanation: 1 part out of 4 is 1/4, which is 0.25.
  hints:
  - Divide the parts you want by all the parts.
  value: 0.25
  tolerance: 0.0
  verify: 1/4
- key: q-ch-2
  kind: mcq
  stem: A fair die is rolled. What is the chance of getting an even number?
  difficulty: standard
  purpose: check
  concepts:
  - id: chance-basic
    weight: 1.0
  explanation: The even numbers are 2, 4 and 6. That is 3 out of 6, which is 1/2.
  hints:
  - How many even numbers are on a die?
  correct: B
  options:
  - key: A
    text: 1/6
    misconception: counts-one-outcome-only
  - key: B
    text: 1/2
  - key: C
    text: 2/3
    misconception: counts-wrong-total
  - key: D
    text: "3"
    misconception: chance-above-one
- key: q-ch-3
  kind: numeric
  stem: A bag has 3 red, 5 blue and 2 green balls. How many balls are there in total?
  difficulty: intro
  purpose: practice
  concepts:
  - id: chance-basic
  explanation: Add them up. 3 plus 5 plus 2 is 10.
  hints:
  - Add all the colours.
  value: 10
  tolerance: 0.0
  verify: 3+5+2
- key: q-ch-4
  kind: numeric
  stem: A bag has 3 red, 5 blue and 2 green balls. What is the chance of picking a green ball? Give the answer as a decimal.
  difficulty: standard
  purpose: practice
  concepts:
  - id: chance-basic
  explanation: 2 green balls out of 10 is 2/10, which is 0.2.
  hints:
  - Green balls divided by all balls.
  value: 0.2
  tolerance: 0.0
  verify: 2/10
- key: q-ch-5
  kind: mcq
  stem: Which event is impossible when you roll a fair six-sided die?
  difficulty: standard
  purpose: practice
  concepts:
  - id: chance-basic
    weight: 1.0
  explanation: A die only shows 1 to 6, so a 7 can never happen. Its chance is 0.
  hints:
  - Which number is not on the die?
  correct: D
  options:
  - key: A
    text: Getting a 6
  - key: B
    text: Getting a number less than 7
    misconception: confuses-certain-and-impossible
  - key: C
    text: Getting an odd number
  - key: D
    text: Getting a 7
- key: q-ch-6
  kind: truefalse
  stem: If a coin lands heads 5 times in a row, it is more likely to land tails next time.
  difficulty: standard
  purpose: practice
  concepts:
  - id: chance-basic
  explanation: False. A fair coin does not remember. Every toss has the same chance, 1/2.
  hints:
  - Does the coin remember the last toss?
  correct: false
- key: q-ch-7
  kind: numeric
  stem: A spinner has 8 equal parts. 3 are winning parts. What is the chance of winning, as a decimal?
  difficulty: standard
  purpose: practice
  concepts:
  - id: chance-basic
  explanation: 3 out of 8 is 3/8, which is 0.375.
  hints:
  - Winning parts divided by all parts.
  value: 0.375
  tolerance: 0.0
  verify: 3/8
- key: q-ch-8
  kind: numeric
  stem: A fair die is rolled. What is the chance of getting a number greater than 3? Give a decimal.
  difficulty: challenge
  purpose: test
  concepts:
  - id: chance-basic
  explanation: The numbers greater than 3 are 4, 5 and 6. That is 3 out of 6, which is 0.5.
  hints:
  - List the numbers greater than 3.
  value: 0.5
  tolerance: 0.0
  verify: 3/6
- key: q-ch-9
  kind: mcq
  stem: In 20 spins a spinner with a 1/2 chance of winning won 14 times. What is the best explanation?
  difficulty: challenge
  purpose: test
  concepts:
  - id: chance-basic
    weight: 1.0
  explanation: With a small number of spins, results can be far from the maths. More spins usually get closer to 1/2.
  hints:
  - Is 20 spins a lot or a few?
  correct: A
  options:
  - key: A
    text: 20 spins is few, so the experiment can differ from 1/2
  - key: B
    text: The spinner must be broken
    misconception: expects-exact-match
  - key: C
    text: The chance has changed to 14/20
    misconception: expects-exact-match
  - key: D
    text: The maths is wrong
    misconception: expects-exact-match
- key: q-ch-10
  kind: mcq
  stem: Which number cannot be a chance?
  difficulty: standard
  purpose: practice
  concepts:
  - id: chance-basic
    weight: 1.0
  explanation: A chance is always between 0 and 1. The number 1.5 is more than 1, so it cannot be a chance.
  hints:
  - What are the smallest and biggest possible chances?
  correct: C
  options:
  - key: A
    text: "0"
  - key: B
    text: "0.5"
  - key: C
    text: "1.5"
    misconception: chance-above-one
  - key: D
    text: "1"
misconceptions:
- code: counts-one-outcome-only
  concept: chance-basic
  description: Counts only one outcome out of all outcomes, even when more than one outcome is wanted.
- code: counts-wrong-total
  concept: chance-basic
  description: Divides by the wrong total number of outcomes.
- code: chance-above-one
  concept: chance-basic
  description: Gives a chance bigger than 1.
- code: confuses-certain-and-impossible
  concept: chance-basic
  description: Mixes up an event that always happens with one that never happens.
- code: expects-exact-match
  concept: chance-basic
  description: Expects the experiment to match the maths exactly in a small number of trials.
cards:
- key: how-likely-card-1
  concept: chance-basic
  front: How do you find a chance with equally likely outcomes?
  back: Outcomes you want divided by all outcomes.
- key: how-likely-card-2
  concept: chance-basic
  front: What is the smallest and the biggest chance?
  back: 0 means impossible and 1 means certain.
