slug: squares-and-roots
title: Squares and square roots
minutes: 15
objectives:
- Find the square of a number
- Recognise perfect squares
- Find the square root of a perfect square
concepts:
- squares-roots
origin: ai_assisted
blocks:
- kind: text
  heading: Squaring a number
  html: <p>The <strong>square</strong> of a number is the number multiplied by itself. The square of 5 is 5 times 5 = 25.
    We write it as 5 squared. A number like 25 is a <strong>perfect square</strong> because it is a whole number times itself.</p>
- kind: text
  heading: Going backwards
  html: <p>The <strong>square root</strong> undoes squaring. The square root of 25 is 5, because 5 times 5 is 25. Squaring
    and taking the square root are opposite steps, just like adding and subtracting.</p>
- kind: example
  heading: Worked example
  prompt: Find the square root of 144.
  steps:
  - 'Think: which number times itself is 144?'
  - 'Try 10: 10 times 10 is 100. Too small.'
  - 'Try 12: 12 times 12 is 144.'
  - So the square root of 144 is 12.
- kind: callout
  tone: watch
  html: The square of 6 is 6 times 6 = 36. It is not 6 times 2 = 12.
- kind: callout
  tone: real
  html: A square floor with side 7 m has an area of 7 times 7 = 49 square metres. The side is the square root of the area.
- kind: check
  item: q-sq-1
- kind: check
  item: q-sq-2
- kind: summary
  points:
  - The square of a number is the number times itself.
  - A perfect square is a whole number times itself, like 1, 4, 9, 16, 25.
  - The square root undoes squaring.
  - The square root of a perfect square is a whole number.
