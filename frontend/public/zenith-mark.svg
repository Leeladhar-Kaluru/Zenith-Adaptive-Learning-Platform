<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Neo-brutalist hard drop shadow -->
  <polygon points="54,12 88,46 54,92 20,46" fill="#1E1E1E" />
  
  <!-- Kite facets -->
  <!-- Top Left facet: Saffron -->
  <polygon points="50,8 50,42 16,42" fill="#FF9933" stroke="#1E1E1E" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Top Right facet: Warm Pastel Saffron / White -->
  <polygon points="50,8 84,42 50,42" fill="#FEF3C7" stroke="#1E1E1E" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Bottom Left facet: Ultramarine -->
  <polygon points="50,42 50,88 16,42" fill="#1B4965" stroke="#1E1E1E" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Bottom Right facet: Terracotta -->
  <polygon points="50,42 84,42 50,88" fill="#C84B31" stroke="#1E1E1E" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Center Kite Cross / Spars -->
  <line x1="50" y1="8" x2="50" y2="88" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" />
  <line x1="16" y1="42" x2="84" y2="42" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" />

  <!-- Kite Tail / Ribbon Motif -->
  <path d="M50 88 C45 94, 55 98, 50 104" stroke="#1E1E1E" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>
