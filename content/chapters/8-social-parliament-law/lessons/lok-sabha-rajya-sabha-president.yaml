  back: Its members are directly elected by voters. It has 543 elected seats.
- key: lok-sabha-rajya-sabha-president-card-3
  concept: civics-parliament-houses
  front: How is the Rajya Sabha chosen?
  back: By the elected members of the state legislatures. It is a permanent house.
- key: lok-sabha-rajya-sabha-president-card-4
