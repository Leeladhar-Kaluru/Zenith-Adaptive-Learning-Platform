misconceptions:
- code: sarvanam-sangya-alag
  concept: hindi-sarvanam
  description: सर्वनाम को संज्ञा की जगह आने वाला शब्द नहीं समझता। उसे संज्ञा या किसी दूसरे प्रकार का शब्द मान लेता है।
- code: purush-mix
  concept: hindi-sarvanam
  description: उत्तम, मध्यम और अन्य पुरुष को मिला देता है। बोलने वाले, सुनने वाले और जिसके बारे में बात हो, उन तीनों में अंतर नहीं कर पाता।
- code: aap-anya
  concept: hindi-sarvanam
  description: आदर के कारण “आप” को अन्य पुरुष समझ लेता है, जबकि “आप” सुनने वाले के लिए आने से मध्यम पुरुष है।
cards:
- key: sarvanam-ke-bhed-card-1
  concept: hindi-sarvanam
  front: सर्वनाम किसे कहते हैं? एक उदाहरण दीजिए।
  back: संज्ञा के स्थान पर आने वाले शब्द को सर्वनाम कहते हैं, जैसे वह।
- key: sarvanam-ke-bhed-card-2
  concept: hindi-sarvanam
  front: उत्तम, मध्यम और अन्य पुरुष में क्या अंतर है?
  back: उत्तम पुरुष बोलने वाले के लिए, मध्यम पुरुष सुनने वाले के लिए और अन्य पुरुष जिसके बारे में बात हो उसके लिए आता है।
- key: sarvanam-ke-bhed-card-3
  concept: hindi-sarvanam
  front: “आप” किस पुरुष का सर्वनाम है?
  back: मध्यम पुरुष का, क्योंकि यह सुनने वाले के लिए आता है।
- key: sarvanam-ke-bhed-card-4
  concept: hindi-sarvanam
  front: प्रश्नवाचक और अनिश्चयवाचक सर्वनाम में क्या अंतर है?
  back: प्रश्नवाचक सर्वनाम प्रश्न पूछता है, जैसे कौन। अनिश्चयवाचक सर्वनाम किसी निश्चित नाम को नहीं बताता, जैसे कोई।
