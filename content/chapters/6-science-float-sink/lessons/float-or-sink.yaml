  explanation: Mass = density times volume = 4 times 25 = 100 g.
  hints:
  - 'Undo the division: multiply density by volume.'
  value: 100
  tolerance: 0.0
  verify: 4*25
- key: q-fs-10
  kind: mcq
  stem: 'Assertion (A): An object with a density of 0.8 g/cm³ floats in water. Reason (R): The density of the object is less
