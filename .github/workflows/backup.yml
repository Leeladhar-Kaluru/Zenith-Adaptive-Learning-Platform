name: Weekly encrypted backup

# Dumps the ZENITH schema, encrypts it with your BACKUP_KEY, uploads it to the private Backblaze bucket, then downloads
# it again and checks it decrypts. Old backups are deleted by the bucket's 60 day retention rule, so storage stays small.
# Add the repository secrets listed in docs/DEPLOY.md first; the job fails loudly if any is missing.
on:
  schedule:
    - cron: "30 20 * * 0"   # Sundays 20:30 UTC (02:00 Monday in India)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      DB_SCHEMA: zenith
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ops.txt
      - name: Check secrets are set
        run: |
          for v in DATABASE_URL B2_KEY_ID B2_APP_KEY B2_BUCKET BACKUP_KEY; do
            if [ -z "${!v}" ]; then echo "Missing secret for $v"; exit 1; fi
          done
      - run: pip install -r requirements-ops.txt
      - name: Back up
        run: python -m app.cli backup
      - name: Prove the newest backup can be read
        run: python -m app.cli verify latest
