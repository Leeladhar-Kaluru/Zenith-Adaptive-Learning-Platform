name: Speed budget

# Fails a change that makes the app heavier than its budget: entry JavaScript and the first-visit offline download.
on:
  pull_request:
    paths: ["frontend/**"]
  push:
    branches: [master]
    paths: ["frontend/**"]

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run budget
