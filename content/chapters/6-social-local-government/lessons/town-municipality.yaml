slug: town-municipality
title: Towns and cities have a municipality
minutes: 20
objectives:
- Explain why a town or city needs its own local government
- Name services a municipality looks after
- Say how a municipality is like and unlike a gram panchayat
concepts:
- civics-municipality
- civics-local-need
origin: ai_assisted
blocks:
- kind: text
  heading: Many people, many needs
  html: '<p>Think of a busy town. Thousands of people need clean water. Rubbish piles up every day. Rain water must flow away through drains. Streets need lamps and repairs. Someone has to plan all this, or the town would be dirty and hard to live in.</p><p>In towns and cities this work is done by the <strong>municipality</strong>. It is the local government of a town or city.</p>'
- kind: text
  heading: Who runs it
  html: '<p>Like a village, a town chooses its local government by voting. The people of the town elect their members. These members are often called <strong>councillors</strong>. A councillor is an elected member of the municipality.</p><p>The municipality also has a head. In a city the head is often called the <strong>mayor</strong>. In a smaller town the head may be called the <strong>chairperson</strong>. The title can differ from place to place, but the idea is the same: elected people lead the work for the town.</p>'
- kind: text
  heading: What a municipality looks after
  html: '<p>A municipality takes care of the services that people in a town share. These include clean water supply, drains, streets, street lights and the collection of garbage, which is the rubbish that homes and shops throw away.</p><p>A village panchayat and a municipality are alike in one way. Both are local government chosen by the people they serve. They differ in the place they look after: a panchayat looks after a village, and a municipality looks after a town or a city.</p>'
- kind: figure
  svg: <svg viewBox="0 0 320 160" role="img"><rect x="100" y="10" width="120" height="36" rx="6" fill="#ffb800" stroke="#14193a" stroke-width="2"/><text x="160" y="33" font-size="13" text-anchor="middle" fill="#14193a">Municipality</text><line x1="160" y1="46" x2="160" y2="62" stroke="currentColor" stroke-width="2"/><line x1="45" y1="62" x2="275" y2="62" stroke="currentColor" stroke-width="2"/><line x1="45" y1="62" x2="45" y2="76" stroke="currentColor" stroke-width="2"/><line x1="120" y1="62" x2="120" y2="76" stroke="currentColor" stroke-width="2"/><line x1="200" y1="62" x2="200" y2="76" stroke="currentColor" stroke-width="2"/><line x1="275" y1="62" x2="275" y2="76" stroke="currentColor" stroke-width="2"/><rect x="5" y="76" width="80" height="40" rx="6" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><text x="45" y="101" font-size="12" text-anchor="middle" fill="#14193a">Water</text><rect x="80" y="76" width="80" height="40" rx="6" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><text x="120" y="101" font-size="12" text-anchor="middle" fill="#14193a">Drains</text><rect x="160" y="76" width="80" height="40" rx="6" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><text x="200" y="101" font-size="12" text-anchor="middle" fill="#14193a">Streets</text><rect x="235" y="76" width="80" height="40" rx="6" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><text x="275" y="101" font-size="12" text-anchor="middle" fill="#14193a">Garbage</text><text x="160" y="145" font-size="12" text-anchor="middle" fill="currentColor">Led by a mayor or chairperson</text></svg>
  alt: A chart with the municipality at the top joined to four boxes for water, drains, streets and garbage collection.
  caption: A municipality looks after shared town services. It is led by a mayor or a chairperson.
- kind: example
  heading: Worked example
  prompt: Rainwater stands on a town road and mosquitoes breed there. Whom should the residents ask, and why?
  steps:
  - 'Find the kind of problem. Water that does not flow away is a drain problem, which is a shared town service.'
  - 'Shared town services are the work of the municipality.'
  - 'So the residents should tell the municipality, for example through their elected councillor.'
  - 'Check: the town problem goes to the town local government, not to a faraway leader.'
- kind: example
  heading: Worked reasoning
  prompt: Which place would have a municipality, a village of a few families or a big busy city?
  steps:
  - 'Recall: a municipality looks after a town or a city.'
  - 'A village of a few families is looked after by a gram panchayat.'
  - 'A big busy city has a municipality.'
  - 'Check: the city, with its water, drains, streets and garbage, has a municipality.'
- kind: callout
  tone: watch
  html: A municipality is not the same as a gram panchayat. A gram panchayat is for a village. A municipality is for a town or city. Both are elected by local people.
- kind: callout
  tone: real
  html: When a truck comes to collect garbage, when a tap supplies water or when a street light is mended in a town, the municipality is often behind it.
