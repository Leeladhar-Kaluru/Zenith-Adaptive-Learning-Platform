  alt: A plant cell with a thick cell wall, large vacuole, nucleus and green chloroplasts, beside a rounder animal cell with a nucleus and small vacuoles.
  caption: The plant cell has a cell wall, chloroplasts and one large vacuole. The animal cell has none of the first two and only small vacuoles. Both have a membrane, cytoplasm and nucleus.
- kind: example
  heading: Worked example
  prompt: Under a microscope a student sees a cell with a thick outer wall, a large clear space in the middle, and green dots. Is it a plant cell or an animal cell?
  steps:
  - 'List what is seen. There is a thick outer wall, a large central space and green dots.'
  - 'Match each one. A thick outer wall is a cell wall. A large central space is a large vacuole. Green dots are chloroplasts.'
  - 'Check against animal cells. Animal cells have no cell wall, no chloroplasts and only small vacuoles. So the cell cannot be an animal cell.'
  - 'Conclude that it is a plant cell. All three features agree, so this is strong evidence.'
- kind: callout
  tone: watch
  html: Not every plant cell is green. Chloroplasts are found in cells that get light, such as leaf cells. Root cells and the cells of an onion bulb are underground and have no chloroplasts.
- kind: text
  heading: How to compare two cells
  html: '<p>To compare cells, first list what is the same, then what is different. Both plant and animal cells have a cell
    membrane, cytoplasm and a nucleus. A plant cell also has a cell wall, chloroplasts and a large vacuole. An animal cell
    has only a membrane at its outer edge, so its shape can change, and its vacuoles are small.</p><p>The differences link
    to how the living things live. Plants make their own food and stand upright without bones, so their cells carry chloroplasts
    and stiff walls. Animals take in food, so their cells do not need chloroplasts.</p>'
- kind: example
  heading: Worked example
  prompt: A cell is 50 micrometres wide. How many such cells lined up side by side would cover 1 millimetre? (1 millimetre = 1000 micrometres)
  steps:
  - 'We want to know how many widths of 50 micrometres fit into 1000 micrometres.'
  - 'Divide. 1000 ÷ 50 = 20.'
  - 'Check by multiplying back. 20 × 50 = 1000, which equals 1 millimetre.'
  - 'So 20 cells in a row would span 1 millimetre.'
- kind: callout
  tone: real
  html: A doctor can look at a drop of blood under a microscope and see its cells. The shape and number of the cells give clues about health.
- kind: check
  item: q-cl-1
- kind: check
  item: q-cl-2
- kind: check
  item: q-cl-3
- kind: summary
  points:
  - 'The cell is the basic unit of life. Some living things are one cell, others have many.'
  - 'Plant cells and animal cells both have a cell membrane, cytoplasm and a nucleus.'
  - 'A plant cell also has a cell wall, chloroplasts and one large vacuole.'
  - 'Compare cells by listing what is the same, then what is different.'
