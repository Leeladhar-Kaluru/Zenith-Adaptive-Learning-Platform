  - key: C
    text: Reverberation. Curtains reflect the sound back more strongly.
  - key: D
    text: An echo. Curtains absorb the sound before it reflects.
    misconception: echo-reverb-mixup
misconceptions:
- code: sound-in-vacuum
  concept: sound-vibration
  description: Thinks sound can travel through a vacuum, when it needs a medium such as air, water or a solid.
- code: loudness-pitch-mixup
  concept: sound-vibration
  description: Mixes up pitch, which depends on frequency, with loudness, which depends on amplitude.
- code: air-travels-with-sound
  concept: sound-vibration
  description: Thinks the air itself flows from the source to the listener, when only the vibration travels.
- code: sound-is-transverse
  concept: sound-vibration
  description: Pictures sound as an up and down wave like a rope, when air particles move back and forth along the direction of travel.
- code: echo-distance-not-halved
  concept: sound-vibration
  description: Uses the whole distance the sound travelled as the distance to the wall, forgetting it goes there and back.
- code: echo-reverb-mixup
  concept: sound-vibration
  description: Calls a long blur of many reflections an echo, when an echo is a single separate repeat and the blur is reverberation.
cards:
- key: sound-and-vibration-card-1
  concept: sound-vibration
  front: What produces sound, and what does it need to travel?
  back: A vibrating object produces sound. It travels through a medium (solid, liquid or gas) and cannot travel through a vacuum.
- key: sound-and-vibration-card-2
  concept: sound-vibration
  front: What are frequency and pitch, and what is the unit?
  back: Frequency is the number of vibrations per second, in hertz (Hz). A higher frequency gives a higher pitch.
- key: sound-and-vibration-card-3
  concept: sound-vibration
  front: What are amplitude and loudness, and what is the unit of loudness?
  back: Amplitude is the biggest movement from the rest position. A bigger amplitude gives a louder sound, measured in decibels (dB).
- key: sound-and-vibration-card-4
  concept: sound-vibration
  front: What is the speed of sound in air, and how do you find an echo distance?
  back: About 340 m/s. distance = speed × time. For an echo, halve the total distance because the sound goes there and back.
- key: sound-and-vibration-card-5
  concept: sound-vibration
  front: What are compressions and rarefactions, and what kind of wave is sound?
  back: Compressions are crowded, high-pressure regions and rarefactions are spread-out, low-pressure regions. Sound is a longitudinal wave.
- key: sound-and-vibration-card-6
  concept: sound-vibration
  front: Write the wave equation and say what each symbol means.
  back: v = f × λ. Speed v in m/s, frequency f in hertz, wavelength λ in metres.
