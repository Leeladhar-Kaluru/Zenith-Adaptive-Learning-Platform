misconceptions:
- code: all-flow-east
  concept: india-rivers
  description: Thinks every peninsular river flows east to the Bay of Bengal, forgetting that the Narmada and Tapi flow west.
- code: all-flow-west
  concept: india-rivers
  description: Mixes up the direction of the rivers and thinks the big peninsular rivers reach the Arabian Sea, when most reach the Bay of Bengal.
- code: all-rivers-same
  concept: india-rivers
  description: Treats all rivers as alike and does not separate snow-fed Himalayan rivers from rain-fed peninsular rivers.
- code: size-decides
  concept: india-rivers
  description: Thinks the group of a river or its flow in the dry season depends on how long or large it is, instead of on where it begins and how it is fed.
