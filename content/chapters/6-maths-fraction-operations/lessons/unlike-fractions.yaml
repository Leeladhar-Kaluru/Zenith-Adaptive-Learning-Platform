    fill="none" stroke="#14193a" stroke-width="2"/><text x="30" y="76" font-size="13" font-weight="700" fill="currentColor">1/3
    = 2/6</text><rect x="30" y="82" width="40" height="28" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><rect x="70" y="82"
    width="40" height="28" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><rect x="110" y="82" width="40" height="28" fill="none"
    stroke="#14193a" stroke-width="2"/><rect x="150" y="82" width="40" height="28" fill="none" stroke="#14193a" stroke-width="2"/><rect
