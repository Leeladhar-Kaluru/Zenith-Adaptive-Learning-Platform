misconceptions:
- code: municipality-is-panchayat
  concept: civics-municipality
  description: Mixes up the municipality (town or city) with the gram panchayat, gram sabha or sarpanch (village).
- code: municipality-for-everything
  concept: civics-municipality
  description: Thinks the municipality or some faraway body handles every kind of matter, when a municipality looks after local town services such as water, drains, streets and garbage.
