  explanation: “सुंदरता” गुण का नाम है, इसलिए भाववाचक संज्ञा है। “जयपुर” विशेष स्थान का नाम है, इसलिए व्यक्तिवाचक संज्ञा है। “गाँव” जातिवाचक संज्ञा है।
  hints:
  - ऐसा नाम खोजिए जो गुण या भाव बताए और जिसे छू न सकें।
