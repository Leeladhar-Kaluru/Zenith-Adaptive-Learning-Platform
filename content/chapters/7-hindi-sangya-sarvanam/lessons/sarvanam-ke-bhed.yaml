  points:
  - 'संज्ञा के स्थान पर आने वाले शब्द को सर्वनाम कहते हैं। इससे एक ही नाम बार-बार नहीं दोहराना पड़ता।'
  - 'पुरुषवाचक सर्वनाम के तीन भेद हैं: उत्तम पुरुष (बोलने वाला), मध्यम पुरुष (सुनने वाला) और अन्य पुरुष (जिसके बारे में बात हो)।'
