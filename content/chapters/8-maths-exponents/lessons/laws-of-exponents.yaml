slug: laws-of-exponents
title: Laws of exponents
minutes: 30
objectives:
- Write repeated multiplication as a power and read a power correctly
- Use the product, quotient and power rules, and the meaning of zero and negative exponents
- Simplify expressions with integer powers
- Write very large and very small numbers in standard form
concepts:
- exponents-laws
origin: ai_assisted
blocks:
- kind: text
  heading: A short way to write repeated multiplication
  html: '<p>A paper is folded in half again and again. After each fold the number of layers doubles: 2, 4, 8, 16. After 5 folds there are 2 × 2 × 2 × 2 × 2 layers. Writing all those twos is slow. So we write 2<sup>5</sup>.</p><p>In 2<sup>5</sup>, the number 2 is the <strong>base</strong>. It is the number being multiplied. The small raised number 5 is the <strong>exponent</strong>. It tells us how many times the base is used. The whole thing is called a <strong>power</strong>. So 2<sup>5</sup> = 32.</p>'
- kind: figure
  svg: '<svg viewBox="0 0 320 120" role="img"><rect x="10" y="30" width="36" height="36" rx="4" fill="#6cb7ff" opacity=".6" stroke="#14193a" stroke-width="2"/><rect x="54" y="30" width="36" height="36" rx="4" fill="#6cb7ff" opacity=".6" stroke="#14193a" stroke-width="2"/><rect x="98" y="30" width="36" height="36" rx="4" fill="#6cb7ff" opacity=".6" stroke="#14193a" stroke-width="2"/><rect x="152" y="30" width="36" height="36" rx="4" fill="#ffb800" opacity=".7" stroke="#14193a" stroke-width="2"/><rect x="196" y="30" width="36" height="36" rx="4" fill="#ffb800" opacity=".7" stroke="#14193a" stroke-width="2"/><rect x="240" y="30" width="36" height="36" rx="4" fill="#ffb800" opacity=".7" stroke="#14193a" stroke-width="2"/><rect x="284" y="30" width="26" height="36" rx="4" fill="#ffb800" opacity=".7" stroke="#14193a" stroke-width="2"/><text x="28" y="54" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="72" y="54" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="116" y="54" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="170" y="54" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="214" y="54" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="258" y="54" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="297" y="54" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="72" y="92" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">2 × 2 × 2 = 2^3</text><text x="232" y="92" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">2 × 2 × 2 × 2 = 2^4</text><text x="160" y="16" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">All seven twos together: 2^7</text></svg>'
  alt: Seven boxes each holding the number 2, with the first three marked as 2 to the power 3 and the last four marked as 2 to the power 4.
  caption: Three twos multiplied by four twos make seven twos, so 2^3 × 2^4 = 2^7. The exponents add.
- kind: text
  heading: The product, quotient and power rules
  html: '<p>The picture shows the first law. When you multiply powers with the <strong>same base</strong>, you keep the base and <strong>add</strong> the exponents: a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup>.</p><p>Dividing cancels matching factors. When you divide powers with the same base, you <strong>subtract</strong> the exponents: a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup>. For example 3<sup>5</sup> ÷ 3<sup>2</sup> = 3<sup>3</sup>.</p><p>When a power is raised to another power, you <strong>multiply</strong> the exponents: (a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup>. For example (2<sup>3</sup>)<sup>2</sup> = 2<sup>6</sup>. Also, powers with the same exponent can be joined: a<sup>m</sup> × b<sup>m</sup> = (ab)<sup>m</sup>. In all these rules the base a is not zero when it is used for division.</p>'
- kind: text
  heading: Zero and negative exponents
  html: '<p>What should 5<sup>0</sup> mean? Use the quotient rule. Any non-zero number divided by itself is 1. So 5<sup>3</sup> ÷ 5<sup>3</sup> = 1. The rule gives 5<sup>3−3</sup> = 5<sup>0</sup>. So <strong>a<sup>0</sup> = 1</strong> for any non-zero a.</p><p>Now try 2<sup>2</sup> ÷ 2<sup>5</sup>. Cancelling shows it is 1 ÷ (2 × 2 × 2) = 1/8. The rule gives 2<sup>2−5</sup> = 2<sup>−3</sup>. So <strong>a<sup>−n</sup> = 1 ÷ a<sup>n</sup></strong>. A negative exponent does not make the number negative. It means <em>take the reciprocal</em>. The reciprocal of a number is 1 divided by that number. So 2<sup>−3</sup> = 1/8, and (3/2)<sup>−2</sup> = (2/3)<sup>2</sup> = 4/9.</p>'
- kind: example
  heading: Worked example
  prompt: Simplify (2^5 × 2^(-2)) ÷ 2^1 and give the value.
  steps:
  - 'The top part is a product of powers with the same base, so add the exponents: 5 + (−2) = 3. The top part is 2^3.'
  - 'Now divide by 2^1. Subtract the exponents: 3 − 1 = 2. The result is 2^2.'
  - 'Work out the value: 2^2 = 4.'
  - 'Check by hand. 2^5 = 32 and 2^(−2) = 1/4, so the top part is 32 × 1/4 = 8. Then 8 ÷ 2 = 4. It matches.'
- kind: text
  heading: Standard form for very large and very small numbers
  html: '<p>Some numbers are very long, such as 4 500 000 or 0.00032. <strong>Standard form</strong> writes a number as a number from 1 up to (but not including) 10, multiplied by a power of 10. The mass of an object may be 4 500 000 g. We write 4.5 × 10<sup>6</sup> g.</p><p>To write a large number, count how many places the decimal point moves to the left. That count is the exponent. For a number smaller than 1, move the point to the right. The exponent is then <strong>negative</strong>. So 0.00032 = 3.2 × 10<sup>−4</sup>, because the point moves 4 places.</p>'
- kind: example
  heading: Worked example
  prompt: Write 0.000075 in standard form, and write 6.2 × 10^5 as an ordinary number.
  steps:
  - 'For 0.000075, move the decimal point to the right until there is one non-zero digit before it. It moves 5 places and gives 7.5.'
  - 'The point moved right, so the exponent is negative: 0.000075 = 7.5 × 10^(−5).'
  - 'For 6.2 × 10^5, the exponent 5 tells us to move the point 5 places to the right. 6.2 becomes 620000.'
  - 'Check: 7.5 × 10^(−5) = 7.5 ÷ 100000 = 0.000075. It matches the number we started with.'
- kind: callout
  tone: watch
  html: The rules work on the <em>same base</em>. 2<sup>3</sup> × 2<sup>4</sup> is 2<sup>7</sup>, not 4<sup>7</sup>. Also 3<sup>0</sup> is 1, not 0, and 2<sup>−3</sup> is 1/8, not −8.
- kind: callout
  tone: real
  html: Scientists and engineers use standard form all the time. A computer chip is made of parts only tens of billionths of a metre wide, which is a number like 10<sup>−8</sup> m. Distances between cities in metres, or the number of cells in a body, are written with positive powers of 10.
- kind: check
  item: q-ex-1
- kind: check
  item: q-ex-2
- kind: check
  item: q-ex-3
- kind: summary
  points:
  - 'In a^n, a is the base and n is the exponent. a^n means a multiplied by itself n times.'
  - 'Same base: a^m × a^n = a^(m+n), a^m ÷ a^n = a^(m−n), and (a^m)^n = a^(mn).'
  - 'a^0 = 1 for non-zero a, and a^(−n) = 1 ÷ a^n. A negative exponent means reciprocal.'
  - 'Standard form is a number from 1 to below 10 times a power of 10. Small numbers get a negative exponent.'
items:
- key: q-ex-1
  kind: numeric
  stem: Write 2^3 × 2^4 as a single power of 2 and give its value.
  difficulty: intro
  purpose: check
  concepts:
  - id: exponents-laws
  explanation: Same base, so add the exponents. 2^3 × 2^4 = 2^7 = 128.
  hints:
  - Add the exponents 3 and 4, then work out 2 multiplied by itself that many times.
  value: 128
  tolerance: 0.0
  verify: 2**3 * 2**4
- key: q-ex-2
  kind: mcq
  stem: What is the value of 7^0?
  difficulty: intro
  purpose: check
  concepts:
  - id: exponents-laws
  explanation: Any non-zero number to the power 0 is 1. This follows from 7^3 ÷ 7^3 = 7^(3−3) = 7^0, and a number divided by itself is 1.
  hints:
  - Think of 7^3 ÷ 7^3.
  correct: B
  options:
  - key: A
    text: '0'
    misconception: zero-power-is-zero
  - key: B
    text: '1'
  - key: C
    text: '7'
    misconception: zero-power-is-zero
  - key: D
    text: Not defined
- key: q-ex-3
  kind: mcq
  stem: What is the value of 2^(-3)?
  difficulty: intro
  purpose: check
  concepts:
  - id: exponents-laws
  explanation: A negative exponent means the reciprocal. 2^(−3) = 1 ÷ 2^3 = 1/8.
  hints:
  - A negative exponent means 1 divided by the power with the positive exponent.
  correct: C
  options:
  - key: A
    text: '−8'
    misconception: negative-exponent-negative-number
  - key: B
    text: '−6'
    misconception: negative-exponent-negative-number
  - key: C
    text: 1/8
  - key: D
    text: '8'
    misconception: negative-exponent-negative-number
- key: q-ex-4
  kind: numeric
  stem: Find the value of 3^5 ÷ 3^2.
  difficulty: standard
  purpose: practice
  concepts:
  - id: exponents-laws
  explanation: Same base, so subtract the exponents. 3^5 ÷ 3^2 = 3^3 = 27.
  hints:
  - Subtract the exponent of the divisor from the exponent of the dividend.
  value: 27
  tolerance: 0.0
  verify: 3**5 / 3**2
- key: q-ex-5
  kind: mcq
  stem: Which of these equals (2^3)^2?
  difficulty: standard
  purpose: practice
  concepts:
  - id: exponents-laws
  explanation: A power raised to a power means multiply the exponents. 3 × 2 = 6, so (2^3)^2 = 2^6 = 64. You can check it. 2^3 = 8 and 8^2 = 64.
  hints:
  - Check by working out 2^3 first, then squaring the answer.
  correct: D
  options:
  - key: A
    text: 2^5
    misconception: add-exponents-for-power-of-power
  - key: B
    text: 2^9
  - key: C
    text: 4^6
    misconception: multiply-the-bases
  - key: D
    text: 2^6
- key: q-ex-6
  kind: numeric
  stem: Write 0.00032 in standard form as 3.2 × 10^k. What is k?
  difficulty: standard
  purpose: practice
  concepts:
  - id: exponents-laws
  explanation: The decimal point moves 4 places to the right to give 3.2. A move to the right means a negative exponent, so k = −4.
  hints:
  - Count how many places the point moves, and decide if the exponent is positive or negative.
  value: -4
  tolerance: 0.0
  verify: '-4'
- key: q-ex-7
  kind: numeric
  stem: Write 6.2 × 10^5 as an ordinary number.
  difficulty: standard
  purpose: practice
  concepts:
  - id: exponents-laws
  explanation: 10^5 = 100000, and 6.2 × 100000 = 620000.
  hints:
  - Multiply 6.2 by 100000.
  value: 620000
  tolerance: 0.0
  verify: 62 * 10**4
- key: q-ex-8
  kind: mcq
  stem: 'Assertion (A): 9^0 = 1. Reason (R): 9^2 ÷ 9^2 = 9^(2−2) = 9^0, and any non-zero number divided by itself is 1.'
  difficulty: standard
  purpose: test
  concepts:
  - id: exponents-laws
  explanation: Both are true. The reason shows exactly why a power of zero equals 1, so R explains A.
  hints:
  - Check the quotient rule in R. Does it lead to A?
  correct: A
  options:
  - key: A
    text: Both A and R are true, and R explains A
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
- key: q-ex-9
  kind: mcq
  stem: 'Assertion (A): 3^2 × 3^3 = 3^6. Reason (R): When we multiply powers with the same base, we add the exponents.'
  difficulty: challenge
  purpose: test
  concepts:
  - id: exponents-laws
  explanation: R is the correct rule. By that rule 3^2 × 3^3 = 3^(2+3) = 3^5, not 3^6. So A is false and R is true.
  hints:
  - Add the exponents and compare with the exponent in A.
  correct: D
  options:
  - key: A
    text: Both A and R are true, and R explains A
    misconception: multiply-exponents-in-product
  - key: B
    text: Both A and R are true, but R does not explain A
  - key: C
    text: A is true, but R is false
    misconception: multiply-exponents-in-product
  - key: D
    text: A is false, but R is true
- key: q-ex-10
  kind: mcq
  stem: 'Read this. A dust grain is 0.000004 m wide. A cell is 2 × 10^(-5) m wide. Which statement is correct?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: exponents-laws
  explanation: 0.000004 = 4 × 10^(−6). The cell is 2 × 10^(−5) = 20 × 10^(−6), which is 5 times as wide as the grain. So the grain is narrower than the cell, and its standard form is 4 × 10^(−6) m.
  hints:
  - Write the grain in standard form first. Then compare 10^(−6) and 10^(−5).
  correct: B
  options:
  - key: A
    text: The grain is 4 × 10^6 m wide, so it is larger than the cell
    misconception: negative-exponent-negative-number
  - key: B
    text: The grain is 4 × 10^(−6) m wide, so it is narrower than the cell
  - key: C
    text: The grain is 4 × 10^(−5) m wide, so it is wider than the cell
    misconception: miscounted-decimal-places
  - key: D
    text: The grain and the cell have the same width
- key: q-ex-11
  kind: numeric
  stem: 2^x = 1/32. What is the integer x?
  difficulty: challenge
  purpose: test
  concepts:
  - id: exponents-laws
  explanation: 32 = 2^5, so 1/32 = 2^(−5). Therefore x = −5.
  hints:
  - Write 32 as a power of 2, then use the meaning of a negative exponent.
  value: -5
  tolerance: 0.0
  verify: '-5'
- key: q-ex-12
  kind: numeric
  stem: Find the value of (3/2)^(-2) × 9.
  difficulty: challenge
  purpose: test
  concepts:
  - id: exponents-laws
  explanation: (3/2)^(−2) = (2/3)^2 = 4/9. Then 4/9 × 9 = 4.
  hints:
  - Flip the fraction to remove the negative exponent.
  value: 4
  tolerance: 0.0
  verify: Rational(4, 9) * 9
misconceptions:
- code: multiply-the-bases
  concept: exponents-laws
  description: Combines the bases as well, for example turning 2^3 × 2^4 into 4^7, instead of keeping the base and adding exponents.
- code: add-exponents-for-power-of-power
  concept: exponents-laws
  description: Adds the exponents for (a^m)^n instead of multiplying them.
- code: multiply-exponents-in-product
  concept: exponents-laws
  description: Multiplies the exponents when multiplying powers of the same base, instead of adding them.
- code: zero-power-is-zero
  concept: exponents-laws
  description: Thinks that a number to the power 0 is 0, or is the number itself, when it is 1.
- code: negative-exponent-negative-number
  concept: exponents-laws
  description: Thinks a negative exponent makes the number negative, when it means the reciprocal.
- code: miscounted-decimal-places
  concept: exponents-laws
  description: Gets the exponent wrong when writing in standard form by miscounting places or by ignoring the sign.
cards:
- key: laws-of-exponents-card-1
  concept: exponents-laws
  front: What happens to the exponents when you multiply powers of the same base?
  back: You keep the base and add the exponents. a^m × a^n = a^(m+n).
- key: laws-of-exponents-card-2
  concept: exponents-laws
  front: What are a^0 and a^(-n)?
  back: a^0 = 1 for non-zero a, and a^(−n) = 1 ÷ a^n, the reciprocal of a^n.
- key: laws-of-exponents-card-3
  concept: exponents-laws
  front: What is (a^m)^n?
  back: a^(mn). A power of a power means multiply the exponents.
- key: laws-of-exponents-card-4
  concept: exponents-laws
  front: What is standard form?
  back: A number from 1 up to below 10 multiplied by a power of 10, such as 4.5 × 10^6 or 3.2 × 10^(−4).
