slug: subtract-integers
title: Subtracting integers
minutes: 14
objectives:
- Subtract integers by moving left or by adding the opposite
- Handle subtracting a negative number correctly
concepts:
- integers-subtract
origin: ai_assisted
blocks:
- kind: text
  heading: Subtract is add the opposite
  html: <p>Subtracting a number is the same as adding its <strong>opposite</strong>. So 5 - 8 is the same as 5 + (-8), which
    is -3.</p>
- kind: widget
  widget: numberline
  config:
    start: 0
    min: -6
    max: 6
- kind: example
  heading: Worked example
  prompt: Work out 3 - (-4).
  steps:
  - Subtracting -4 is the same as adding the opposite of -4, which is +4.
  - So 3 - (-4) = 3 + 4 = 7.
- kind: callout
  tone: watch
  html: <strong>Two minus signs together:</strong> 3 - (-4) is 7, not -1.
- kind: check
  item: q-int-sub-1
- kind: summary
  points:
  - a - b means a + (-b).
  - Subtracting a negative number makes the result bigger.
  - Check your answer on the number line.
items:
- key: q-int-sub-1
  kind: mcq
  stem: What is 2 - 5?
  difficulty: standard
  purpose: check
  concepts:
  - id: integers-subtract
    weight: 1.0
  explanation: 2 minus 5 means move 5 steps left from 2, which lands on -3.
  hints:
  - Start at 2 and move 5 steps left.
  correct: B
  options:
  - key: A
    text: '3'
    misconception: reverses-subtraction
  - key: B
    text: '-3'
  - key: C
    text: '-7'
  - key: D
    text: '7'
  verify: 2-5
- key: q-int-sub-2
  kind: numeric
  stem: What is -6 - (-4)?
  difficulty: standard
  purpose: practice
  concepts:
  - id: integers-subtract
  explanation: 'Subtracting -4 is adding 4: -6 + 4 = -2.'
  hints:
  - Change the subtraction into adding the opposite.
  value: -2
  tolerance: 0.0
  verify: -6-(-4)
- key: q-int-sub-3
  kind: numeric
  stem: What is 3 - (-4)?
  difficulty: standard
  purpose: test
  concepts:
  - id: integers-subtract
  explanation: 3 - (-4) = 3 + 4 = 7.
  hints:
  - Subtracting a negative adds.
  value: 7
  tolerance: 0.0
  verify: 3-(-4)
- key: q-int-sub-4
  kind: mcq
  stem: What is -10 - 5?
  difficulty: standard
  purpose: practice
  concepts:
  - id: integers-subtract
    weight: 1.0
  explanation: -10 - 5 means 5 more steps left from -10, which is -15.
  hints:
  - Move 5 steps left from -10.
  correct: D
  options:
  - key: A
    text: '-5'
    misconception: subtracts-digits
  - key: B
    text: '5'
  - key: C
    text: '15'
  - key: D
    text: '-15'
  verify: -10-5
- key: q-int-sub-5
  kind: truefalse
  stem: Subtracting -3 from a number makes the number bigger.
  difficulty: intro
  purpose: practice
  concepts:
  - id: integers-subtract
  explanation: Subtracting -3 is the same as adding 3.
  hints:
  - Rewrite as adding the opposite.
  correct: true
- key: q-int-sub-6
  kind: numeric
  stem: At noon the temperature was 4 degrees. By night it was -3 degrees. By how many degrees did it fall?
  difficulty: challenge
  purpose: practice
  concepts:
  - id: integers-subtract
  explanation: The fall is 4 - (-3) = 7 degrees.
  hints:
  - 'Find the difference: 4 - (-3).'
  value: 7
  tolerance: 0.0
  verify: 4-(-3)
misconceptions:
- code: reverses-subtraction
  concept: integers-subtract
  description: Subtracts the smaller number from the larger and ignores direction.
- code: subtracts-digits
  concept: integers-subtract
  description: Subtracts the digits and ignores the sign of -10.
cards:
- key: subtract-integers-card-1
  concept: integers-subtract
  front: What is a - b in terms of adding?
  back: 'a + (-b): add the opposite of b.'
- key: subtract-integers-card-2
  concept: integers-subtract
  front: What is 5 - (-2)?
  back: '7.'
