  hints:
  - Does floating depend on mass alone?
  correct: C
  options:
  - key: A
    text: Both A and R are true, and R explains A
    misconception: heavier-number-sinks
  - key: B
    text: Both A and R are true, but R does not explain A
    misconception: heavier-number-sinks
  - key: C
    text: A is true, but R is false
  - key: D
    text: A is false, but R is true
- key: q-fs-12
  kind: mcq
  stem: A student has two blocks. Block X has a mass of 40 g and a volume of 50 cm³. Block Y has a mass of 100 g and a volume
    of 40 cm³. She drops both into water. What happens?
  difficulty: challenge
  purpose: test
  concepts:
  - id: float-sink
    weight: 1.0
  explanation: 'Block X: 40 divided by 50 = 0.8 g/cm³, which is less than 1, so X floats. Block Y: 100 divided by 40 = 2.5
    g/cm³, which is more than 1, so Y sinks.'
  hints:
  - Find the density of each block first.
  - Compare each density with 1 g/cm³.
  correct: B
  options:
  - key: A
    text: Both sink, because both are heavy
    misconception: heavier-number-sinks
  - key: B
    text: X floats and Y sinks
  - key: C
    text: X sinks and Y floats
  - key: D
    text: Both float
- key: q-fs-13
  kind: numeric
  stem: An object has a mass of 120 g and a density of 3 g/cm³. What is its volume in cm³?
  difficulty: challenge
  purpose: test
  concepts:
  - id: float-sink
  explanation: Volume = mass divided by density = 120 divided by 3 = 40 cm³.
  hints:
  - Density = mass divided by volume. Undo it to find the volume.
  value: 40
  tolerance: 0.0
  verify: 120/3
- key: q-fs-14
  kind: mcq
  stem: A block has a mass of 80 g and a volume of 20 cm³. What is its density?
  difficulty: standard
  purpose: check
  concepts:
  - id: float-sink
    weight: 1.0
  explanation: Density = mass divided by volume = 80 divided by 20 = 4 g/cm³.
  hints:
  - Divide the mass by the volume.
  correct: C
  options:
  - key: A
    text: 80 g/cm³
    misconception: density-is-mass
  - key: B
    text: 0.25 g/cm³
    misconception: volume-over-mass
  - key: C
    text: 4 g/cm³
  - key: D
    text: 100 g/cm³
misconceptions:
- code: heavier-number-sinks
  concept: float-sink
  description: Believes that heavy or large objects always sink, without comparing density.
- code: density-is-mass
  concept: float-sink
  description: Thinks density and mass are the same thing and gives the mass as the density.
- code: volume-over-mass
  concept: float-sink
  description: Divides volume by mass instead of mass by volume.
cards:
- key: float-or-sink-card-1
  concept: float-sink
  front: What is density?
  back: Mass divided by volume.
- key: float-or-sink-card-2
  concept: float-sink
  front: When does an object float in water?
  back: When its density is less than 1 g/cm³.
