- key: q-lin-10
  kind: mcq
  stem: 'Assertion (A): In 5x - 3 = 2x + 9, subtracting 2x from both sides gives 3x - 3 = 9. Reason (R): Whatever is subtracted from one side must also be subtracted from the other side to keep the equation balanced.'
  difficulty: standard
  purpose: test
  concepts:
  - id: linear-eq-both-sides
    weight: 1.0
  explanation: Both statements are true. 5x - 2x = 3x on the left and 2x - 2x = 0 on the right. The reason is exactly why we subtract 2x from both sides.
  hints:
  - Check A by doing the subtraction. Then ask whether R explains why we do it on both sides.
  correct: A
  options:
  - key: A
    text: Both A and R are true and R is the correct explanation of A.
  - key: B
    text: Both A and R are true but R is not the correct explanation of A.
  - key: C
    text: A is true but R is false.
  - key: D
    text: A is false but R is true.
- key: q-lin-11
  kind: mcq
  stem: 'Assertion (A): The solution of 3x + 4 = x + 4 is x = 4. Reason (R): Subtracting 4 from both sides of 3x + 4 = x + 4 gives 3x = x.'
  difficulty: challenge
  purpose: test
  concepts:
  - id: linear-eq-both-sides
    weight: 1.0
  explanation: R is true, since 3x + 4 - 4 = 3x and x + 4 - 4 = x. Then 2x = 0, so x = 0. Check x = 4. The left side is 16 and the right side is 8. So A is false.
  hints:
  - Put x = 4 into both sides and compare.
  correct: D
  options:
  - key: A
    text: Both A and R are true and R is the correct explanation of A.
  - key: B
    text: Both A and R are true but R is not the correct explanation of A.
  - key: C
    text: A is true but R is false.
  - key: D
    text: A is false but R is true.
- key: q-lin-12
  kind: mcq
  stem: 'Case. A tailor charges Rs 50 as a fixed fee plus Rs 10 for each shirt stitched. A second tailor charges Rs 20 for each shirt and no fixed fee. Let n be the number of shirts. For what value of n do both tailors charge the same amount?'
  difficulty: challenge
  purpose: test
  concepts:
  - id: linear-eq-both-sides
    weight: 1.0
  explanation: 'Set the two costs equal: 50 + 10n = 20n. Subtract 10n from both sides: 50 = 10n. Divide by 10: n = 5. Check: 50 + 50 = 100 and 20 x 5 = 100.'
  hints:
  - Write 50 + 10n = 20n and solve it.
  correct: B
  options:
  - key: A
    text: '3'
  - key: B
    text: '5'
  - key: C
    text: '10'
    misconception: stops-early
  - key: D
    text: '30'
- key: q-lin-13
  kind: numeric
  stem: Solve 3(2x + 1) = 5x + 8. What is x?
  difficulty: challenge
  purpose: practice
  concepts:
  - id: linear-eq-both-sides
  explanation: Open the bracket to get 6x + 3 = 5x + 8. Subtract 5x and 3 from both sides, so x = 5.
  hints:
  - Open the bracket first. The 3 multiplies both 2x and 1.
  value: 5
  tolerance: 0.0
  verify: 8-3
misconceptions:
- code: sign-does-not-change
  concept: linear-eq-both-sides
  description: Moves a term across the equal sign but keeps its sign.
- code: bracket-one-term
  concept: linear-eq-both-sides
  description: Multiplies only the first term inside a bracket and leaves the second term unchanged.
- code: stops-early
  concept: linear-eq-both-sides
  description: Stops before the last step and gives the coefficient or a middle number as the answer.
cards:
- key: both-sides-card-1
  concept: linear-eq-both-sides
  front: What happens to a term that crosses the equal sign?
  back: Its sign changes.
- key: both-sides-card-2
  concept: linear-eq-both-sides
  front: How do you solve ax + b = cx + d?
  back: Collect x terms on one side and numbers on the other, then divide.
- key: both-sides-card-3
  concept: linear-eq-both-sides
  front: What is the first step in 5x - 3 = 2x + 9?
  back: Subtract 2x from both sides to get 3x - 3 = 9.
- key: both-sides-card-4
  concept: linear-eq-both-sides
  front: How do you open the bracket in 3(x - 2)?
  back: Multiply every term inside by 3 to get 3x - 6.
