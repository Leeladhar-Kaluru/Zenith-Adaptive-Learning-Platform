  stem: In which part of India does the Thar Desert lie?
  difficulty: intro
  purpose: check
  concepts:
  - id: india-relief
  explanation: The Thar Desert lies in the north-west, mostly in western Rajasthan, to the west of the Aravalli Range.
  hints:
  - It is west of the Aravalli Range.
  correct: C
  options:
  - key: A
    text: The far south, near the Nilgiri hills
    misconception: desert-is-mountain
  - key: B
    text: The north-east, near the Khasi Hills
    misconception: desert-is-mountain
  - key: C
    text: The north-west, west of the Aravalli Range
  - key: D
    text: The east coast
    misconception: desert-is-mountain
- key: q-sg-3
  kind: mcq
  stem: Which range runs close to the west coast and is almost continuous?
  difficulty: intro
  purpose: check
  concepts:
