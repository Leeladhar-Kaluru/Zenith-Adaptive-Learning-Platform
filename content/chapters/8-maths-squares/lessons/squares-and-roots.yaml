- key: q-sq-10
  kind: mcq
  stem: 'Assertion (A): 49 is a perfect square. Reason (R): 49 = 7 x 7, which is a whole number multiplied by itself.'
  difficulty: standard
  purpose: test
  concepts:
  - id: squares-roots
    weight: 1.0
  explanation: Both are true. A perfect square is a whole number times itself, and 7 times 7 is 49. R is the reason A is true.
  hints:
  - Recall what makes a number a perfect square.
  correct: A
  options:
  - key: A
    text: Both A and R are true and R is the correct explanation of A.
  - key: B
    text: Both A and R are true but R is not the correct explanation of A.
  - key: C
    text: A is true but R is false.
  - key: D
    text: A is false but R is true.
- key: q-sq-11
  kind: mcq
  stem: 'Assertion (A): The square of 8 is 16. Reason (R): To square a number, we multiply the number by itself.'
  difficulty: standard
  purpose: test
  concepts:
  - id: squares-roots
    weight: 1.0
  explanation: R is true. By R, the square of 8 is 8 times 8 = 64, not 16. 16 is 8 times 2. So A is false.
  hints:
  - Work out 8 times 8.
  correct: D
  options:
  - key: A
    text: Both A and R are true and R is the correct explanation of A.
    misconception: doubles-instead-of-squares
  - key: B
    text: Both A and R are true but R is not the correct explanation of A.
    misconception: doubles-instead-of-squares
  - key: C
    text: A is true but R is false.
    misconception: doubles-instead-of-squares
  - key: D
    text: A is false but R is true.
