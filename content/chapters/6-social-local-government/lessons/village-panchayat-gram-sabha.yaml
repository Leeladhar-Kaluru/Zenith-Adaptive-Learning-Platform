slug: village-panchayat-gram-sabha
title: Local government and the village panchayat
minutes: 20
objectives:
- Explain why some decisions are best made close to where people live
- Say who belongs to the gram sabha
- Explain how the gram panchayat is chosen and who heads it
- Tell apart the gram sabha from the gram panchayat
concepts:
- civics-local-need
- civics-gram-panchayat
origin: ai_assisted
blocks:
- kind: text
  heading: Problems that are close to home
  html: '<p>The village well is dirty. The road to school is full of holes. The lamp on the lane has been dark for a week. Who should fix these things? The Prime Minister is far away and busy with the whole country. People who live in the village know these problems best.</p><p>So villages, towns and cities have their own <strong>local government</strong>. It is a group of people chosen by the local people to look after local needs, such as water, roads and lights.</p>'
- kind: text
  heading: The gram sabha and the gram panchayat
  html: '<p>In a village, every grown-up who has the right to vote belongs to the <strong>gram sabha</strong>. Gram means village and sabha means meeting. So the gram sabha is a village meeting of all adult voters. They talk about village plans and ask questions.</p><p>It is hard for everyone to decide every small thing. So the villagers elect some people to work for them. These members form the <strong>gram panchayat</strong>. To elect means to choose by voting. The gram panchayat looks after the daily needs of the village.</p><p>The head of the gram panchayat is called the <strong>sarpanch</strong>. The sarpanch leads the work and the meetings.</p>'
- kind: figure
  svg: <svg viewBox="0 0 320 150" role="img"><rect x="10" y="10" width="300" height="40" rx="6" fill="#6cb7ff" stroke="#14193a" stroke-width="2"/><text x="160" y="35" font-size="13" text-anchor="middle" fill="#14193a">Gram sabha (all adult voters)</text><line x1="160" y1="50" x2="160" y2="70" stroke="currentColor" stroke-width="2"/><text x="215" y="66" font-size="11" fill="currentColor">elect</text><rect x="60" y="70" width="200" height="35" rx="6" fill="#ffb800" stroke="#14193a" stroke-width="2"/><text x="160" y="93" font-size="13" text-anchor="middle" fill="#14193a">Gram panchayat members</text><line x1="160" y1="105" x2="160" y2="120" stroke="currentColor" stroke-width="2"/><rect x="110" y="120" width="100" height="26" rx="6" fill="#ffffff" stroke="#14193a" stroke-width="2"/><text x="160" y="138" font-size="13" text-anchor="middle" fill="#14193a">Sarpanch (head)</text></svg>
  alt: A chart with three boxes from top to bottom showing voters electing the gram panchayat, which is headed by the sarpanch.
  caption: The gram sabha elects the members of the gram panchayat. The sarpanch is the head of the gram panchayat.
- kind: example
  heading: Worked example
  prompt: A village needs a new hand pump near the school. Who does what?
  steps:
  - 'The villagers raise the need at a meeting of the gram sabha, where all adult voters can speak.'
  - 'The gram panchayat, the elected members, looks after the daily work of the village, so it plans the hand pump.'
  - 'The sarpanch, as head, leads the panchayat meeting where this is decided.'
  - 'Check: the voters speak, the elected members act, and the sarpanch leads.'
- kind: example
  heading: Worked reasoning
  prompt: Rani is 17 and lives in a village. Is she in the gram sabha?
  steps:
  - 'Recall who belongs to the gram sabha: adults who can vote in the village.'
  - 'A person who is 17 is not yet an adult voter.'
  - 'So Rani is not yet in the gram sabha.'
  - 'Check: she can join it when she becomes an adult voter.'
- kind: callout
  tone: watch
  html: Do not mix up the two names. The gram sabha is all the adult voters of the village. The gram panchayat is the smaller group of elected members. The sarpanch heads the gram panchayat. The gram sabha is a different body, made up of all the adult voters of the village.
- kind: callout
  tone: real
  html: When a village repairs a lane, keeps a well clean or plans a street light, the gram panchayat is often the group that works on it.
- kind: check
  item: q-vp-1
- kind: check
  item: q-vp-2
- kind: check
  item: q-vp-3
- kind: summary
  points:
  - 'Local government is chosen by local people to look after local needs.'
  - 'The gram sabha is all the adult voters of a village.'
  - 'The villagers elect the members of the gram panchayat.'
  - 'The sarpanch is the head of the gram panchayat.'
